วาม หรือโซเชียลมีเดีย มักปลอมตัวเป็นบุคคลหรือหน่วยงานที่มีอำนาจ หรือเสนอของขวัญล่อใจ วิธีที่ไม่ซับซ้อนอาจเป็นเพียงการแอบตามคนเข้าไปในอาคารที่มีการรักษาความปลอดภัย", "hard": [{"w": "impersonating", "th": "ปลอมตัวเป็น"}, {"w": "infiltrate", "th": "แทรกซึมเข้าไป"}]}, {"term": "Symmetric encryption", "def": "An algorithm that uses the same key in both the encryption and the decryption processes.", "term_th": "การเข้ารหัสแบบสมมาตร", "def_th": "อัลกอริทึมที่ใช้กุญแจดอกเดียวกันทั้งในกระบวนการเข้ารหัสและถอดรหัส", "hard": []}, {"term": "Web Server", "def": "A computer that provides World Wide Web (WWW) services on the Internet. It includes the hardware, operating system, Web server software, and Web site content (Web pages). If the Web server is used internally and not by the public, it may be known as an \"intranet server.\"", "term_th": "เว็บเซิร์ฟเวอร์", "def_th": "คอมพิวเตอร์ที่ให้บริการเวิลด์ไวด์เว็บ (WWW) บนอินเทอร์เน็ต ประกอบด้วยฮาร์ดแวร์ ระบบปฏิบัติการ ซอฟต์แวร์เว็บเซิร์ฟเวอร์ และเนื้อหาเว็บไซต์ หากใช้งานภายในองค์กรเท่านั้น อาจเรียกว่า \"อินทราเน็ตเซิร์ฟเวอร์\"", "hard": []}, {"term": "Whaling Attack", "def": "Phishing attacks that attempt to trick highly placed officials or private individuals with sizable assets into authorizing large fund wire transfers to previously unknown entities.", "term_th": "การโจมตีแบบล่าปลาวาฬ", "def_th": "การโจมตีแบบฟิชชิงที่พยายามหลอกลวงเจ้าหน้าที่ระดับสูงหรือบุคคลที่มีทรัพย์สินจำนวนมาก ให้อนุมัติการโอนเงินจำนวนมากไปยังหน่วยงานที่ไม่รู้จักมาก่อน", "hard": [{"w": "sizable assets", "th": "ทรัพย์สินจำนวนมาก"}]}]};

const CHAPTER_COLORS = {
  0: 'var(--ch1)',
  1: 'var(--ch2)',
  2: 'var(--ch3)',
  3: 'var(--ch4)',
  4: 'var(--ch5)'
};
const CHAPTER_VARS = ['--ch1','--ch2','--ch3','--ch4','--ch5'];

const chapterKeys = Object.keys(DATA);

let state = {
  chapterIndex: 0,
  order: [],       // shuffled/unshuffled index order for current chapter
  pos: 0,          // position within order
  flipped: false
};

function shortName(fullTitle){
  // "Chapter 1 - Security Principles" -> "1. Security Principles"
  const m = fullTitle.match(/Chapter (\d+)\s*-\s*(.*)/);
  if(m) return m[1] + '. ' + m[2];
  return fullTitle;
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  chapterKeys.forEach((key, idx) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.style.setProperty('--tab-color', `var(${CHAPTER_VARS[idx]})`);
    const dot = document.createElement('span');
    dot.className = 'dot';
    btn.appendChild(dot);
    const label = document.createElement('span');
    label.textContent = shortName(key);
    btn.appendChild(label);
    btn.addEventListener('click', () => selectChapter(idx));
    tabsEl.appendChild(btn);
  });
  updateTabsActive();
}

function updateTabsActive(){
  const tabsEl = document.getElementById('tabs');
  Array.from(tabsEl.children).forEach((btn, idx) => {
    btn.classList.toggle('active', idx === state.chapterIndex);
  });
}

function selectChapter(idx){
  state.chapterIndex = idx;
  resetOrder();
  updateTabsActive();
  render();
}

function resetOrder(){
  const n = DATA[chapterKeys[state.chapterIndex]].length;
  state.order = Array.from({length:n}, (_,i)=>i);
  state.pos = 0;
  state.flipped = false;
}

function shuffleOrder(){
  const arr = state.order.slice();
  for(let i = arr.length -1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  state.order = arr;
  state.pos = 0;
  state.flipped = false;
  render();
}

function currentCard(){
  const chap = DATA[chapterKeys[state.chapterIndex]];
  const cardIdx = state.order[state.pos];
  return chap[cardIdx];
}

function render(){
  const cardData = currentCard();
  const chapKey = chapterKeys[state.chapterIndex];
  const total = DATA[chapKey].length;

  document.documentElement.style.setProperty('--accent', `var(${CHAPTER_VARS[state.chapterIndex]})`);

  document.getElementById('progressLabel').innerHTML =
    `<b>${state.pos+1}</b> / ${total}`;
  document.getElementById('chapterName').textContent = shortName(chapKey);
  document.getElementById('progressFill').style.width = ((state.pos+1)/total*100) + '%';

  document.getElementById('defText').textContent = cardData.def;
  document.getElementById('termText').textContent = cardData.term;
  document.getElementById('termTh').textContent = cardData.term_th;
  document.getElementById('defThText').textContent = cardData.def_th;

  const hwBlock = document.getElementById('hardwordsBlock');
  const hwList = document.getElementById('hwList');
  hwList.innerHTML = '';
  if(cardData.hard && cardData.hard.length > 0){
    hwBlock.style.display = 'block';
    cardData.hard.forEach(h => {
      const chip = document.createElement('span');
      chip.className = 'hw-chip';
      chip.innerHTML = `<span class="w">${h.w}</span><span class="sep">—</span><span class="t th">${h.th}</span>`;
      hwList.appendChild(chip);
    });
  } else {
    hwBlock.style.display = 'none';
  }

  const cardEl = document.getElementById('card');
  cardEl.classList.toggle('flipped', state.flipped);
}

function flip(){
  state.flipped = !state.flipped;
  document.getElementById('card').classList.toggle('flipped', state.flipped);
}

function next(){
  const chapKey = chapterKeys[state.chapterIndex];
  const total = DATA[chapKey].length;
  state.pos = (state.pos + 1) % total;
  state.flipped = false;
  render();
}

function prev(){
  const chapKey = chapterKeys[state.chapterIndex];
  const total = DATA[chapKey].length;
  state.pos = (state.pos - 1 + total) % total;
  state.flipped = false;
  render();
}

document.getElementById('card').addEventListener('click', flip);
document.getElementById('flipBtn').addEventListener('click', flip);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('shuffleBtn').addEventListener('click', shuffleOrder);
document.getElementById('resetBtn').addEventListener('click', () => { resetOrder(); render(); });

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight'){ next(); }
  else if(e.key === 'ArrowLeft'){ prev(); }
  else if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); flip(); }
});

// basic touch swipe support
let touchStartX = null;
const stageEl = document.querySelector('.stage');
stageEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; });
stageEl.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){
    if(dx < 0) next(); else prev();
  }
  touchStartX = null;
});

buildTabs();
resetOrder();
render();
</script>
</body>
</html>
