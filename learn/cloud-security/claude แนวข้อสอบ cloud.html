<style>

ul{padding-left:22px;margin:8px 0}
li{margin:4px 0}
mark{background:rgba(250,204,21,.25);color:inherit;padding:0 4px;border-radius:4px;font-weight:600}

.btn{padding:8px 14px;border:0;border-radius:8px;background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-family:inherit}

topics:[

 p:["<mark>Asset</mark> = สิ่งมีคุณค่าที่ต้องปกป้อง (ระบบ ข้อมูล บุคลากร บริการ)","<mark>Threat</mark> = ผู้ก่อเหตุ/เหตุการณ์ที่อาจสร้างความเสียหาย (Hacker, Malware, Phishing, Insider, ภัยธรรมชาติ)","<mark>Vulnerability</mark> = จุดอ่อน (Weak Password, Unpatched Software, Misconfiguration, Excessive Privilege, Human Error)","<mark>Risk</mark> = Likelihood × Impact เมื่อ Threat ใช้ Vulnerability กระทบ Asset","<mark>Attack Vector</mark> = เส้นทาง/วิธีโจมตี 3 กลุ่ม: <b>Human-based</b> (Phishing), <b>Network-based</b> (ช่องโหว่ซอฟต์แวร์, เว็บปลอม, Remote Access อ่อน), <b>Physical</b> (USB/Removable Media)","<mark>Risk Register</mark> = ทะเบียนบันทึก/จัดลำดับความเสี่ยง พร้อม Owner, Control, สถานะ"]},
{t:"2) Evidence-Driven Security: 5 แหล่งหลักฐาน",

{t:"3) 4 เสาหลักภัยคุกคามบน Cloud",

 p:["<b>Misconfiguration</b> – 3 มิติ: <mark>Public</mark> + <mark>Privileged</mark> + <mark>Unmonitored</mark> พร้อมกัน = High Likelihood Zone (เช่น Security Group 0.0.0.0/0, IAM wildcard *, ปิด Logging)","<b>Credential Leakage</b> – ผู้โจมตีไม่ 'Break in' แต่ 'Log in'; แนวคิด <mark>Identity as the New Perimeter</mark>: Role + Temporary Credential + MFA + Least Privilege; Long-lived key = ระเบิดเวลา","<b>Insecure APIs</b> – Authentication ผ่าน ≠ Authorization ถูกต้อง; ตรวจ Object-level/Function-level, Rate Limit, Schema validation","<b>Data Exposure</b> – Public Bucket, Signed URL หลุด, Snapshot แชร์ผิดคน, API ส่ง PII เกินจำเป็น","ภัยจริงมักเกิดจากการ <b>ผสม</b> ทั้ง 4 ปัจจัย"]},
{t:"4) Vulnerability ลึกขึ้น: ประเภท, CVE/CVSS, Auth Gap, Lifecycle",
 f:"<b>CVE</b> = เลขบัตรประชาชนของช่องโหว่ (ระบุตัวตน) / <b>CVSS</b> = คะแนนความรุนแรงเชิงเทคนิค (เหมือนระดับความดุของสุนัข) แต่ถ้าสุนัขดุ <i>ถูกล่ามอยู่ในบ้านที่ไม่มีใครเข้า</i> ก็เสี่ยงน้อยกว่าสุนัขธรรมดาที่เดินอยู่หน้าบ้านคุณ นั่นคือ <mark>Contextual Risk</mark> = CVSS + Business Context",
 p:["ประเภท: <mark>Configuration</mark>, <mark>Software</mark>, <mark>Identity</mark>, <mark>Design</mark>","Business Context = Asset Criticality + Data Sensitivity + Compensating Controls","<b>Authentication Gap</b>: รหัสผ่านเดาง่าย, Session/Token อายุยาว → แก้ด้วย Federation, Short-lived token, MFA (ระวัง Impossible travel, Token reuse)","<b>Authorization Gap</b>: Login ได้แต่ทำสิ่งที่ไม่ควรได้ → <mark>BOLA</mark> (เปลี่ยน Object ID เห็นข้อมูลคนอื่น), <mark>Function-level flaw</mark> (User เรียกคำสั่ง Admin) → Deny-by-default","<b>Vulnerability Lifecycle</b> (ลูป 4 ขั้น): <mark>Discover → Triage → Remediate → Verify</mark>","Secrets: ห้าม Hardcode, ใช้ Managed Secret Store + Rotation; Patch: ต้องมี Patch SLA, ทดสอบ Staging, มี Rollback Plan"]},
{t:"5) Risk: สูตร, Matrix, Residual, 4 การตัดสินใจ",

 p:["<mark>Risk Score = L × I</mark> (สเกล 1–5 ทั้งคู่)","<b>17–25 Critical</b> → Escalate ผู้บริหาร/Incident Response ทันที | <b>10–16 High</b> → เร่งลด/ติดตามใกล้ชิด | <b>5–9 Medium</b> → กำหนด Owner + Due Date | <b>1–4 Low</b> → Monitor ตามรอบปกติ","Impact พิจารณา CIA, Downtime, ค่าปรับ, <mark>Reputation Damage</mark> (มักแพงที่สุด)","<mark>Inherent Risk</mark> (ก่อน Control) → ใส่ Control → <mark>Residual Risk</mark> (หลัง Control); ถ้ายังเกิน Risk Appetite ต้องเพิ่ม Control หรือผู้บริหารเซ็นยอมรับ","Control ลด Likelihood (MFA, Key Rotation) หรือลด Impact (Backup, Segmentation)","<b>4 Risk Decisions</b>: <mark>Avoid</mark> (เลิก/ปิด), <mark>Mitigate</mark> (เพิ่ม Control), <mark>Transfer</mark> (ประกัน/สัญญา), <mark>Accept</mark> (ต้องอนุมัติเป็นลายลักษณ์อักษร + Owner + วันทบทวน) — 'ไม่ทำอะไร' ไม่ใช่ Accept แต่คือความประมาท","Tie-breaker: Asset ที่ Critical กว่า หรือ Quick Win; Accelerators: Exploit Evidence, Regulatory Deadline","Blueprint: Identify → Calculate (L×I) → Prioritize → Apply Controls → Decide"]}
],
kw:[["Asset","ทรัพย์สินที่มีคุณค่าที่ต้องปกป้อง"],["Threat","ผู้ก่อเหตุ/เหตุการณ์ที่อาจสร้างความเสียหาย"],["Vulnerability","จุดอ่อนที่ถูก Threat ใช้ประโยชน์"],["Risk","Likelihood × Impact เมื่อ Threat กระทบ Asset"],["Attack Vector","เส้นทาง/วิธีโจมตี (Human/Network/Physical)"],["CISA KEV","แคตตาล็อกช่องโหว่ที่ถูกโจมตีจริง → จัดลำดับ Patch"],["Shadowserver","ดูบริการที่เปิดสู่ Internet (Exposure)"],["Cloudflare Radar","ดู Traffic/DDoS/Bot ระดับ Internet"],["Verizon DBIR","รายงานรูปแบบ Breach จริง"],["IBM Cost of a Data Breach","แปลง Breach เป็นต้นทุนทางธุรกิจ"],["3 Dimensions of Misconfig","Public + Privileged + Unmonitored"],["Identity as the New Perimeter","ตัวตนคือเส้นขอบเขตใหม่ (Role, MFA, Least Privilege)"],["BOLA","Broken Object Level Authorization – เปลี่ยน ID เห็นข้อมูลคนอื่น"],["CVE","รหัสระบุตัวตนช่องโหว่"],["CVSS","คะแนนความรุนแรงเชิงเทคนิค"],["Contextual Risk","CVSS + Business Context = Actual Risk"],["Vulnerability Lifecycle","Discover → Triage → Remediate → Verify"],["Inherent / Residual Risk","ความเสี่ยงก่อน / หลังใส่ Control"],["Risk Decision","Avoid, Mitigate, Transfer, Accept"],["Risk Register","ทะเบียนความเสี่ยง (Owner, Due Date, Control)"]],
quiz:[
{q:"องค์กรพบ Security Group เปิด 0.0.0.0/0 พร้อมสิทธิ์ IAM กว้างและไม่มี Log ใครดูแล ตามกรอบ 3 Dimensions ข้อใดถูกต้อง?",c:["เป็น Low Risk เพราะแต่ละข้อเป็นแค่ปัญหาเล็ก","ครบ Public+Privileged+Unmonitored → High Likelihood Zone","เป็นปัญหา Authentication Gap เท่านั้น","เป็น Physical Attack Vector"],a:1,w:"ทั้ง 3 มิติเกิดพร้อมกัน = High Likelihood Zone. ข้อ ก ผิดเพราะรวมกันแล้วยิ่งเสี่ยง, ค คือเรื่อง Auth ไม่ใช่ Config, ง ไม่เกี่ยวกับการเข้าถึงทางกายภาพ"},
{q:"ผู้โจมตีส่งอีเมลหลอกพนักงานให้กรอกรหัสผ่าน จัดเป็น Attack Vector ประเภทใด?",c:["Physical","Network-based","Human-based","Design flaw"],a:2,w:"Phishing หลอกผู้ใช้ = Human-based. Network-based คือโจมตีผ่านเครือข่าย/ช่องโหว่ซอฟต์แวร์, Physical คือ USB/เข้าถึงอุปกรณ์"},

{q:"'Authentication ผ่าน ไม่ได้แปลว่า Authorization ถูกต้อง' เหมาะกับช่องโหว่ใดที่สุด?",c:["Hardcoded Secret","BOLA","Unpatched CVE","Public Snapshot"],a:1,w:"BOLA: ล็อกอินแล้วเปลี่ยน Object ID เห็นข้อมูลคนอื่น = Authorization Gap"},

{t:"2) States of Data & การปกป้อง 3 สภาวะ <span class='exam'>ออกสอบ: เติมคำ</span>",

 ["Data in Transit / Motion","ส่งอีเมล, ดาวน์โหลด, Sync","Email Encryption, Managed File Transfer, DLP, CASB, Digital Rights Management"],
 ["Data in Use","Word, Database, CPU/RAM","Identity Management Tools, Role Based Access Control (RBAC), Digital Rights Management"]]},
 p:["At Rest ปกป้องด้วยเข้ารหัสไฟล์; In Transit ด้วย HTTPS/TLS/VPN; In Use ในหน่วยความจำ (RAM)","ใน AWS: At Rest = SSE-S3 (provider-managed), SSE-KMS (customer-controlled key + audit trail), Client-Side; In Transit = TLS 1.2+"]},
{t:"3) Data Lifecycle Management (DLM) 6 ขั้น",

 p:["<mark>Create → Store → Use → Publish → Archive → Destroy</mark>","<b>Archive</b> = คัดลอกเก็บระยะยาว ไม่แก้ไข เรียกใช้ใหม่ได้เมื่อต้องการ","<b>Destroy</b> = ทำลายเมื่อหมดอายุ เพื่อไม่ให้ถูกใช้ผิดวัตถุประสงค์"]},
{t:"4) Cloud Storage & Storage Access Control",

 tbl:{h:["ประเภท","ตัวอย่าง AWS","ลักษณะ"],r:[

 ["Hybrid","AWS Storage Gateway","Virtual appliance on-prem + local cache + S3 backend (File/Volume/Tape Gateway)"]]},

{t:"5) Encryption, Envelope Encryption & KMS Lifecycle",
 f:"<mark>Envelope Encryption</mark> เหมือน <b>ล็อกพัสดุใหญ่ด้วยกุญแจชั่วคราว (Data Key) แล้วเอากุญแจนั้นใส่ซองล็อกด้วยกุญแจแม่ (KMS Key)</b> เก็บกุญแจแม่ไว้ในตู้เซฟที่ไม่ออกมานอกตึกเลย — เร็วกว่าเพราะไม่ต้องส่งพัสดุหนักไปให้กุญแจแม่ล็อกโดยตรง",
 p:["Data Key เข้ารหัส Plaintext → <b>Ciphertext</b>; KMS Key เข้ารหัส Data Key → <b>Encrypted Data Key</b>; เก็บ Ciphertext คู่กับ Encrypted Data Key; มีแต่ KMS Key ที่อยู่ใน Vault","<b>KMS Key Lifecycle 5 ขั้น</b>: <mark>Creation → Usage → Rotation → Disablement → Deletion</mark> (CMK vs AWS-Managed Keys; Deletion = ตั้งเวลาลบถาวร)","KMS Key ไม่ถูกดึงออกจากระบบคลาวด์ (HSM-backed / FIPS 140-2 สำหรับระดับสูง)"]},
{t:"6) Secrets Management & AWS Secrets Manager",
 f:"Hardcode รหัสผ่านในโค้ดเหมือน <b>เขียนรหัสตู้เซฟไว้บนตู้</b> — Secrets Manager คือ <b>ผู้ดูแลกุญแจ</b> ที่ให้แอปมา 'ขอยืมรหัสตอนใช้' และเปลี่ยนรหัสให้เองเป็นระยะโดยแอปไม่ต้องหยุดทำงาน ส่วน KMS คือ <b>ช่างทำกุญแจ</b> ที่ทำ/ดูแลตัวกุญแจเข้ารหัส ไม่ได้เก็บรหัสผ่านให้แอป",
 tbl:{h:["เปรียบเทียบ","Secrets Manager","SSM Parameter Store","KMS"],r:[
 ["เก็บอะไร","Credentials: DB password, API key, token","ค่า Config ทั่วไป","Cryptographic keys"],
 ["Automated Rotation","มี (ผ่าน Lambda)","ไม่มี (ต้องทำเอง)","Rotate key material"],
 ["ค่าใช้จ่าย","$0.40/secret/เดือน + $0.05/10,000 API calls","มี Free Tier (Standard)","—"],
 ["รูปแบบใช้","App ดึงค่า secret ตอน runtime","เก็บ config","App ส่งข้อมูลให้ KMS เข้ารหัส"]]},
 p:["<mark>Secrets Sprawl</mark> = Secrets กระจายใน Source Code, Git, CI/CD Logs, Docker, Slack","ความสามารถ: <b>Automated Rotation</b> (Lambda เปลี่ยนรหัสใน RDS/Redshift + อัปเดต Vault, ไม่ Downtime), <b>Client-Side Caching</b> (ลด Latency + ค่า API), <b>Cross-Region Replication</b> (DR), KMS Encryption","Retrieval: App เรียก <code>GetSecretValue</code> → Secrets Manager ตรวจ IAM → ให้ KMS ถอดรหัส → ส่งกลับผ่าน TLS","Native: AWS Secrets Manager (Rotation ผ่าน Lambda), Azure Key Vault (Secrets+Keys+Certs, HSM, Entra ID), GCP Secret Manager (เรียบง่าย ต้องเขียน Rotation เอง); Multi-cloud: HashiCorp Vault (Dynamic Secrets, ซับซ้อน), Doppler (DevEx), Infisical (Secret Sync)","หลัก: Zero Hardcoding, Least Privilege & RBAC, Separation of Duties, Continuous Audit; Secret Lifecycle: Create → Store → Use → Rotate → Revoke"]},
{t:"7) Governance, Audit & Compliance + Checklist",
 f:"เหมือน <b>กล้องวงจรปิด + สมุดบันทึกเข้าออก + กล่องที่ลบไม่ได้</b>: ใครทำอะไรต้องย้อนดูได้ (CloudTrail) มีตำรวจนอกเครื่องแบบคอยหาของสำคัญที่วางเกลื่อน (Macie) และมีกล่องหลักฐานที่ล็อกไว้ ใครก็ลบ/แก้ไม่ได้ (Object Lock/WORM)",
 p:["<mark>Amazon Macie</mark> = ใช้ ML ทำ Data Discovery หา PII/Sensitive data ที่ไม่เข้ารหัสใน S3","<mark>S3 Object Lock / WORM</mark> (Write Once Read Many) = ป้องกัน Ransomware + Retention ตามกฎหมาย","<mark>CloudTrail</mark> (API Activity) + S3 Server Access Logging → Audit; มาตรฐาน PCI-DSS, GDPR, SOC 2, HIPAA, ISO 27001","<b>Checklist 4 ข้อ</b>: <mark>Zero Hardcoding</mark>, <mark>Least Privilege</mark> (แยก IAM กับ Resource policy), <mark>Encrypt Everything</mark> (At Rest=KMS, In Transit=TLS), <mark>Continuous Audit</mark> (Logs + ทดสอบ Immutable Backup)","Anatomy of a breach: Secret รั่วใน Git → ใช้ Credential สิทธิ์กว้าง → เจอ Public Bucket → โหลด plaintext | ป้องกันทีละชั้น: Secrets Scanning/Manager → Least Privilege → Block Public Access → Envelope Encryption"]}
],
kw:[["Data Classification","จัดหมวดหมู่/ติดฉลากข้อมูลตามความอ่อนไหว"],["5 Sensitivity Levels","Public, Internal, Confidential, Highly Confidential, Restricted"],["Data at Rest","ข้อมูลที่เก็บนิ่ง → เข้ารหัสไฟล์/Disk/DB"],["Data in Transit","ข้อมูลที่เคลื่อนผ่านเครือข่าย → TLS/HTTPS/VPN"],["Data in Use","ข้อมูลที่กำลังใช้งานใน RAM → IAM/RBAC/DRM"],["DLM","Create, Store, Use, Publish, Archive, Destroy"],["IAM Policy / Bucket Policy / KMS Key Policy","The Who / The Where / The How"],["Explicit Deny Wins","Deny ชนะ Allow เสมอ"],["Block Public Access","ปิดการตั้งค่าเปิด Public ของ S3"],["Envelope Encryption","Data Key เข้ารหัสข้อมูล, KMS Key เข้ารหัส Data Key"],["KMS Lifecycle","Creation, Usage, Rotation, Disablement, Deletion"],["Secrets Sprawl","Secrets กระจายไปใน Code/Git/Logs/Chat"],["AWS Secrets Manager","เก็บ+หมุนเวียน Credentials อัตโนมัติ (Lambda)"],["SSM Parameter Store","เก็บ Config ฟรี ไม่มี Rotation ในตัว"],["Amazon Macie","ค้นหา PII ใน S3 ด้วย ML"],["S3 Object Lock / WORM","Write Once Read Many กัน Ransomware"],["CloudTrail","บันทึก API activity เพื่อ Audit"],["Client-Side Caching","SDK cache secret ลด Latency/ค่า API"]],
quiz:[
{q:"ข้อมูลใดควรจัดเป็นชั้น Restricted (Level 4)?",c:["เอกสารประชาสัมพันธ์","ข้อมูลบัตรเครดิตและ PII อ่อนไหว","ข้อมูลการตลาดภายใน","เนื้อหาเว็บไซต์บริษัท"],a:1,w:"Restricted = เสี่ยงสูงสุด เข้าถึงเฉพาะ Data Owner เช่น PII อ่อนไหว Credit Card"},
{q:"Data in Use ควรป้องกันด้วยข้อใดมากที่สุด?",c:["Full Disk Encryption","Email Encryption","Role Based Access Control / Identity Management","Managed File Transfer"],a:2,w:"In Use → Identity Management, RBAC, DRM. FDE = At Rest; Email Encryption/MFT = In Transit"},
{q:"ข้อใดเป็นการป้องกัน Data at Rest ที่ถูกต้อง?",c:["Full Disk Encryption, File/Database Encryption, DLP, CASB","Email Encryption เท่านั้น","TLS เท่านั้น","RBAC เท่านั้น"],a:0,w:"At Rest: Full Disk, File Level, Database Encryption, DRMS, Mobile Device, DLP, CASB"},
{q:"ลำดับ Data Lifecycle ที่ถูกต้องคือ?",c:["Create, Use, Store, Archive, Publish, Destroy","Create, Store, Use, Publish, Archive, Destroy","Store, Create, Use, Publish, Destroy, Archive","Create, Store, Publish, Use, Destroy, Archive"],a:1,w:"Create → Store → Use → Publish → Archive → Destroy"},
{q:"IAM Policy อนุญาตแล้ว Bucket Policy ก็อนุญาต แต่มี Explicit Deny ใน Policy หนึ่ง ผลลัพธ์?",c:["อนุญาต เพราะมี Allow สองที่","ปฏิเสธ เพราะ Explicit Deny wins","ขึ้นกับว่า Policy ไหนใหม่กว่า","อนุญาตเฉพาะ Read"],a:1,w:"ลำดับตัดสิน: Explicit Deny → Explicit Allow → Implicit Deny"},
{q:"ใน Envelope Encryption ข้อใดถูกต้อง?",c:["KMS Key เข้ารหัส Plaintext ขนาดใหญ่โดยตรง","Data Key เข้ารหัสข้อมูล แล้ว KMS Key เข้ารหัส Data Key","เก็บ KMS Key ไว้คู่กับ Ciphertext","Data Key ไม่ต้องเข้ารหัส"],a:1,w:"Data Key เข้ารหัสข้อมูลใหญ่ (เร็ว) แล้ว KMS Key ห่อ Data Key; มีแต่ KMS Key ที่อยู่ใน Vault ไม่ออกมาด้านนอก"},
{q:"ขั้นตอนใดไม่อยู่ใน KMS Key Lifecycle?",c:["Rotation","Disablement","Publish","Deletion"],a:2,w:"KMS Lifecycle: Creation, Usage, Rotation, Disablement, Deletion — Publish เป็นของ DLM"},
{q:"แอปต้องการหมุนเวียนรหัสผ่าน RDS อัตโนมัติโดยไม่ Downtime ควรเลือก?",c:["SSM Parameter Store","AWS Secrets Manager","S3 Bucket Policy","CloudTrail"],a:1,w:"Secrets Manager รองรับ Automated Rotation ผ่าน Lambda; Parameter Store ไม่มีในตัว"},
{q:"ข้อใดแยก KMS กับ Secrets Manager ได้ถูกต้อง?",c:["KMS เก็บรหัส DB, Secrets Manager เก็บ Cryptographic keys","KMS จัดการ Cryptographic keys, Secrets Manager จัดการ Credentials และใช้ KMS เข้ารหัส secret","ทั้งสองเหมือนกันทุกประการ","Secrets Manager ฟรีเสมอ"],a:1,w:"KMS = ช่างทำกุญแจ; Secrets Manager = ผู้ดูแลรหัสผ่านที่ใช้ KMS เบื้องหลัง"},
{q:"ต้องการป้องกัน Ransomware ลบ/แก้ไฟล์ Backup ตามระยะเวลา Retention ควรใช้?",c:["Amazon Macie","S3 Object Lock (WORM)","SSM Parameter Store","Block Public Access"],a:1,w:"Object Lock/WORM ล็อกไฟล์ไม่ให้แก้/ลบ; Macie = หา PII"}
]});

/* ---------- Session 8 ---------- */
C.push({
id:"s8", title:"Session 8: AWS Well-Architected Framework",
lead:"'สถาปัตยกรรมที่ดีไม่ใช่จุดหมายปลายทาง แต่คือกระบวนการพัฒนาที่ไม่หยุดนิ่ง' (Continuous Improvement)",
topics:[
{t:"1) 6 เสาหลัก (6 Pillars)",
 f:"นึกถึง <b>การสร้างบ้านที่ดี</b>: แข็งแรงปลอดภัย (Security), บริหารบ้านเป็นระบบ (Operational Excellence), ไฟดับก็ไม่ล่ม (Reliability), ใช้พื้นที่คุ้มเหมาะการใช้งาน (Performance Efficiency), ค่าไฟไม่บานปลาย (Cost Optimization), และไม่ทำลายสิ่งแวดล้อม (Sustainability)",
 tbl:{h:["Pillar","โฟกัส","หลักการ/กลไกสำคัญ"],r:[
 ["Security","ปกป้องข้อมูลและระบบ","IAM, Log analysis, Encryption — พร้อมรับ Incident"],
 ["Operational Excellence","ดำเนินการ/ปรับปรุงกระบวนการ","Prepare–Operate–Evolve; <b>Operations as code</b>, Frequent small reversible changes, Learn from failures"],
 ["Reliability","ป้องกันล้มเหลว/ฟื้นตัวเร็ว","High Availability, Auto-recovery; 5 principles ด้านล่าง"],
 ["Performance Efficiency","ใช้ทรัพยากรคุ้ม ปรับตามเทคโนโลยี","Right-sizing, Serverless, Go global in minutes, Experiment more often, Mechanical sympathy"],
 ["Cost Optimization","หลีกเลี่ยงค่าใช้จ่ายที่ไม่จำเป็น","Consumption model, Spot Instances, Autoscaling"],
 ["Sustainability","ลดพลังงาน/ผลกระทบสิ่งแวดล้อม","ปิด EC2 ที่ไม่ใช้, Right-size, Auto Scaling, ลบข้อมูลไม่จำเป็น, Serverless"]]},
 p:["<b>Reliability 5 principles</b>: <mark>Automatically recover from failure</mark>, <mark>Test recovery procedures</mark>, <mark>Scale horizontally</mark>, <mark>Stop guessing capacity</mark>, <mark>Manage change in automation</mark>","<b>Cost Optimization 5 pillars</b>: Right Size, Increase Elasticity, Right Pricing Model (On-Demand / Reserved / Spot / Savings Plans), Optimize Storage (Storage class, Lifecycle policy), Measure-Monitor-Improve","Sustainability: ลูกค้ารับผิดชอบ 'ใน' Cloud (Shared responsibility ด้าน Data design, App design, Code efficiency, Utilization & Scaling)"]},
{t:"2) Security Pillar: 5 Areas + 7 Design Principles",
 f:"ความปลอดภัยเหมือน <b>ปราสาทหลายชั้น</b> ไม่ใช่กำแพงชั้นเดียว: ตรวจบัตรทุกคน (IAM), มีกล้องบันทึกทุกมุม (Detective), กำแพง/คูน้ำ (Infrastructure), ล็อกตู้เซฟ (Data Protection), และซ้อมแผนหนีไฟ (Incident Response)",
 tbl:{h:["Key Area","บริการ AWS ตัวอย่าง"],r:[
 ["Identity & Access Mgmt","AWS IAM, MFA (Least Privilege)"],
 ["Detective Controls","CloudTrail, AWS Config, CloudWatch, GuardDuty"],
 ["Infrastructure Protection","VPC, NACL, Security Group, WAF, Shield"],
 ["Data Protection","KMS, Secrets Manager, EBS/S3 Encryption, ELB, RDS"],
 ["Incident Response","IAM, CloudFormation (กู้คืนอัตโนมัติ)"]]},
 p:["<b>7 Design Principles</b>: (1) Implement a strong identity foundation (2) Enable traceability (3) Apply security at all layers (4) Automate security best practices (5) Protect data in transit and at rest (6) Keep people away from data (7) Prepare for security events","แนวคิดสำคัญ: <mark>Protect → Control → Encrypt → Manage Secrets → Detect → Audit</mark>","Security ไม่ใช่แค่ 7 ข้อ แต่คือ <mark>Defense in Depth</mark> และเป็นความรับผิดชอบต่อเนื่องตลอดอายุระบบ"]},
{t:"3) Reference Architecture: Internet-Facing 3-Tier Web App",
 f:"ลูกค้าเดินเข้าห้างหรู: ผ่าน <b>รปภ.หน้าห้าง (WAF/Shield)</b> → ล็อบบี้ (ALB ใน Public Subnet) → พนักงานในออฟฟิศ (EC2 ใน Private Subnet) → ห้องเก็บเอกสารลับ (RDS ใน Restricted Subnet) โดยมี <b>กล้อง (GuardDuty)</b> และ <b>สมุดบันทึกทุกการเคลื่อนไหว (CloudTrail)</b>",
 p:["1. Protect Front-end: <mark>AWS WAF</mark> (SQLi, XSS) + <mark>AWS Shield</mark> (DDoS)","2. Network Control & Segmentation: Public / Private / Restricted Subnets; <mark>NACL</mark> + <mark>Security Group</mark>","3–4. Data Protection / Encrypt Everything: <mark>AWS KMS</mark> เข้ารหัส EBS, S3, RDS","5. Manage Secrets: <mark>AWS Secrets Manager</mark> หมุนเวียน RDS credentials แทนการ Hardcode","6. Detect: <mark>Amazon GuardDuty</mark> วิเคราะห์ VPC Flow Logs + พฤติกรรมผิดปกติ","7. Audit: <mark>AWS CloudTrail</mark> เก็บ API Calls (Audit/Governance)"]},
{t:"4) Well-Architected Tool & Review",
 f:"เหมือน <b>การตรวจสุขภาพประจำปี</b> ของระบบ: ตอบแบบสอบถามมาตรฐาน แล้วได้รายงานจุดเสี่ยง + แผนปรับปรุง",
 p:["<mark>AWS Well-Architected Tool</mark> = เครื่องมือฟรีใน Console ประเมินตามคำถามของ Pillars","<mark>Well-Architected Review (WAR)</mark> = กระบวนการหา High/Medium Risks และกำหนดแผนแก้","เป้าหมาย: Secure, Reliable, High Performing, Cost Efficient, Sustainable"]}
],
kw:[["Well-Architected Framework","กรอบ best practice 6 Pillars"],["6 Pillars","Security, Operational Excellence, Reliability, Performance Efficiency, Cost Optimization, Sustainability"],["Defense in Depth","ป้องกันซ้อนหลายชั้น"],["Operations as Code","ทำ Operations ด้วยโค้ด (OpEx)"],["Scale Horizontally","เพิ่มจำนวน Instance เพื่อเพิ่ม Availability/Fault Tolerance"],["AWS WAF","ป้องกัน Web attack (L7) เช่น SQLi, XSS"],["AWS Shield","ป้องกัน DDoS"],["AWS KMS","จัดการกุญแจเข้ารหัส"],["AWS Secrets Manager","เก็บ/หมุนเวียน Credentials"],["Amazon GuardDuty","Threat detection จาก VPC Flow Logs/พฤติกรรม"],["AWS CloudTrail","บันทึก API Calls เพื่อ Audit"],["AWS Config","ติดตามการตั้งค่า resource (Detective)"],["Spot / Reserved / Savings Plans","รูปแบบราคาลดต้นทุน"],["Well-Architected Tool","เครื่องมือฟรีประเมิน Architecture"],["WAR","Well-Architected Review หาความเสี่ยงและแผนแก้"]],
quiz:[
{q:"ข้อใดไม่ใช่หนึ่งใน 6 Pillars ของ AWS Well-Architected?",c:["Sustainability","Cost Optimization","Compliance Automation","Operational Excellence"],a:2,w:"6 Pillars: Security, Operational Excellence, Reliability, Performance Efficiency, Cost Optimization, Sustainability"},
{q:"Principle 'Perform operations as code' อยู่ใน Pillar ใด?",c:["Security","Operational Excellence","Cost Optimization","Sustainability"],a:1,w:"Operations as code, small reversible changes, learn from failures = Operational Excellence"},
{q:"บริการใดเป็น Detective Controls ที่ใช้ตรวจจับภัยจาก VPC Flow Logs?",c:["AWS KMS","Amazon GuardDuty","AWS Shield","AWS WAF"],a:1,w:"GuardDuty = Threat detection; KMS = กุญแจ; Shield = DDoS; WAF = Web attack"},
{q:"ข้อใดคือ 5 Key Areas ของ Security Pillar?",c:["IAM, Detective Controls, Infrastructure Protection, Data Protection, Incident Response","Compute, Storage, Database, Network, Billing","Prepare, Operate, Evolve, Review, Retire","Right Size, Elasticity, Pricing, Storage, Measure"],a:0,w:"ข้อ ค = Operational Excellence phases/ข้อ ง = Cost Optimization 5 pillars"},
{q:"ใน 3-tier architecture ใช้บริการใดป้องกัน SQL Injection/XSS ที่หน้าบ้าน?",c:["AWS Shield","AWS WAF","Amazon Macie","AWS CloudTrail"],a:1,w:"WAF = L7 web attacks; Shield = DDoS"},
{q:"ข้อใดเป็น Reliability design principle?",c:["Keep people away from data","Scale horizontally","Democratize advanced technologies","Adopt a consumption model"],a:1,w:"Reliability: auto recover, test recovery, scale horizontally, stop guessing capacity, manage change in automation"},
{q:"ภาระงานประจำที่คาดการณ์ได้ ต้องการลดต้นทุน ควรเลือกรูปแบบราคาใด?",c:["On-Demand ตลอด","Reserved Instances / Savings Plans","Spot Instances สำหรับ DB หลัก","จ่ายรายนาทีเท่านั้น"],a:1,w:"Reserved/Savings Plans เหมาะกับ steady workload; Spot เหมาะงานยืดหยุ่น; On-Demand สำหรับไม่แน่นอน"},
{q:"แนวคิดที่สรุปลำดับการออกแบบ Security ในสถาปัตยกรรมอ้างอิงคือ?",c:["Detect → Audit → Protect → Encrypt","Protect → Control → Encrypt → Manage Secrets → Detect → Audit","Encrypt → Protect → Audit → Detect","Audit → Detect → Control → Protect"],a:1,w:"จำเป็นสายโซ่: Protect, Control, Encrypt, Manage Secrets, Detect, Audit"},
{q:"ใช้บริการใดเก็บ API call history ของทุกบัญชีเพื่อทำ Audit/Governance?",c:["AWS CloudTrail","AWS KMS","Amazon EBS","AWS Shield"],a:0,w:"CloudTrail = Audit trail ของ API activity"},
{q:"ข้อใดอธิบาย AWS Well-Architected Tool ถูกต้อง?",c:["เครื่องมือเสียเงินสแกนมัลแวร์","เครื่องมือฟรีใน Console ประเมิน Architecture ตามคำถามของ 6 Pillars","บริการ Load Balancer","บริการเก็บ Secrets"],a:1,w:"เป็นเครื่องมือฟรีใช้ทำ Well-Architected Review หาความเสี่ยงและแผนปรับปรุง"}
]});

C.push({
id:"s9", title:"Session 9: Secure Infrastructure as Code (IaC)",
lead:"จากการคลิกตั้งค่าด้วยมือ → ไฟล์โค้ดที่อ่านด้วยเครื่องได้ พร้อมความปลอดภัยใน CI/CD Pipeline",
topics:[
{t:"1) IaC Paradigm",
 f:"IaC เหมือน <b>สูตรอาหารที่เขียนไว้</b> แทนการจำมือทำ ใครทำตามสูตรก็ได้รสเดิมทุกครั้ง ตรวจสอบแก้ไขสูตรผ่านทีมได้ (Pull Request) และทำทีละร้อยจานก็ได้อัตโนมัติ",
 p:["แบบเดิม (GUI/Scripts) → ช้า, Human Error, ไม่สอดคล้อง, <b>Configuration Drift</b>, ตรวจประวัติยาก","<b>4 หลักการ</b>: <mark>Code-Driven</mark> (Version-controlled), <mark>Repeatable</mark>, <mark>Collaborative</mark> (Review/PR), <mark>Automated</mark>","Workflow: Code → Version Control (Git) → CI/CD Pipeline → Provisioning"]},
{t:"2) Declarative vs Imperative",
 f:"<b>Declarative</b> = บอกร้านว่า 'ฉันต้องการพิซซ่าฮาวายเอี้ยน 1 ถาด' (What) ร้านจัดการเอง สั่งกี่ครั้งก็ได้พิซซ่าเดิม ไม่เพิ่มซ้ำ (Idempotent) / <b>Imperative</b> = บอกทุกขั้น 'นวดแป้ง 5 นาที ใส่ซอส…' (How) คุมได้ละเอียดแต่ต้องรับผิดชอบลำดับเอง",
 tbl:{h:["","Declarative (What)","Imperative (How)"],r:[
 ["เครื่องมือ","Terraform, CloudFormation, Pulumi","Ansible, Chef, Puppet, Bash"],
 ["ลักษณะ","Idempotent, อ่านง่าย เป็นเอกสารในตัว","ทำตามลำดับ เสี่ยง Drift ถ้าสภาพแวดล้อมเปลี่ยน"],
 ["เหมาะกับ","Provisioning (สร้างทรัพยากร)","Configuration Management (ตั้งค่าในเซิร์ฟเวอร์)"]]},
 p:["ทำไม Terraform เป็นมาตรฐาน: Multi-Cloud (3,400+ providers), <mark>HCL</mark>, State Management, Modular (Registry/Private modules)"]},
{t:"3) Terraform Workflow <span class='exam'>ออกสอบ: init / apply ทำอะไร</span>",
 f:"เหมือน <b>สร้างบ้านตามแบบแปลน</b>: <code>init</code> = เตรียมไซต์งาน ขนเครื่องมือมาไว้, <code>plan</code> = ดูแบบเทียบบ้านจริงว่าจะต่อเติม/รื้ออะไร (ยังไม่ลงมือ), <code>apply</code> = ลงมือสร้างจริง, <code>destroy</code> = รื้อทั้งหมด",
 tbl:{h:["คำสั่ง","ทำอะไร"],r:[
 ["terraform init","ดาวน์โหลด Provider Plugins, ตั้งค่า Backend, เตรียม working directory"],
 ["terraform plan","เทียบ Desired State (โค้ด) กับ Current State (ระบบจริง) → พรีวิวสิ่งที่จะสร้าง/แก้/ลบ"],
 ["terraform apply","ลงมือเปลี่ยนโครงสร้างพื้นฐานจริงตามแผน"],
 ["terraform destroy","รื้อถอนทรัพยากรที่ Terraform จัดการ (เหมาะ Dev/Test)"]]},
 p:["Lifecycle เต็ม: Write → Init → Validate → Plan → Apply → Monitor (drift) → Destroy","<mark>terraform.tfstate</mark> = ไฟล์ติดตามทรัพยากรจริง <b>ห้ามเก็บใน Git</b> (อาจมี Secrets/Plaintext) → ใช้ Remote State","Plan สำคัญเพราะ: ดูก่อนใช้ ป้องกันการเปลี่ยนแปลงไม่คาดคิด ตรวจสอบ/Audit ได้","<b>AWS CDK</b> (ใช้ภาษาโปรแกรม): <code>cdk init</code> สร้างโปรเจกต์, <code>cdk bootstrap</code> เตรียม AWS (ครั้งแรก), <code>cdk diff</code> เทียบ, <code>cdk synth</code> แปลงเป็น CloudFormation, <code>cdk deploy</code> ติดตั้ง, <code>cdk destroy</code> ลบ","<b>AWS SAM</b> (Serverless): <code>sam init</code>, <code>sam build</code>, <code>sam local start-api</code> (จำลอง API Gateway), <code>sam local invoke</code> (รัน Lambda ในเครื่อง), <code>sam deploy --guided</code>"]},
{t:"4) Configuration Blast Radius & ความเสี่ยงของ IaC",
 f:"IaC เหมือน <b>เครื่องถ่ายเอกสาร</b>: ถ้าต้นฉบับมีรอยเปื้อนจุดเดียว สำเนาทั้ง 100 ใบก็เปื้อนเหมือนกันหมด — ความผิดพลาดจุดเดียวขยายไปทุกสภาพแวดล้อม (Dev/Staging/Prod)",
 p:["<mark>Blast Radius</mark> = รัศมีผลกระทบจากความผิดพลาดใน Template ที่ถูกทำซ้ำ","ความเสี่ยงที่พบบ่อย: Public Storage, Overly Permissive IAM, Missing Encryption at Rest, <mark>Hardcoded Secrets</mark> (อันตรายที่สุด)","การตรวจด้วยคนไม่ทันสเกลคลาวด์ → ต้องอัตโนมัติ"]},
{t:"5) กรอบ 3 เสาหลัก IaC Security + ASPM",
 f:"เหมือนการรักษาความปลอดภัย <b>โรงงานผลิต</b>: (1) ควบคุมต้นฉบับแบบแปลน (ต้องมีคนรีวิว) (2) มีด่านตรวจคุณภาพก่อนปล่อยของออกสายพาน (Pipeline gates) (3) สุ่มตรวจสินค้าที่ขายไปแล้วว่าถูกใครแก้ไหม (Drift detection)",
 tbl:{h:["Pillar","สาระสำคัญ"],r:[
 ["1. Secure Code & Governance","Version control + Pull Request + Peer Review, ป้องกัน Code Tampering (SLSA Framework), Least Privilege, <b>ห้ามฝัง Secrets</b> (ใช้ Secrets Manager / Vault)"],
 ["2. Automated Pipeline Gates","<mark>Shift-Left</mark>: Scan on Commit & PR, บล็อกโค้ดไม่ปลอดภัย, <mark>Policy as Code</mark> (OPA): บล็อก Public storage / บังคับ Encryption / บังคับ Tags"],
 ["3. Continuous Posture Mgmt","<mark>Drift Detection</mark>, แยก Dev/Staging/Prod, <mark>Risk-Based Prioritization</mark> (Public exposure, Data sensitivity, Privilege escalation, Exploitability) ลด Alert Fatigue"]]},
 p:["<mark>Configuration Drift</mark> = ระบบจริงเบี่ยงจากโค้ดเพราะแก้ด้วยมือ","<mark>ASPM</mark> = รวม SAST (App Code), SCA (Dependencies), DAST (Runtime), IaC Scanning ไว้มุมมองเดียว","<b>Blueprint 4 ขั้น</b>: Centralize Policy → Shift Left, Test Early → Manage Secrets → Monitor Runtime","Pipeline: Commit → Validate & Lint → Terraform Plan → Policy as Code Check → Apply"]}
],
kw:[["Infrastructure as Code (IaC)","จัดการโครงสร้างพื้นฐานผ่านไฟล์โค้ด"],["Code-Driven / Repeatable / Collaborative / Automated","4 หลักการ IaC"],["Declarative","ระบุผลลัพธ์ (What) – Terraform, CloudFormation, Pulumi"],["Imperative","ระบุขั้นตอน (How) – Ansible, Chef, Puppet, Bash"],["Idempotent","รันกี่ครั้งผลลัพธ์เหมือนเดิม"],["HCL","HashiCorp Configuration Language"],["terraform init","ดาวน์โหลด provider, ตั้ง backend"],["terraform plan","พรีวิวการเปลี่ยนแปลง"],["terraform apply","ลงมือสร้าง/แก้จริง"],["terraform destroy","รื้อทรัพยากรทั้งหมด"],["terraform.tfstate","ไฟล์ state – ห้ามเก็บใน Git"],["Blast Radius","รัศมีความเสียหายจาก template ที่ผิด"],["Shift-Left","ย้ายตรวจความปลอดภัยไปต้นน้ำ"],["Policy as Code (OPA)","แปลงนโยบายเป็นกฎที่ตรวจอัตโนมัติ"],["Configuration Drift","ระบบจริงเบี่ยงจากโค้ด"],["Drift Detection","ตรวจจับความเบี่ยงเบน"],["SLSA","กรอบป้องกัน Code Tampering / supply chain"],["ASPM","รวม SAST+SCA+DAST+IaC scanning"],["cdk synth / diff / deploy","แปลงเป็น CFN / เทียบ / ติดตั้ง"],["sam local start-api","จำลอง API Gateway ในเครื่อง"]],

C.push({
id:"s10", title:"Session 10: Scale & Load Balancing for Cloud Security",
lead:"Load Balancer = 'เกราะป้องกันอัจฉริยะ' (Intelligent Shield) ไม่ใช่แค่ตัวกระจายโหลด",
topics:[
{t:"1) Dual-Purpose Component & SPOF",
 f:"Load Balancer เหมือน <b>พนักงานต้อนรับหน้าร้านที่ฉลาด</b>: ลูกค้าไม่ต้องรู้ว่าครัวมีกี่คน พนักงานเลือกส่งออเดอร์ให้ครัวที่ว่าง (Availability) และเช็คบัตร/กรองคนไม่ดีก่อนเข้าครัว (Security) ครัวไม่ต้องเปิดประตูให้คนนอกเข้า",
 p:["ต่อตรงเข้า Server → <mark>Single Point of Failure (SPOF)</mark> + Scaling Limits","LB ใน <b>Public Subnet (DMZ)</b>: <b>Availability Component</b> (HA + Fault Tolerance) และ <b>Security Control</b> (Centralized Inspection Point, ซ่อน Backend ไม่ต้องมี Public IP → ลด Attack Surface)","ประโยชน์: บำรุงรักษาโดยไม่หยุดบริการ, Health monitoring, บล็อก malicious, ส่ง traffic ผ่าน firewall"]},
{t:"2) AWS ELB Portfolio & Layer 4 vs Layer 7",
 f:"<b>L4</b> เหมือนไปรษณีย์ที่ดูแค่ที่อยู่หน้าซอง (IP/Port) เร็วมากแต่ไม่รู้เนื้อใน; <b>L7</b> เหมือนเลขาที่เปิดอ่านจดหมาย (Host/Path/Header/Cookie) รู้ว่าเรื่องอะไรจึงส่งถูกแผนก และตรวจเนื้อหาร้ายได้ (WAF)",
 tbl:{h:["ประเภท","Layer","จุดเด่น / Security"],r:[
 ["ALB","L7 (HTTP/HTTPS/gRPC/WebSocket)","Content routing (Host/Path/Header/Cookie), Microservices/Containers; เชื่อม <b>WAF</b>, OIDC Auth"],
 ["NLB","L4 (TCP/UDP/TLS)","Ultra-low latency (~100µs), ล้านรีเควสต์/วินาที; <b>TLS Passthrough</b>, <b>Static IP</b> (Firewall whitelist)"],
 ["GWLB","L3/4 (IP packets)","Inline inspection ผ่านโปรโตคอล <b>GENEVE</b>; ต่อ 3rd-party Virtual Firewall / IDS/IPS"],
 ["CLB","L4 & 7 (Legacy)","ไม่แนะนำสำหรับแอปใหม่"]]},
 p:["<b>L4</b>: ตาม IP+Port, เร็ว sub-millisecond, มองไม่เห็น HTTP header/payload","<b>L7</b>: เข้าใจเนื้อหา แยก <code>GET</code> → Read Replica, <code>PUT/POST</code> → Primary DB, ทำงานร่วม WAF กรอง Payload"]},
{t:"3) TLS Strategies",
 f:"เหมือน <b>ส่งพัสดุที่ล็อกกุญแจ</b>: Termination = พนักงานหน้าร้านเปิดกล่องแล้วส่งต่อเปล่าๆ ในตึก; Re-encryption = เปิดตรวจแล้วล็อกกล่องใหม่ก่อนส่งต่อ; Passthrough = ไม่เปิดเลย ส่งกล่องที่ล็อกถึงปลายทางให้เขาเปิดเอง",
 tbl:{h:["กลยุทธ์","การทำงาน","เหมาะกับ"],r:[
 ["TLS Termination (SSL Offloading)","LB ถอดรหัส → ส่ง Plaintext ใน Private Network","ลดภาระ CPU Backend"],
 ["TLS Re-encryption (End-to-End)","LB ถอดรหัสให้ WAF ตรวจ → เข้ารหัสใหม่ก่อนส่ง","มาตรฐานสูง PCI-DSS, HIPAA"],
 ["TLS Passthrough","LB ไม่เปิดอ่าน → Backend ถือ Certificate/ถอดรหัสเอง","ไม่ให้จุดกลางเห็นข้อมูลลับ (ใช้กับ NLB)"]]}},
{t:"4) Layered Filtration & Security Group Choke Points",
 f:"เหมือน <b>ด่านตรวจ 3 ชั้นที่สนามบิน</b> และ <b>บัตรผ่านที่อ้างอิงต่อกัน</b>: ห้องครัวรับเฉพาะคนที่ถือบัตรจากหน้าร้าน ห้องเก็บของรับเฉพาะคนที่ถือบัตรจากห้องครัว",
 p:["ชั้นกรอง: <mark>AWS Shield</mark> (DDoS L3/4: SYN flood, UDP reflection) → <mark>AWS WAF</mark> (L7: SQLi, XSS, Bad bots) → <mark>ALB</mark> (WebACL integration)","<b>SG Choke Points</b> (Least Privilege, อ้างอิง SG ต่อกันเป็นทอด): <b>ALB SG</b> เปิด 80/443 จาก 0.0.0.0/0 → <b>EC2 SG</b> รับเฉพาะจาก ALB SG → <b>DB SG</b> รับเฉพาะจาก EC2 App SG"]},
{t:"5) Algorithms, Cross-Zone, Health Check, Sticky Session",
 f:"<b>Round Robin</b> = แจกงานวนทีละคน, <b>Least Connections</b> = ส่งให้คนที่งานค้างน้อยสุด, <b>Hash</b> = ลูกค้าคนเดิมไปโต๊ะเดิม. <b>Cross-Zone</b> = ถ้าครัวชั้น 1 มี 2 คน ชั้น 2 มี 8 คน แต่ออเดอร์แบ่ง 50/50 คนชั้น 1 จะล้น — เปิด Cross-Zone ให้แบ่งตามจำนวนคนจริง",
 p:["Algorithms: <mark>Round Robin</mark>, <mark>Least Connections</mark>, <mark>Flow Hash / IP-URL Hash</mark>","<mark>Cross-Zone Load Balancing</mark>: ไม่เปิด → แบ่งเท่าๆ ต่อ AZ (AZ ที่ server น้อย Overload); เปิด → กระจายทุก Target ใน Region เท่าๆ กัน; <b>ALB เปิดเป็นค่าเริ่มต้น ไม่มีค่า cross-AZ data transfer</b>","<b>Health Checks</b>: ส่ง traffic เฉพาะ Target ที่ Healthy; <b>502 Bad Gateway</b> มักจาก Target ไม่ผ่าน Health Check (SG ตั้งผิด, App ตอบ 4xx/5xx, Timeout สั้นเกิน)","<mark>Sticky Sessions</mark>: ตรึงผู้ใช้ไป Server เดิมด้วย Cookie; Best practice: <b>Stateless</b> เก็บ Session ที่ ElastiCache/Redis/DynamoDB","Observability: <code>HTTPCode_ELB_5XX/4XX_Count</code>, <code>TargetResponseTime</code>, <code>ConsumedLCUs</code>, <b>Access Logs → S3</b> (Client IP, URL, User Agent, TLS cipher)"]},
{t:"6) Gold Standard 3-Tier Architecture",
 f:"เหมือน <b>ห้างที่มีทางเข้าเดียว</b>: ประตูหน้า (Internet Gateway) → รปภ. (WAF/Shield) → เคาน์เตอร์ต้อนรับ (ALB) → ออฟฟิศภายใน (EC2/ASG ใน Private) → ห้องนิรภัยลึกสุด (Aurora ใน Private)",
 p:["1 Network Edge: <b>Internet Gateway</b> → 2 Security Edge: <b>WAF + Shield</b> → 3 Public Tier: <b>ALB</b> (Public Subnets, Multi-AZ) → 4 <b>Security Group</b> (Internet → ALB SG → EC2 SG) → 5 Private Tier: <b>EC2/Auto Scaling Group</b> (ไม่มี Public IP) → 6 Data Tier: <b>Amazon Aurora Primary & Replica</b> (Private Subnets ชั้นในสุด)"]}

id:"s11", title:"Session 11: Zero Trust Architecture (ZTA)",
lead:"Never Trust, Always Verify — ตรวจสอบทุกคำขอ ไม่ว่าจะมาจากภายในหรือภายนอก",
topics:[
{t:"1) Paradigm Shift: Castle-and-Moat → Zero Trust",

 p:["Traditional Perimeter: แข็งแรงที่ขอบ ภายในอ่อน เสี่ยง <b>Insider Threat</b> และ Lateral Movement","<mark>Zero Trust</mark>: <mark>Never Trust, Always Verify</mark>; ถือว่าทุกเครือข่ายเป็น <b>Hostile Network</b>; ต้อง Authentication + Authorization + ประเมิน Context ทุกคำขอ","เป้าหมาย: ปกป้องข้อมูล/บริการ/สินทรัพย์ จากภัยไซเบอร์และ Ransomware"]},
{t:"2) Drivers & Guiding Principles",

 p:["<b>Drivers</b>: (1) Remote Work/หลายอุปกรณ์ (2) Cloud & Microservices (3) กฎระเบียบเข้มขึ้น","<b>Guiding Principles</b>: <mark>Authenticate & Authorize Everywhere</mark> (ไม่เชื่อเครือข่ายใดแม้ของตัวเอง), <mark>Avoid binary choice</mark> (ผสาน network + identity), <mark>Work backwards from use cases</mark>, <mark>One size doesn't fit all</mark>","Awareness & Monitoring: Know your architecture; Monitor device health & behavior; ใช้ Secure transport protocol; Use policies to authorize"]},
{t:"3) 8 เสาหลักของ Zero Trust",

{t:"4) 5-Step Implementation Blueprint",

{t:"5) PDP / PEP / IAP, ความท้าทาย, Metrics",

 p:["<mark>PDP</mark> ประเมิน Identity + Device posture + Risk score → อนุมัติ/ปฏิเสธ; <mark>PEP</mark> บังคับใช้จริง เช่น <mark>Identity-Aware Proxy (IAP)</mark> หรือ Micro-segmentation Gateway","<b>ความท้าทาย</b>: Complex Infrastructure (ใช้ ZTA ยืดหยุ่น multi-cloud/on-prem), Legacy Systems (Reverse Proxy/API Gateway + ทยอย Phase out), Defining Access Controls (เริ่มจาก Data Mapping Step 2)","<b>Success Metrics</b>: <mark>MTTD</mark> (Mean Time to Detect), <mark>MTTR</mark> (Mean Time to Respond), Failed Auth, Auth Success Rate, Latency (ลดด้วย caching)","CISA / DoD Zero Trust Models: CISA ผสาน Visibility/Automation เป็น capability ข้ามเสา; DoD แยกเป็นเสาหลักต่างหาก"]},

s6b:[
"SOC เห็น alert 'S3 download spike' + failed login ก่อนหน้า ทันทีที่ผู้จัดการถามว่า 'ข้อมูลถูกขโมยใช่ไหม?' นักวิเคราะห์ตอบว่า 'ข้อเท็จจริงคือ Bucket เป็น Public Read และดาวน์โหลดพุ่ง — ขอตรวจก่อนว่ามี PII จริงไหม' (แยก Fact/Assumption)",
"พบ Access Key อายุ 14 เดือนใน Git + API call จากประเทศที่ไม่มีลูกค้า นักวิเคราะห์เล่าเรื่อง: <b>Evidence</b> (key หลุด) → <b>Asset</b> (Cloud IAM) → <b>Threat</b> (attacker) → <b>Vector</b> (valid key) → <b>Vulnerability</b> (long-lived key) → <b>Impact</b> (C/I)",
"Credential รั่ว: <b>Identify</b> ใครเป็นเจ้าของ key → <b>Protect</b> บังคับ MFA/Rotation → <b>Detect</b> Impossible travel → <b>Respond</b> Revoke key + เก็บ Log เป็นหลักฐาน → <b>Recover</b> ออก credential ใหม่ + ทบทวนสิทธิ์ Role",
"ทีมคำนวณเปรียบเทียบ: เคส Public Bucket (หลักฐาน=Public policy, จุดอ่อน=Config, Control แรก=ปิดการเข้าถึง) กับเคส BOLA (หลักฐาน=request ผิดปกติ, จุดอ่อน=Authorization, Control แรก=แก้ AuthZ) ทำให้อธิบายได้ว่าทำไมต้องจัดการ Public Bucket ก่อน",
"แก้โค้ด BOLA ใช้เวลา 3 สัปดาห์ ระหว่างนั้นทีมใส่ WAF rule + IP Whitelist (<b>Compensating Control</b>) แล้วบันทึกใน Risk Register: R-03 / API customer profile / BOLA / C / 4×4=16 / Owner: API team / Due: 21 วัน"],
s7:[
"ฝ่ายบุคคลมีไฟล์ 3 แบบ: ใบประกาศรับสมัครงาน (<b>Public</b>), ตารางลาพนักงาน (<b>Internal</b>), สัญญาจ้างและเลขบัตรประชาชนพนักงาน (<b>Restricted</b>) ทีม IT จึงเลือก Encryption + Vault + Audit เฉพาะกลุ่มสุดท้าย",
"ข้อสอบเติมคำ: 'พนักงานเปิดไฟล์ Word ที่เป็นความลับบนโน้ตบุ๊ก' = <b>Data in Use</b> (ใช้ RBAC/DRM); 'ส่งไฟล์ผ่านอีเมล' = <b>In Transit</b> (Email Encryption/MFT); 'Backup บน NAS' = <b>At Rest</b> (Disk/File/DB Encryption)",
"บริษัททยอยลบข้อมูลลูกค้าที่หมดสัญญาเกิน 7 ปี (<b>Destroy</b>) หลังย้ายไป Glacier (<b>Archive</b>) ส่วนรายงานที่แชร์ให้พันธมิตรคือขั้น <b>Publish</b>",
"พนักงานต้องอ่านไฟล์ใน S3: มี IAM Policy อนุญาต, Bucket Policy อนุญาต แต่ <b>KMS Key Policy</b> ไม่ให้สิทธิ์ถอดรหัส → อ่านไม่ได้; และถ้ามี Explicit Deny ที่ใดที่หนึ่ง ก็ปฏิเสธทันที (<b>Explicit Deny Wins</b>)",
"ฝ่ายความปลอดภัยต้องการเข้ารหัส backup 10 TB: ระบบใช้ <b>Data Key</b> เข้ารหัสไฟล์ (เร็ว) แล้วใช้ <b>KMS Key</b> เข้ารหัส Data Key เก็บคู่กับไฟล์; เมื่อพนักงานลาออกจึง <b>Disable</b> key ชั่วคราว และเมื่อหมดความจำเป็น <b>Schedule deletion</b>",
"แอปจ่ายเงินฝัง DB password ในโค้ด แล้วโค้ดหลุดบน Git → เปลี่ยนไปใช้ <b>Secrets Manager</b> + Rotation ทุก 30 วัน; แอปเรียก <code>GetSecretValue</code> ทุกครั้งที่เริ่ม ส่วนค่า <code>ENV=prod</code> เก็บใน SSM Parameter Store ฟรี",
"ถูก Ransomware เข้ารหัสไฟล์ แต่ Backup อยู่ใน <b>S3 Object Lock (WORM)</b> จึงลบ/แก้ไม่ได้ กู้คืนได้; <b>Macie</b> ช่วยพบ S3 bucket เก่าที่มี PII ไม่เข้ารหัส; <b>CloudTrail</b> ใช้สืบว่าใครเรียก API ใด"],
s8:[
"สตาร์ตอัพขายของออนไลน์: ระบบล่มตอนแคมเปญ (Reliability), ค่า AWS บาน (Cost), เซิร์ฟเวอร์ใหญ่เกินจำเป็น (Performance/Sustainability), deploy ด้วยมือผิดพลาดบ่อย (OpEx), และเคยโดนแฮก (Security) — ทั้ง 6 Pillars ช่วยตรวจครบ",
"แอปโดน Brute force: <b>IAM+MFA</b> ลดโอกาส, <b>GuardDuty</b> ตรวจพบพฤติกรรมแปลก, <b>CloudTrail</b> บอกว่าใครทำอะไร, <b>WAF</b> บล็อกที่ขอบ และมี <b>Runbook</b> ซ้อมรับมือไว้ล่วงหน้า (Prepare for security events)",
"ลูกค้าส่ง request → <b>Shield/WAF</b> กรอง → <b>ALB</b> (Public Subnet) → <b>EC2</b> (Private) ดึงรหัส DB จาก <b>Secrets Manager</b> → <b>RDS</b> (Restricted) เข้ารหัสด้วย <b>KMS</b> → <b>GuardDuty/CloudTrail</b> เฝ้าระวังและบันทึก",
"ทีมใช้ <b>Well-Architected Tool</b> ตอบคำถาม ได้รายงานว่า 'ไม่มีการทดสอบ DR' เป็น High Risk จึงตั้งแผนซ้อมกู้คืนภายใน 1 ไตรมาส"],
s9:[
"วิศวกรสร้าง EC2 ผ่าน Console 20 เครื่อง แต่ Dev กับ Prod ตั้งค่าไม่เหมือนกันและไม่มีใครรู้ว่าใครแก้อะไร → ย้ายมาเขียน IaC เก็บใน Git ทุกการเปลี่ยนต้องผ่าน PR ทำซ้ำได้ทุกครั้ง",
"ทีมต้องการ 'EC2 3 เครื่องหลัง ALB' เขียนเป็น Terraform (Declarative) รัน 10 ครั้งก็ยังได้ 3 เครื่อง (Idempotent) ส่วนงานลง nginx ภายในเครื่องใช้ Ansible (Imperative) เขียนขั้นตอนเอง",
"นักศึกษาฝึกงานรัน <code>terraform init</code> (โหลด provider) → <code>plan</code> (เห็นว่าจะสร้าง 3 resource) → <code>apply</code> (สร้างจริง) → จบแล้ว <code>destroy</code> เพื่อประหยัดเงิน; พลาด commit <code>terraform.tfstate</code> ขึ้น Git ทำให้ password DB รั่ว",
"Template S3 module ตั้ง <code>acl=public-read</code> ผิดจุดเดียว แล้วถูก deploy ใช้ซ้ำกับ 40 โปรเจกต์ใน 3 environment → bucket สาธารณะ 120 ใบ (<b>Blast Radius</b>)",
"องค์กรตั้ง Pipeline: Commit → Lint → Terraform Plan → <b>OPA</b> ตรวจกฎ 'ห้าม Public + ต้อง Encrypt + ต้องมี Tag owner' → บล็อก Merge ถ้าผิด; คืนหนึ่งมีคนแก้ SG ด้วยมือ ระบบ <b>Drift Detection</b> แจ้งเตือนว่าไม่ตรงกับโค้ด"],
s10:[
"เว็บขายตั๋วคอนเสิร์ต: Server ตัวเดียวล่มเมื่อคนเข้าล้านคน (SPOF) → วาง ALB ใน Public Subnet กระจายโหลดไปหลาย EC2 ใน Private Subnet ที่ไม่มี Public IP ด้วย",
"ต้องการส่ง <code>/api/*</code> ไปบริการ A และ <code>/img/*</code> ไปบริการ B → เลือก <b>ALB (L7)</b>; เกมออนไลน์ต้องการ latency ต่ำและ IP คงที่ให้พันธมิตร whitelist → <b>NLB (L4)</b>; ธนาคารต้องส่ง traffic เข้า Firewall ของ vendor → <b>GWLB</b>",
"ระบบชำระเงินต้องผ่าน PCI-DSS: ใช้ <b>TLS Re-encryption</b> ให้ WAF ตรวจ payload ก่อนเข้ารหัสใหม่ส่ง Backend; ส่วนระบบที่ไม่อยากให้ LB เห็นข้อมูลเลยใช้ NLB + <b>TLS Passthrough</b>",
"มีคนยิง SYN flood → <b>Shield</b> กรอง; ยิง <code>' OR 1=1--</code> → <b>WAF</b> บล็อก; Traffic ที่เหลือเข้า ALB; DB ตั้ง SG ให้รับเฉพาะจาก EC2 App SG ดังนั้นต่อให้คนร้ายรู้ IP ของ DB ก็เชื่อมตรงไม่ได้",
"AZ-a มี 2 เครื่อง AZ-b มี 8 เครื่อง แต่ปิด Cross-Zone → AZ-a รับ 50% ล้น; เปิด Cross-Zone แล้วทุกเครื่องได้เท่ากัน. ผู้ใช้เจอ <b>502</b> เพราะ Target ไม่ผ่าน Health Check (SG ปิด port ของ health check); ตะกร้าสินค้าหายเมื่อสลับ server → ย้าย Session ไป ElastiCache (Stateless)",
"ทีม SOC สร้าง checklist ตรวจ 3-tier: IGW → WAF/Shield → ALB (multi-AZ) → SG chain → EC2/ASG (private) → Aurora primary/replica (private) ถ้ามีชั้นใดขาดถือว่าไม่ผ่านมาตรฐาน Gold Standard"],
s11:[
"พนักงานเชื่อม VPN จากร้านกาแฟ ระบบเดิม (Castle-and-Moat) ไว้ใจทันทีแล้วเข้าถึงทุก server; ระบบ Zero Trust ตรวจ MFA + สุขภาพเครื่อง + เวลา/ที่อยู่ทุกครั้ง และให้เข้าถึงเฉพาะแอปที่จำเป็น",
"บริษัทเปลี่ยนเป็น Work-from-anywhere, ย้ายระบบเข้า SaaS/Cloud และแตกเป็น microservices → ขอบเขตเครือข่ายเดิมหายไป จึงต้อง Authenticate & Authorize ทุกการเชื่อมต่อ ไม่เชื่อแม้เครือข่ายตัวเอง",
"ฝ่ายความปลอดภัยทำ checklist: Identity (SSO+MFA), Device (ตรวจ patch ก่อนเชื่อม), Application, Data (จัดชั้นข้อมูล), Network (micro-segment), Infrastructure, Visibility & Analytics (SIEM) และ Orchestration (SOAR ปิดบัญชีอัตโนมัติ)",
"โรงพยาบาลเริ่ม ZT: (1) Protection Surface = ข้อมูลผู้ป่วย + ระบบ HIS (DAAS) (2) Map ว่าข้อมูลไหลจากห้องแล็บไป HIS อย่างไร (3) ใส่ micro-perimeter รอบ HIS (4) MFA+Least Privilege (5) เขียนนโยบาย 'แพทย์เวรเท่านั้น เข้าได้ 8:00–20:00 จากเครื่องที่ผ่าน posture'",
"แพทย์ขอเข้า HIS: <b>PDP</b> ประเมิน Identity+Device+Risk score → อนุมัติ; <b>PEP/IAP</b> เปิดช่องทางจริง; ผลลัพธ์วัดด้วย MTTD/MTTR ที่ลดลงและ Auth failure ที่ผิดปกติ",
"หน่วยงานรัฐไม่อยากประกอบระบบเอง จึงนำ <b>ZTAG-I</b> มาเป็นต้นแบบ: Okta (ตัวตน) + CrowdStrike (อุปกรณ์) + Zscaler (micro-segmentation) + XQ (ข้อมูล) + Splunk (SIEM/SOAR) บน AWS ที่ผ่านการทดสอบร่วมกันแล้ว"]
};

/* ============ ENGINE ============ */
const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const nav=document.getElementById('nav'), main=document.getElementById('main');
let state = store.get('csg-state',{});   // {chapId:{qi:choiceIdx}}

function esc(s){return s}
function tableHtml(t){return '<table><thead><tr>'+t.h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+t.r.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}

function chapScore(c){const s=state[c.id]||{};let n=0,d=0;c.quiz.forEach((q,i)=>{if(s[i]!==undefined){d++;if(s[i]===q.a)n++}});return {n,d}}

function render(){
  nav.innerHTML = C.map((c,i)=>{const s=chapScore(c);return `<a href="#${c.id}" data-id="${c.id}">${c.title.split(':')[0]}<span class="sc">${s.d?s.n+'/20':''}</span></a>`}).join('');
  main.innerHTML = '<div class="card"><h2>📘 คู่มือเตรียมสอบ Cloud Security</h2><div class="lead">Session 6 – Session 11 • อธิบายด้วย <b>Feynman Technique</b> (เล่าให้เด็ก 12 ขวบฟัง + ภาพเปรียบเทียบ + สถานการณ์ตัวอย่าง) • เน้น <mark>keyword</mark> • ท้ายบทมีข้อสอบ 20 ข้อ พร้อมเฉลยเหตุผล<br><br><span class="exam">ออกสอบ</span> = หัวข้อที่อาจารย์ระบุในสไลด์ว่าออกสอบ (States of Data เติมคำ, คำสั่ง Terraform init/apply)</div><div id="total" class="score"></div></div>' +
  C.map(c=>chapterHtml(c)).join('');
  bind(); route(); updateTotal();
}

function chapterHtml(c){
  let h=`<section class="chap" id="${c.id}"><h2>${c.title}</h2><div class="lead">${c.lead}</div>`;
  c.topics.forEach(t=>{
    h+=`<div class="card"><h3>${t.t}</h3>`;
    h+=`<div class="feyn"><b class="t">🧒 Feynman:</b> ${t.f}</div>`;
    if(t.s) h+=`<div class="scen"><b>📌 สถานการณ์ตัวอย่าง:</b> ${t.s}</div>`;
    if(t.tbl) h+=tableHtml(t.tbl);
    if(t.p) h+='<ul>'+t.p.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
    h+='</div>';
  });
  h+=`<div class="card"><h3>🔑 Keywords & ความหมายที่ต้องจำ</h3><input class="search" placeholder="ค้นหา keyword..." oninput="filterKw(this,'${c.id}')"><div id="kw-${c.id}">`+tableHtml({h:['Keyword','ความหมาย'],r:c.kw})+`</div></div>`;
  h+=`<div class="card"><h3>📝 ข้อสอบท้ายบท (20 ข้อ)</h3><div class="score" id="sc-${c.id}"></div>`;
  c.quiz.forEach((q,i)=>{
    h+=`<div class="q" id="q-${c.id}-${i}"><div class="qt">${i+1}. ${q.q}</div>`+q.c.map((o,j)=>`<button class="opt" data-c="${c.id}" data-q="${i}" data-o="${j}">${'กขคง'[j]}. ${o}</button>`).join('')+`<div class="why"></div></div>`;
  });
  h+=`<button class="btn" onclick="resetChap('${c.id}')">ทำใหม่ทั้งบทนี้</button></div></section>`;
  return h;
}

function bind(){
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.c,+b.dataset.q,+b.dataset.o));
  C.forEach(c=>{const s=state[c.id]||{};Object.keys(s).forEach(i=>paint(c,+i,s[i]));scoreLine(c)});
}
function answer(cid,qi,oi){
  const c=C.find(x=>x.id===cid);state[cid]=state[cid]||{};
  if(state[cid][qi]!==undefined)return;
  state[cid][qi]=oi;store.set('csg-state',state);paint(c,qi,oi);scoreLine(c);updateNav();updateTotal();
}
function paint(c,qi,oi){
  const box=document.getElementById(`q-${c.id}-${qi}`);if(!box)return;
  const q=c.quiz[qi];
  box.classList.add('done');
  box.querySelectorAll('.opt').forEach((b,j)=>{b.classList.add('lock');if(j===q.a)b.classList.add('ok');else if(j===oi)b.classList.add('bad')});
  box.querySelector('.why').innerHTML=(oi===q.a?'✅ <b>ถูกต้อง!</b> ':'❌ <b>ยังไม่ถูก</b> – เฉลย: '+'กขคง'[q.a]+'. ')+q.w;
}
function scoreLine(c){const s=chapScore(c);document.getElementById('sc-'+c.id).textContent=s.d?`คะแนน: ${s.n}/20 (ตอบแล้ว ${s.d}/20)`:'ยังไม่ได้ทำ — เลือกคำตอบเพื่อดูเฉลยทันที'}
function updateNav(){nav.querySelectorAll('a').forEach(a=>{const c=C.find(x=>x.id===a.dataset.id);const s=chapScore(c);a.querySelector('.sc').textContent=s.d?s.n+'/20':''})}
function updateTotal(){let n=0,d=0;C.forEach(c=>{const s=chapScore(c);n+=s.n;d+=s.d});const t=document.getElementById('total');if(t)t.textContent=`คะแนนรวม: ${n}/${C.length*20} (ตอบแล้ว ${d}/${C.length*20})`}
function resetChap(id){delete state[id];store.set('csg-state',state);render();location.hash=id}
function resetAll(){if(confirm('ล้างคะแนนทั้งหมด?')){state={};store.set('csg-state',state);render()}}
function filterKw(inp,id){const v=inp.value.toLowerCase();document.querySelectorAll(`#kw-${id} tbody tr`).forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none')}
function route(){
  const id=location.hash.slice(1);
  document.querySelectorAll('.chap').forEach(s=>s.classList.toggle('show',s.id===id));
  nav.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  if(id)window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
render();
</script>
</body>
</html>
