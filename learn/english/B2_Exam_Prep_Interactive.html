<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 Exam Prep — Unit 1 &amp; Unit 3 Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e6;
  --paper-2:#efe7d6;
  --ink:#1f2d2a;
  --teal:#1f4d47;
  --teal-2:#2c6a61;
  --coral:#c1442d;
  --mustard:#e2a63b;
  --good:#2f7a4f;
  --bad:#c1442d;
  --line:#d9cfb8;
  --card:#fffdf7;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter','Noto Sans Thai',sans-serif;
  font-size:15px;
  line-height:1.6;
}
h1,h2,h3,.disp{ font-family:'Space Grotesk','Noto Sans Thai',sans-serif; letter-spacing:.2px; }

/* ---------- Layout ---------- */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:260px; flex:none; background:var(--teal); color:#fdfaf0;
  padding:20px 14px 20px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.brand .dot{ width:10px;height:10px;border-radius:50%; background:var(--mustard); }
.brand h1{ font-size:15px; margin:0; color:#fdfaf0; }
.brand-sub{ font-size:10.5px; color:#bcd7ce; margin:0 0 18px 18px; }

.navgroup-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:#9fc4bb; margin:16px 6px 6px; }
.navitem{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px;
  font-size:13px; color:#eaf3ef; transition:background .15s;
}
.navitem:hover{ background:rgba(255,255,255,.08); }
.navitem.active{ background:#fdfaf0; color:var(--teal); font-weight:600; }
.navitem .stamp{
  width:20px;height:20px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:10px; border:1.5px solid rgba(255,255,255,.4); color:#cfe6df;
}
.navitem.active .stamp{ border-color:var(--teal); color:var(--teal); }
.navitem.done .stamp{ background:var(--mustard); border-color:var(--mustard); color:#1f2d2a; font-weight:700; }
.navitem.active.done .stamp{ background:var(--mustard); border-color:var(--mustard); color:#1f2d2a; }

.main{ flex:1; padding:28px 34px 80px; max-width:900px; }

/* ---------- Ticket header ---------- */
.ticket{
  background:var(--card); border:1.5px solid var(--ink); border-radius:14px;
  padding:20px 26px; margin-bottom:26px; position:relative; overflow:hidden;
  box-shadow:5px 5px 0 var(--coral);
}
.ticket:before{
  content:""; position:absolute; left:0; right:0; top:64px; height:0;
  border-top:2px dashed var(--line);
}
.ticket .row1{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
.ticket h2.disp{ font-size:22px; margin:0; color:var(--teal); }
.ticket .badge{
  background:var(--coral); color:#fff; font-size:10.5px; font-weight:700; padding:4px 10px;
  border-radius:20px; white-space:nowrap;
}
.ticket .meta{ font-size:11.5px; color:#6b6252; margin-top:4px; }
.ticket .stats{ display:flex; gap:22px; margin-top:20px; flex-wrap:wrap; }
.ticket .stat b.disp{ display:block; font-size:20px; color:var(--teal); }
.ticket .stat span{ font-size:10.5px; color:#7a7261; text-transform:uppercase; letter-spacing:.6px; }

/* ---------- Explanation ---------- */
.explain-toggle{
  display:inline-flex; align-items:center; gap:6px; background:var(--teal); color:#fff;
  border:none; padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600;
  cursor:pointer; margin-bottom:16px;
}
.explain-toggle:hover{ background:var(--teal-2); }
.explain-wrap{ display:none; margin-bottom:22px; }
.explain-wrap.open{ display:block; }
.explain-box{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 20px; font-size:13.6px;
}
.explain-box h3{ font-size:13.5px; color:var(--teal); margin:14px 0 6px; }
.explain-box h3:first-child{ margin-top:0; }
.explain-box .ex{ color:var(--teal-2); font-style:italic; margin:3px 0 3px 10px; }
.explain-box table{ width:100%; border-collapse:collapse; margin:8px 0; font-size:12.6px; }
.explain-box th,.explain-box td{ border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; }
.explain-box th{ background:#e2d9c2; }

.passage{ background:#fffef9; border:1px dashed #b9ab88; padding:12px 16px; border-radius:8px; margin:0 0 14px; font-size:13.6px; }
.passage .ptitle{ font-weight:700; color:var(--coral); margin-bottom:6px; }
.note{ font-size:12px; color:#6b6252; background:var(--paper-2); padding:9px 13px; border-radius:6px; margin-bottom:14px; }

/* ---------- Questions ---------- */
.qcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:14px; transition:border-color .15s, box-shadow .15s;
}
.qcard.correct{ border-color:var(--good); box-shadow:0 0 0 1.5px var(--good) inset; }
.qcard.incorrect{ border-color:var(--bad); box-shadow:0 0 0 1.5px var(--bad) inset; }
.qhead{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.qnum{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--coral); font-size:15px; }
.qtype{ font-size:10px; color:#8b8367; background:var(--paper-2); padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px; }
.qprompt{ font-size:14.5px; margin-bottom:10px; }
.qopts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt-btn{
  border:1.5px solid var(--line); background:#fff; padding:8px 14px; border-radius:8px;
  cursor:pointer; font-size:13.5px; font-family:inherit; transition:all .12s;
}
.opt-btn:hover{ border-color:var(--teal-2); }
.opt-btn.selected-correct{ background:var(--good); border-color:var(--good); color:#fff; }
.opt-btn.selected-incorrect{ background:var(--bad); border-color:var(--bad); color:#fff; }
.opt-btn.reveal-correct{ border-color:var(--good); color:var(--good); font-weight:700; }
.opt-btn[disabled]{ cursor:default; opacity:.85; }

.text-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.text-row input[type=text]{
  flex:1; min-width:180px; padding:9px 12px; border:1.5px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13.5px; background:#fff;
}
.text-row input[type=text]:focus{ outline:none; border-color:var(--teal-2); }
.btn{
  border:1.5px solid var(--teal); background:#fff; color:var(--teal); padding:8px 14px;
  border-radius:8px; cursor:pointer; font-size:12.6px; font-weight:600; font-family:inherit;
}
.btn:hover{ background:var(--teal); color:#fff; }
.btn.solid{ background:var(--teal); color:#fff; }
.btn.solid:hover{ background:var(--teal-2); }
.answer-reveal{
  margin-top:9px; padding:9px 12px; background:#eef6f0; border-left:3px solid var(--good);
  border-radius:6px; font-size:13px; display:none;
}
.answer-reveal.open{ display:block; }
.self-grade{ margin-top:9px; display:none; gap:8px; }
.self-grade.open{ display:flex; }
.self-grade button.good{ border-color:var(--good); color:var(--good); }
.self-grade button.good:hover{ background:var(--good); color:#fff; }
.self-grade button.bad{ border-color:var(--bad); color:var(--bad); }
.self-grade button.bad:hover{ background:var(--bad); color:#fff; }

/* ---------- Overview ---------- */
.ov-row{
  display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:12px 16px; margin-bottom:10px; cursor:pointer;
}
.ov-row:hover{ border-color:var(--teal-2); }
.ov-row .ov-title{ flex:1; font-size:13.6px; font-weight:600; }
.ov-row .ov-sub{ font-size:11px; color:#8b8367; }
.ov-bar{ width:130px; height:8px; background:var(--paper-2); border-radius:6px; overflow:hidden; flex:none; }
.ov-bar-fill{ height:100%; background:var(--mustard); }
.ov-pct{ width:70px; text-align:right; font-size:12px; font-weight:700; color:var(--teal); flex:none; }

footer.foot{ margin-top:30px; font-size:11px; color:#9c937c; text-align:center; }

@media (max-width:760px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; height:auto; position:relative; }
  .main{ padding:20px; }
}
</style>
</head>

<script id="app-data" type="application/json">{"grammar": [{"code": "G1", "title": "1A: Present forms; like, as if, as though", "explanation": "\n    <div class=\"explain\">\n    <h3>1. Simple Present กับ Present Continuous</h3>\n    <p><b>Simple Present</b> ใช้กับ <i>state verbs</i> (กริยาที่แสดงสภาวะ ไม่ใช่การกระทำ) และเรื่องที่เป็นจริงเสมอ/กิจวัตร\n    เช่น ความรู้สึก (like, love, hate, want, prefer, need), ความคิด/ความเห็น (think, believe, know, remember, understand),\n    สภาวะ (be, have, seem, belong), และประสาทสัมผัส (taste, sound, look, feel, smell)</p>\n    <p class=\"ex\">I <b>think</b> everyone has a unique style. (ความเห็น = state verb → simple present)</p>\n    <p><b>Present Continuous</b> ใช้กับการกระทำที่กำลังเกิดขึ้นตอนนี้ หรือสถานการณ์ชั่วคราว รวมถึงใช้กับ <i>always</i>\n    เพื่อพูดถึงพฤติกรรมที่ทำบ่อยจนน่ารำคาญ</p>\n    <p class=\"ex\">My parents <b>are always criticizing</b> me! (บ่นบ่อยจนน่ารำคาญ)</p>\n    <p><b>ข้อควรระวัง:</b> บางคำ เช่น think, have, feel เป็นได้ทั้ง action verb และ state verb ขึ้นอยู่กับความหมาย\n    ถ้าเป็นการกระทำ → present continuous, ถ้าเป็นความเห็น/สภาวะ → simple present</p>\n    <p class=\"ex\">I'<b>m thinking</b> about buying a car. (กำลังใคร่ครวญ = action) vs. I <b>think</b> it's a good idea. (ความเห็น = state)</p>\n\n    <h3>2. Sense verbs: look, sound, feel, smell, taste</h3>\n    <table class=\"rule-table\">\n    <tr><th>โครงสร้าง</th><th>ตัวอย่าง</th></tr>\n    <tr><td>sense verb + <b>adjective</b></td><td>You look tired.</td></tr>\n    <tr><td>sense verb + <b>like</b> + noun</td><td>It looks like gold.</td></tr>\n    <tr><td>sense verb + <b>as if / as though</b> + clause</td><td>It sounds as if you need help.</td></tr>\n    </table>\n    <p><b>Look!</b> หลัง sense verb ต้องตามด้วย <b>adjective</b> ไม่ใช่ adverb\n    → <i>That sounds wonderful.</i> ไม่ใช่ <s>That sounds wonderfully.</s></p>\n    <p><b>as though</b> เป็นทางการกว่า <b>as if</b> เล็กน้อย ส่วน <b>like</b> ก่อนอนุประโยค (clause) ใช้ได้เฉพาะ\n    ภาษาพูดที่ไม่เป็นทางการ เช่น <i>It looks like Mary's not coming.</i> (informal)</p>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "I ___ you're right, but I need to think about it more.", "options": ["am thinking", "think", "thinks"], "answer": "think"}, {"n": 2, "type": "mcq", "prompt": "Look! The kids ___ soccer in the yard right now.", "options": ["play", "are playing", "played"], "answer": "are playing"}, {"n": 3, "type": "mcq", "prompt": "This cake ___ amazing! What's in it?", "options": ["is smelling", "smells", "smelling"], "answer": "smells"}, {"n": 4, "type": "mcq", "prompt": "It ___ as if she has already left.", "options": ["looks", "is looking", "look"], "answer": "looks"}, {"n": 5, "type": "mcq", "prompt": "He ___ always checking his phone during class — it's so annoying!", "options": ["is", "has", "was"], "answer": "is"}, {"n": 6, "type": "mcq", "prompt": "That jacket ___ really good on you.", "options": ["look", "looks", "is looking"], "answer": "looks"}, {"n": 7, "type": "fill", "prompt": "My sister ______ (not/believe) in ghosts, but she loves horror movies.", "answer": "doesn't believe"}, {"n": 8, "type": "fill", "prompt": "Right now, the manager ______ (interview) candidates for the new position.", "answer": "is interviewing"}, {"n": 9, "type": "fill", "prompt": "This milk ______ (smell) strange. Did you check the expiration date?", "answer": "smells"}, {"n": 10, "type": "fill", "prompt": "It ______ (sound) as though the meeting has been cancelled.", "answer": "sounds"}, {"n": 11, "type": "error", "prompt": "You look really beautifully in that dress tonight.", "answer": "beautifully → beautiful (adjective ต้องตามหลัง sense verb ไม่ใช่ adverb)"}, {"n": 12, "type": "error", "prompt": "She's thinking that communication styles are fascinating.", "answer": "is thinking → thinks (think ในความหมาย \"เห็นว่า/คิดว่า\" เป็น state verb)"}, {"n": 13, "type": "error", "prompt": "This soup tastes badly. Did you forget the salt?", "answer": "badly → bad (adjective หลัง sense verb)"}, {"n": 14, "type": "dialog", "prompt": "A: Why is your brother so quiet today? ______ (something/bother) him?<br>B: I'm not sure. He's been acting strange since this morning.", "answer": "Is something bothering"}, {"n": 15, "type": "dialog", "prompt": "A: You ______ (seem) worried. Is everything okay?<br>B: I'm just thinking about my exam tomorrow.", "answer": "seem"}, {"n": 16, "type": "mcq", "prompt": "I ___ what you mean, but I don't fully agree.", "options": ["understand", "am understanding", "understood"], "answer": "understand"}, {"n": 17, "type": "mcq", "prompt": "She ___ always changing her mind — it's hard to keep up.", "options": ["is", "has", "does"], "answer": "is"}, {"n": 18, "type": "mcq", "prompt": "Do you ___ what I'm saying?", "options": ["understand", "are understanding", "understood"], "answer": "understand"}, {"n": 19, "type": "mcq", "prompt": "This perfume ___ like roses.", "options": ["smell", "smells", "is smelling"], "answer": "smells"}, {"n": 20, "type": "mcq", "prompt": "He ___ to be a great communicator these days.", "options": ["seems", "is seeming", "seem"], "answer": "seems"}, {"n": 21, "type": "mcq", "prompt": "We ___ dinner right now — can you call back later?", "options": ["have", "are having", "has"], "answer": "are having"}, {"n": 22, "type": "fill", "prompt": "I ______ (not/understand) why she's upset.", "answer": "don't understand"}, {"n": 23, "type": "fill", "prompt": "At the moment, they ______ (discuss) the merger.", "answer": "are discussing"}, {"n": 24, "type": "fill", "prompt": "This jacket ______ (feel) like real leather.", "answer": "feels"}, {"n": 25, "type": "fill", "prompt": "It ______ (seem) as though nobody read the email.", "answer": "seems"}, {"n": 26, "type": "error", "prompt": "He's having a lot of money, so he never worries.", "answer": "'s having → has (have แปลว่า \"มี/ครอบครอง\" เป็น state verb)"}, {"n": 27, "type": "error", "prompt": "This coffee tastes wonderfully with milk.", "answer": "wonderfully → wonderful"}, {"n": 28, "type": "error", "prompt": "I'm always think about moving abroad.", "answer": "always think → always thinking (\"always\" + present continuous ต้องมี -ing)"}, {"n": 29, "type": "dialog", "prompt": "A: You ______ (look) exhausted. Rough day?<br>B: You have no idea.", "answer": "look"}, {"n": 30, "type": "dialog", "prompt": "A: It ______ (sound) as though you've already decided.<br>B: Yeah, pretty much.", "answer": "sounds"}]}, {"code": "G2", "title": "1C: Narrative tenses", "explanation": "\n    <div class=\"explain\">\n    <p>เมื่อเล่าเรื่องราวในอดีต (narrative) เราใช้ tense หลายแบบผสมกันเพื่อบอกลำดับเวลาของเหตุการณ์ที่ต่างกัน</p>\n    <table class=\"rule-table\">\n    <tr><th>Tense</th><th>ใช้เมื่อ</th><th>ตัวอย่าง</th></tr>\n    <tr><td><b>Simple Past</b></td><td>เหตุการณ์หลักที่จบแล้ว เรียงตามลำดับเวลา</td>\n        <td>I opened the door and found a cat inside.</td></tr>\n    <tr><td><b>Past Continuous</b></td><td>เหตุการณ์ที่กำลังดำเนินอยู่ ณ จุดหนึ่งในอดีต (ฉากหลัง) หรือกำลังทำอยู่ตอนที่มีอีกเหตุการณ์แทรกเข้ามา</td>\n        <td>I was drinking coffee when Amy came in.</td></tr>\n    <tr><td><b>Past Perfect</b></td><td>เหตุการณ์ที่เกิด \"ก่อน\" อีกเหตุการณ์หนึ่งในอดีต (มักใช้กับ by the time / before)</td>\n        <td>By the time I got to school, everyone had finished the exam.</td></tr>\n    <tr><td><b>Past Perfect Continuous</b></td><td>เหตุการณ์ที่ดำเนินต่อเนื่องมาก่อนอีกเหตุการณ์หนึ่ง (เน้นระยะเวลา)</td>\n        <td>It had been raining for hours when we left.</td></tr>\n    </table>\n    <p><b>Look!</b> Past continuous และ past perfect continuous มักไม่ใช้กับ state verbs\n    → <i>I'd had my car for five years when I sold it.</i> ไม่ใช่ <s>I'd been having</s></p>\n    <p>เชื่อมเหตุการณ์ด้วย <b>when/while</b> (ระหว่างที่), <b>by the time / before</b> (ก่อนที่)\n    ในบทสนทนาที่ลำดับเหตุการณ์ชัดเจนอยู่แล้ว บางครั้งใช้ simple past แทน past perfect ก็ได้\n    (I wrote to Bill, and soon after, I got an answer.)</p>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "Jim ___ for us when we arrived at the station.", "options": ["had waited", "was waiting", "waits"], "answer": "was waiting"}, {"n": 2, "type": "mcq", "prompt": "We ___ to see the new movie for weeks by the time we finally saw it.", "options": ["'d been dying", "died", "die"], "answer": "'d been dying"}, {"n": 3, "type": "mcq", "prompt": "Henry ___ a little depressed, so he decided to take a vacation.", "options": ["had been feeling", "was feeling"], "answer": "had been feeling"}, {"n": 4, "type": "mcq", "prompt": "While I ___ to some friends, someone tapped me on the shoulder.", "options": ["talked", "was talking", "had talked"], "answer": "was talking"}, {"n": 5, "type": "mcq", "prompt": "By the time Anna joined us for dinner, we ___ most of the food.", "options": ["ate", "were eating", "had eaten"], "answer": "had eaten"}, {"n": 6, "type": "mcq", "prompt": "When I met Mike in person, it felt as if I ___ him my whole life!", "options": ["knew", "had known", "was knowing"], "answer": "had known"}, {"n": 7, "type": "fill", "prompt": "I ______ (just/wake) up when I started to feel sick.", "answer": "had just woken"}, {"n": 8, "type": "fill", "prompt": "It ______ (rain) heavily for several hours before the game was cancelled.", "answer": "had been raining"}, {"n": 9, "type": "fill", "prompt": "While we ______ (wait) for the bus, I met someone amazing.", "answer": "were waiting"}, {"n": 10, "type": "fill", "prompt": "He ______ (try) to make eye contact and kept looking in my direction.", "answer": "was trying"}, {"n": 11, "type": "error", "prompt": "I was owning a great apartment in Italy, right by the sea.", "answer": "was owning → owned (own เป็น state verb ไม่ใช้ continuous)"}, {"n": 12, "type": "error", "prompt": "By the time we arrived, the movie already started.", "answer": "already started → had already started (เหตุการณ์ที่เกิดก่อนอีกเหตุการณ์ในอดีต ต้องใช้ past perfect)"}, {"n": 13, "type": "error", "prompt": "I've been to Jim's house a few times before yesterday.", "answer": "'ve been → 'd been (เล่าเหตุการณ์ในอดีตทั้งหมด ต้องใช้ past perfect ไม่ใช่ present perfect)"}, {"n": 14, "type": "dialog", "prompt": "A: You're not going to believe what ______ (happen) to me a few days ago!<br>B: What? ______ (you/win) the lottery?", "answer": "happened / Did you win"}, {"n": 15, "type": "dialog", "prompt": "A: Well, I ______ (stand) at the bus stop, and I ______ (think) about my day at work. Then when I turned around, I saw this guy.<br>B: And then what happened?", "answer": "was standing / was thinking"}, {"n": 16, "type": "mcq", "prompt": "When we got home, someone ___ into our apartment.", "options": ["broke", "was breaking", "had broken"], "answer": "had broken"}, {"n": 17, "type": "mcq", "prompt": "I ___ for the bus for twenty minutes before it finally arrived.", "options": ["waited", "had been waiting", "was waiting"], "answer": "had been waiting"}, {"n": 18, "type": "mcq", "prompt": "She ___ TV when the power went out.", "options": ["watched", "was watching", "had watched"], "answer": "was watching"}, {"n": 19, "type": "mcq", "prompt": "By the time the ambulance arrived, the man ___ conscious again.", "options": ["became", "had become", "was becoming"], "answer": "had become"}, {"n": 20, "type": "mcq", "prompt": "We ___ friends for ten years before we finally got married.", "options": ["were", "had been", "have been"], "answer": "had been"}, {"n": 21, "type": "mcq", "prompt": "I looked out the window and saw that it ___ all night.", "options": ["snowed", "was snowing", "had been snowing"], "answer": "had been snowing"}, {"n": 22, "type": "fill", "prompt": "She ______ (never/see) snow before she moved to Canada.", "answer": "had never seen"}, {"n": 23, "type": "fill", "prompt": "I ______ (walk) home when it started to rain.", "answer": "was walking"}, {"n": 24, "type": "fill", "prompt": "By the time I finished cooking, everyone ______ (already/leave).", "answer": "had already left"}, {"n": 25, "type": "fill", "prompt": "We ______ (drive) for six hours straight before we stopped for gas.", "answer": "had been driving"}, {"n": 26, "type": "error", "prompt": "I had been living in Paris for two years when I meet my husband.", "answer": "meet → met"}, {"n": 27, "type": "error", "prompt": "She was already gone by the time I have arrived.", "answer": "have arrived → arrived"}, {"n": 28, "type": "error", "prompt": "He was working there since 2010 before the company closed.", "answer": "was working → had been working (ระยะเวลาต่อเนื่องก่อนเหตุการณ์อื่นในอดีต)"}, {"n": 29, "type": "dialog", "prompt": "A: Why were you so tired yesterday?<br>B: I ______ (study) all night for the exam.", "answer": "had been studying"}, {"n": 30, "type": "dialog", "prompt": "A: Had you met him before the party?<br>B: No, that ______ (be) the first time we ______ (meet).", "answer": "was / had met"}]}, {"code": "G3", "title": "3A: Advice, expectation, and obligation", "explanation": "\n    <div class=\"explain\">\n    <p>กลุ่มคำกริยาช่วย (modals) ที่ใช้พูดถึงคำแนะนำ ข้อบังคับ และสิ่งที่คาดหวัง มีระดับความหนักเบาต่างกัน</p>\n    <table class=\"rule-table\">\n    <tr><th>Modal</th><th>ความหมาย</th><th>ตัวอย่าง</th></tr>\n    <tr><td><b>must</b></td><td>ข้อบังคับที่มาจากความรู้สึก/ความเห็นของผู้พูดเอง</td><td>I must call my mom tonight.</td></tr>\n    <tr><td><b>have to</b></td><td>ข้อบังคับจากกฎ/สถานการณ์ภายนอก</td><td>You have to wear a badge in this building.</td></tr>\n    <tr><td><b>mustn't</b></td><td>ห้ามทำ (prohibition)</td><td>You mustn't jaywalk here.</td></tr>\n    <tr><td><b>don't have to</b></td><td>ไม่จำเป็นต้องทำ (แต่ทำก็ได้)</td><td>You don't have to tip — it's optional.</td></tr>\n    <tr><td><b>should / ought to</b></td><td>คำแนะนำ</td><td>You should try the local food.</td></tr>\n    <tr><td><b>had better</b></td><td>คำแนะนำที่หนักแน่น มีผลเสียถ้าไม่ทำ มักใช้กับสถานการณ์เฉพาะหน้า</td><td>You'd better hurry, or you'll miss the bus.</td></tr>\n    <tr><td><b>be supposed to</b></td><td>สิ่งที่คาดหวัง/ควรทำตามกฎหรือข้อตกลง (แต่อาจไม่ได้ทำจริง)</td><td>You're not supposed to smoke here.</td></tr>\n    <tr><td><b>be allowed to / be permitted to</b></td><td>ได้รับอนุญาต</td><td>You're allowed to park here after 6 p.m.</td></tr>\n    </table>\n    <p><b>ข้อสอบมักเทียบ:</b> mustn't (ห้ามเด็ดขาด) vs. don't have to (ไม่จำเป็น) — สองคำนี้ความหมายต่างกันมาก\n    และ must (ผู้พูดตัดสินใจเอง) vs. have to (มีกฎภายนอกบังคับ)</p>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "In many U.S. cities, pedestrians ___ cross at a crosswalk — jaywalking is against the law.", "options": ["don't have to", "have to", "could"], "answer": "have to"}, {"n": 2, "type": "mcq", "prompt": "You ___ leave a tip if the service was terrible, but most people still leave something small.", "options": ["mustn't", "don't have to", "aren't allowed to"], "answer": "don't have to"}, {"n": 3, "type": "mcq", "prompt": "___ cross here — the sign clearly says 'No Crossing'.", "options": ["You'd better not", "You don't have to", "You should"], "answer": "You'd better not"}, {"n": 4, "type": "mcq", "prompt": "Visitors ___ wear a helmet on a bike in this city — it's the law.", "options": ["are supposed to", "have to", "should"], "answer": "have to"}, {"n": 5, "type": "mcq", "prompt": "You ___ smoke in the restaurant. It's strictly forbidden.", "options": ["mustn't", "don't have to", "aren't supposed"], "answer": "mustn't"}, {"n": 6, "type": "mcq", "prompt": "According to the sign, guests ___ check out by 11 a.m.", "options": ["are supposed to", "mustn't", "had better not"], "answer": "are supposed to"}, {"n": 7, "type": "fill", "prompt": "You ______ (had better) call ahead — the restaurant gets full fast on weekends.", "answer": "had better"}, {"n": 8, "type": "fill", "prompt": "In this office, employees ______ (not/allowed) to use their phones during meetings.", "answer": "aren't allowed"}, {"n": 9, "type": "fill", "prompt": "I really ______ (ought) to apologize to her — I was rude yesterday.", "answer": "ought"}, {"n": 10, "type": "fill", "prompt": "You ______ (not/have) to bring anything to the party — we've got it all covered.", "answer": "don't have"}, {"n": 11, "type": "error", "prompt": "You don't have to park here — it's a fire lane and you'll get a fine.", "answer": "don't have to → mustn't (เป็นการห้ามเด็ดขาด ไม่ใช่แค่ไม่จำเป็น)"}, {"n": 12, "type": "error", "prompt": "According to the rules, you must not check in online, but most people do it anyway to save time.", "answer": "must not → don't have to (ไม่ใช่ข้อห้าม แค่ไม่จำเป็นต้องทำ)"}, {"n": 13, "type": "error", "prompt": "She should to see a doctor about that cough.", "answer": "should to → should (should ตามด้วย infinitive ไม่มี to)"}, {"n": 14, "type": "dialog", "prompt": "A: Can I park my car here overnight?<br>B: No, you ______ (allowed) — this area is for residents only.", "answer": "aren't allowed to"}, {"n": 15, "type": "dialog", "prompt": "A: Do I need a reservation for that restaurant?<br>B: You ______ (not/have to), but I'd recommend it since it's popular.", "answer": "don't have to"}, {"n": 16, "type": "mcq", "prompt": "You ___ take your shoes off before entering — it's the custom here.", "options": ["are supposed to", "mustn't", "don't have to"], "answer": "are supposed to"}, {"n": 17, "type": "mcq", "prompt": "Employees ___ arrive late more than twice a month, or they'll be fired.", "options": ["mustn't", "don't have to", "could"], "answer": "mustn't"}, {"n": 18, "type": "mcq", "prompt": "You ___ bring your passport — a copy is fine.", "options": ["don't have to", "mustn't", "shouldn't"], "answer": "don't have to"}, {"n": 19, "type": "mcq", "prompt": "___ leave now if you want to catch the early train.", "options": ["You'd better", "You don't have to", "You could"], "answer": "You'd better"}, {"n": 20, "type": "mcq", "prompt": "Students ___ submit the assignment by Friday at the latest.", "options": ["are supposed to", "mustn't", "needn't"], "answer": "are supposed to"}, {"n": 21, "type": "mcq", "prompt": "You ___ worry about the deadline — it's been extended.", "options": ["don't have to", "mustn't", "had better not"], "answer": "don't have to"}, {"n": 22, "type": "fill", "prompt": "Passengers ______ (not/allowed) to use phones during takeoff.", "answer": "aren't allowed"}, {"n": 23, "type": "fill", "prompt": "You ______ (ought) to see a dentist about that toothache.", "answer": "ought"}, {"n": 24, "type": "fill", "prompt": "At my old school, we ______ (have to) wear uniforms every day.", "answer": "had to"}, {"n": 25, "type": "fill", "prompt": "You ______ (better) not be late again, or you'll be in trouble.", "answer": "'d better"}, {"n": 26, "type": "error", "prompt": "You should to ask for permission before you leave early.", "answer": "should to → should (should ตามด้วย infinitive ไม่มี to)"}, {"n": 27, "type": "error", "prompt": "We must to finish this by Friday.", "answer": "must to → must"}, {"n": 28, "type": "error", "prompt": "Visitors don't have to touch the paintings in this gallery.", "answer": "don't have to → mustn't / aren't allowed to (เป็นข้อห้าม ไม่ใช่แค่ไม่จำเป็น)"}, {"n": 29, "type": "dialog", "prompt": "A: Do we need a visa to visit?<br>B: No, you ______ (not/have to) — it's visa-free for 30 days.", "answer": "don't have to"}, {"n": 30, "type": "dialog", "prompt": "A: Can I take photos inside the museum?<br>B: No, you ______ (allowed) — it's strictly prohibited.", "answer": "aren't allowed to"}]}, {"code": "G4", "title": "3C: Phrasal verbs", "explanation": "\n    <div class=\"explain\">\n    <p>Phrasal verb คือกริยาที่ตามด้วยคำเช่น up, down, through, on, off ความหมายบางครั้งเดาจากคำกริยาหลักได้\n    (turn off = ปิด) แต่ส่วนใหญ่มีความหมายเฉพาะที่ต้องจำเป็นชุด (come across = บังเอิญเจอ) มี 4 แบบหลัก:</p>\n    <table class=\"rule-table\">\n    <tr><th>ประเภท</th><th>กฎการวางตำแหน่ง</th><th>ตัวอย่าง</th></tr>\n    <tr><td><b>ไม่มีกรรม</b></td><td>ไม่มีคำมาคั่นกลาง</td><td>My daughter wants to be a doctor when she <b>grows up</b>.</td></tr>\n    <tr><td><b>มีกรรม (แยกได้)</b></td><td>กรรมวางหลังหรือแทรกกลางก็ได้ แต่ถ้ากรรมเป็นสรรพนาม (it, him...) ต้องแทรกกลางเท่านั้น</td>\n        <td>Try on my shoes / Try my shoes on. → Try <b>them</b> on. (ไม่ใช่ Try on them)</td></tr>\n    <tr><td><b>มีกรรม (แยกไม่ได้)</b></td><td>กรรมวางหลังเท่านั้น แม้เป็นสรรพนามก็ตาม</td>\n        <td>I'll go over the questions with you. → I'll go over <b>them</b>. (ไม่ใช่ go them over)</td></tr>\n    <tr><td><b>3 คำ (แยกไม่ได้)</b></td><td>กรรมวางหลังสุดเสมอ</td><td>Do you get along with your sister?</td></tr>\n    </table>\n    <p><b>คำศัพท์สำคัญจากบทเรียน:</b> break up, throw out, show...around, pick up, take after, put up with,\n    turn off, take out, come across, grow up, go back, try on, get on, go over, get along with, get away with,\n    eat out, look for, look forward to, look up, take off, talk into, turn down, use up, come up with,\n    turn up, get out of, figure out, pay off</p>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "I really don't know how much longer I can ___ my boss's bad attitude!", "options": ["put up with", "look up", "take after"], "answer": "put up with"}, {"n": 2, "type": "mcq", "prompt": "If you don't know a word, you can always ___ it in a dictionary.", "options": ["look up", "look for", "look forward to"], "answer": "look up"}, {"n": 3, "type": "mcq", "prompt": "I think my daughter really ___ her father — same sense of humor.", "options": ["takes after", "gets along with", "shows around"], "answer": "takes after"}, {"n": 4, "type": "mcq", "prompt": "Our plane ___ on time and landed early.", "options": ["took off", "turned down", "gave up"], "answer": "took off"}, {"n": 5, "type": "mcq", "prompt": "Choose the correct sentence with a pronoun object.", "options": ["I bought you a jacket. Try on it.", "I bought you a jacket. Try it on.", "I bought you a jacket. Try on."], "answer": "I bought you a jacket. Try it on."}, {"n": 6, "type": "mcq", "prompt": "Choose the correct sentence (non-separable phrasal verb + pronoun).", "options": ["I'll go them over with you.", "I'll go over them with you.", "I'll go over with them."], "answer": "I'll go over them with you."}, {"n": 7, "type": "fill", "prompt": "We ______ (break up) last week after the party — it just wasn't working out.", "answer": "broke up"}, {"n": 8, "type": "fill", "prompt": "You dropped a fork. Please ______ (pick) it ______ and put it in the sink.", "answer": "pick / up"}, {"n": 9, "type": "fill", "prompt": "Katie ______ her parents ______ (show) her new apartment yesterday.", "answer": "showed / around"}, {"n": 10, "type": "fill", "prompt": "I can't find my glasses! I ______ (look) for them all day yesterday!", "answer": "looked"}, {"n": 11, "type": "error", "prompt": "I thought I'd lost my wallet, but then it turned it up.", "answer": "turned it up → turned up (ไม่มีกรรม จึงไม่มี \"it\")"}, {"n": 12, "type": "error", "prompt": "I came something really weird across. I don't know what it is.", "answer": "came something really weird across → came across something really weird (come across แยกไม่ได้)"}, {"n": 13, "type": "error", "prompt": "I know you don't want to go, but we can't get it out of.", "answer": "get it out of → get out of it (get out of เป็นกริยา 2 คำ แยกไม่ได้, กรรมวางหลังเสมอ)"}, {"n": 14, "type": "dialog", "prompt": "A: Why isn't Joe with you tonight?<br>B: Did you not hear? We ______ (break up) last month.", "answer": "broke up"}, {"n": 15, "type": "dialog", "prompt": "A: These math problems are so hard!<br>B: I know, I can't ______ (figure) them ______ either.", "answer": "figure / out"}, {"n": 16, "type": "mcq", "prompt": "I can't believe he ___ his best friend at the airport by pure chance!", "options": ["came across", "took after", "gave up"], "answer": "came across"}, {"n": 17, "type": "mcq", "prompt": "She's trying to ___ a solution to the problem.", "options": ["come up with", "get along with", "put up with"], "answer": "come up with"}, {"n": 18, "type": "mcq", "prompt": "The hard work finally ___ when he got the promotion.", "options": ["paid off", "turned down", "used up"], "answer": "paid off"}, {"n": 19, "type": "mcq", "prompt": "He ___ the job offer because the salary was too low.", "options": ["turned down", "took off", "looked up"], "answer": "turned down"}, {"n": 20, "type": "mcq", "prompt": "We ___ all the milk, so we need to buy more.", "options": ["used up", "turned down", "paid off"], "answer": "used up"}, {"n": 21, "type": "mcq", "prompt": "Choose the sentence with correct pronoun placement.", "options": ["She picked up it from the floor.", "She picked it up from the floor.", "She picked up from it the floor."], "answer": "She picked it up from the floor."}, {"n": 22, "type": "fill", "prompt": "I ______ (throw) out my old notes by mistake!", "answer": "threw"}, {"n": 23, "type": "fill", "prompt": "Let's ______ (eat) out tonight — I don't feel like cooking.", "answer": "eat"}, {"n": 24, "type": "fill", "prompt": "He tried to cheat on the test, but he didn't ______ (get) away with it.", "answer": "get"}, {"n": 25, "type": "fill", "prompt": "Do you ______ (get) along with your new roommate?", "answer": "get"}, {"n": 26, "type": "error", "prompt": "I couldn't come up any good ideas for the project.", "answer": "come up any → come up with any"}, {"n": 27, "type": "error", "prompt": "The teacher talked me into join the debate club.", "answer": "into join → into joining (phrasal verb + gerund)"}, {"n": 28, "type": "error", "prompt": "Please turn down it — it's too loud.", "answer": "turn down it → turn it down (สรรพนามต้องแทรกกลาง)"}, {"n": 29, "type": "dialog", "prompt": "A: Are you going to ______ (take) that job?<br>B: No, I've decided to ______ (turn) it ______.", "answer": "take / turn / down"}, {"n": 30, "type": "dialog", "prompt": "A: What time does your flight ______ (take) ______?<br>B: Around 7 a.m., so we'd better hurry.", "answer": "take / off"}]}], "vocabulary": [{"code": "V1", "title": "1A: Body language and communication", "explanation": "\n    <div class=\"explain\">\n    <p><b>คำศัพท์สำคัญ:</b> raise your voice (พูดเสียงดังขึ้น/ตะโกน), shrug your shoulders (ยักไหล่ — ไม่รู้/ไม่สนใจ),\n    tap someone on the shoulder (แตะไหล่เพื่อเรียกความสนใจ), nod (พยักหน้า), shake your head (ส่ายหน้า),\n    wave (โบกมือ), give someone a hug (กอด), kiss someone on the cheek (จูบแก้ม), stare (จ้องมอง),\n    gaze (จ้องมองด้วยความหลงใหล/เพลิดเพลิน), wink (ขยิบตา), frown (ทำหน้าบึ้ง/ขมวดคิ้ว),\n    make eye contact (สบตา), shake hands (จับมือทักทาย)</p>\n    <p><b>รูปแบบการสื่อสาร (communication styles):</b> audio communicator (เน้นฟัง), visual communicator (เน้นเห็นภาพ),\n    kinesthetic communicator (เน้นสัมผัส/เคลื่อนไหว)</p>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "\"I have no idea what you're talking about\" is best expressed with...", "options": ["shrugging your shoulders", "nodding", "winking"], "answer": "shrugging your shoulders"}, {"n": 2, "type": "mcq", "prompt": "To get someone's attention from behind without speaking, you could...", "options": ["tap them on the shoulder", "frown at them", "stare at them"], "answer": "tap them on the shoulder"}, {"n": 3, "type": "mcq", "prompt": "Agreeing silently with someone is usually shown by...", "options": ["nodding", "shaking your head", "shrugging"], "answer": "nodding"}, {"n": 4, "type": "mcq", "prompt": "Disagreeing or saying \"no\" without words is usually shown by...", "options": ["shaking your head", "nodding", "waving"], "answer": "shaking your head"}, {"n": 5, "type": "mcq", "prompt": "A visual communicator mainly interacts with the world using their...", "options": ["eyes", "ears", "hands"], "answer": "eyes"}, {"n": 6, "type": "mcq", "prompt": "\"He's staring at me from across the room\" most likely means he is trying to...", "options": ["make eye contact", "shrug his shoulders", "raise his voice"], "answer": "make eye contact"}, {"n": 7, "type": "fill", "prompt": "There's no microphone, so the audience won't hear you unless you ______ your ______.", "answer": "raise / voice"}, {"n": 8, "type": "fill", "prompt": "When my mother told me the news, I said \"No way!\" and ______ my ______ from side to side.", "answer": "shook / head"}, {"n": 9, "type": "fill", "prompt": "In the business world, you can tell a lot about someone's character by how they ______ their head up and down.", "answer": "nod"}, {"n": 10, "type": "fill", "prompt": "He was standing with his back to me, so I ______ him ______ the shoulder.", "answer": "tapped / on"}, {"n": 11, "type": "error", "prompt": "She tapped me at the shoulder to get my attention.", "answer": "at the shoulder → on the shoulder"}, {"n": 12, "type": "error", "prompt": "He winked to me, so I knew it was a joke.", "answer": "winked to me → winked at me"}, {"n": 13, "type": "error", "prompt": "I could tell she was annoyed because she was smiling the whole time.", "answer": "smiling → frowning (การบึ้งหน้าแสดงความหงุดหงิด ไม่ใช่ยิ้ม)"}, {"n": 14, "type": "dialog", "prompt": "A: How did you know Keith didn't agree with the plan?<br>B: He didn't say anything — he just ______ (shake) his head.", "answer": "shook"}, {"n": 15, "type": "dialog", "prompt": "A: Did she seem happy to see you?<br>B: Definitely — she ran over and ______ (give) me a big ______.", "answer": "gave / hug"}, {"n": 16, "type": "mcq", "prompt": "Winking at someone usually signals...", "options": ["a shared joke or secret", "anger", "confusion"], "answer": "a shared joke or secret"}, {"n": 17, "type": "mcq", "prompt": "A kinesthetic communicator mainly interacts with the world using their...", "options": ["body and touch", "eyes", "ears"], "answer": "body and touch"}, {"n": 18, "type": "mcq", "prompt": "\"He's frowning\" means his face shows...", "options": ["displeasure", "happiness", "surprise"], "answer": "displeasure"}, {"n": 19, "type": "mcq", "promp ticiple (-ing)</td><td>good-looking, far-reaching, forward-thinking, slow-moving</td>\n        <td>หน้าตาดี, ส่งผลกว้างไกล, มองการณ์ไกล, เคลื่อนไหวช้า</td></tr>\n    <tr><td>adj/adv/noun + past participle (-ed)</td><td>old-fashioned, highly respected, middle-aged, open-minded, well-educated, self-centered</td>\n        <td>ล้าสมัย, ได้รับการยกย่องสูง, วัยกลางคน, ใจกว้าง, มีการศึกษาดี, เห็นแก่ตัว</td></tr>\n    <tr><td>noun + adjective/present participle</td><td>world-famous, life-changing, record-breaking, time-consuming</td>\n        <td>โด่งดังทั่วโลก, เปลี่ยนชีวิต, ทำลายสถิติ, กินเวลานาน</td></tr>\n    </table>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "That dress is totally out of style — it's very ___.", "options": ["old-fashioned", "world-famous", "record-breaking"], "answer": "old-fashioned"}, {"n": 2, "type": "mcq", "prompt": "It's really ___ to do all this homework — I'll be here for hours.", "options": ["time-consuming", "good-looking", "middle-aged"], "answer": "time-consuming"}, {"n": 3, "type": "mcq", "prompt": "My manager is very ___ — she always has innovative ideas.", "options": ["forward-thinking", "self-centered", "old-fashioned"], "answer": "forward-thinking"}, {"n": 4, "type": "mcq", "prompt": "A ___ novelist spoke at our school, but I'd never heard of him before.", "options": ["world-famous", "slow-moving", "highly respected"], "answer": "world-famous"}, {"n": 5, "type": "mcq", "prompt": "His decision to leave his job had ___ consequences for his whole family.", "options": ["far-reaching", "record-breaking", "well-educated"], "answer": "far-reaching"}, {"n": 6, "type": "mcq", "prompt": "People who are ___ only think about what's important for themselves.", "options": ["self-centered", "open-minded", "well-educated"], "answer": "self-centered"}, {"n": 7, "type": "fill", "prompt": "When Emily was over 50, she made a ______ decision and moved to China.", "answer": "life-changing"}, {"n": 8, "type": "fill", "prompt": "When esearch.", "options": ["world-famous", "middle-aged", "self-centered"], "answer": "world-famous"}, {"n": 21, "type": "mcq", "prompt": "Meeting my mentor was a ___ experience for me.", "options": ["life-changing", "time-consuming", "old-fashioned"], "answer": "life-changing"}, {"n": 22, "type": "fill", "prompt": "He's quite ______ (self/center) — he never asks how others are doing.", "answer": "self-centered"}, {"n": 23, "type": "fill", "prompt": "The professor is ______ (highly/respect) in the field of medicine.", "answer": "highly respected"}, {"n": 24, "type": "fill", "prompt": "Renovating the house was a very ______ (time/consume) project.", "answer": "time-consuming"}, {"n": 25, "type": "fill", "prompt": "The runner achieved a ______ (record/break) time in the marathon.", "answer": "record-breaking"}, {"n": 26, "type": "error", "prompt": "She's very good-look for her age.", "answer": "good-look → good-looking"}, {"n": 27, "type": "error", "prompt": "He is a far-reach thinker who plans years ahead.", "answer": "far-reach thinker → forward-thinking (far-reaching อธิบายผลกระทบ ไม่ใช่ตัวคน)"}, {"n": 28, "type": "error", "prompt": "That's such a life-change opportunity — you should take it!", "answer": "life-change → life-changing"}, {"n": 29, "type": "dialog", "prompt": "A: What's your grandfather like?<br>B: He's elderly but incredibly ______ (open/mind) for his generation.", "answer": "open-minded"}, {"n": 30, "type": "dialog", "prompt": "A: Why do people admire her so much?<br>B: She's ______ (world/famous) for her ______ (record/break) achievements in swimming.", "answer": "world-famous / record-breaking"}]}, {"code": "V3", "title": "1C: Expectations", "explanation": "\n    <div class=\"explain\">\n    <p><b>คำศัพท์เกี่ยวกับความคาดหวัง:</b></p>\n    <table class=\"rule-table\">\n    <tr><th>Verb</th><th>Noun</th><th>ความหมาย</th></tr>\n    <tr><td>expect</td><td>expectation</td><td>คาดหวัง</td></tr>\n    <tr><td>disappoint</td><td>disappointment</td><td>ทำให้ผิดหวัง / ความผิดหวัง</td></tr>\n    <tr><td>succeed</td><td>success</td><td>ประสบความสำเร็จ</td></tr>\n    <tr><td>impress</td><td>impression</td><td>สร้างความประทับใจ</td></tr>\n    <tr><td>fail</td><td>failure</td><td>ล้มเหลว</td></tr>\n    </table>\n    <p><b>สำนวนที่ควรจำ:</b> look forward to (ตั้งตารอ), hope for (หวังว่าจะได้), live without (อยู่ได้โดยไม่มี),\n    meet someone's expectations (เป็นไปตามที่คาดหวัง), lower one's expectations (ลดความคาดหวังลง),\n    make a good first impression (สร้างความประทับใจแรกพบ), a huge disappointment (ความผิดหวังครั้งใหญ่)</p>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "\"I can't wait to meet her\" means the speaker is...", "options": ["looking forward to meeting her", "not interested in meeting her", "worried about meeting her"], "answer": "looking forward to meeting her"}, {"n": 2, "type": "mcq", "prompt": "\"The service met my expectations\" means...", "options": ["it was what I expected", "it wasn't what I expected", "it was terrible"], "answer": "it was what I expected"}, {"n": 3, "type": "mcq", "prompt": "\"The movie was such a disappointment to my mother\" means she...", "options": ["expected it to be better", "expected it to be worse", "loved it"], "answer": "expected it to be better"}, {"n": 4, "type": "mcq", "prompt": "\"My brother says he can't live without his cell phone\" means he...", "options": ["hates not having it with him", "doesn't mind not having it", "never uses it"], "answer": "hates not having it with him"}, {"n": 5, "type": "mcq", "prompt": "The noun form of \"succeed\" is...", "options": ["success", "successful", "succession"], "answer": "success"}, {"n": 6, "type": "mcq", "prompt": "The noun form of \"disappoint\" is...", "options": ["disappointment", "disappointing", "disappointed"], "answer": "disappointment"}, {"n": 7, "type": "fill", "prompt": "The band's last album was a huge ______ (succeed) — it sold millions of copies.", "answer": "success"}, {"n": 8, "type": "fill", "prompt": "I was really ______ (disappoint) with how the trip turned out.", "answer": "disappointed"}, {"n": 9, "type": "fill", "prompt": "His performance really ______ (impress) the judges.", "answer": "impressed"}, {"n": 10, "type": "fill", "prompt": "The experiment was a ______ (fail) because we didn't follow the instructions.", "answer": "failure"}, {"n": 11, "type": "error", "prompt": "I was hoping to something better than this.", "answer": "hoping to → hoping for"}, {"n": 12, "type": "error", "prompt": "She made a good first impress on the interviewer.", "answer": "impress → impression"}, {"n": 13, "type": "error", "prompt": "I expected the food to be better, so I had to lower my expectation.", "answer": "expectation → expectations (มักใช้พหูพจน์ในสำนวนนี้)"}, {"n": 14, "type": "dialog", "prompt": "A: How was the new restaurant?<br>B: Honestly, it ______ (fail) to ______ (impress) me at all.", "answer": "failed / impress"}, {"n": 15, "type": "dialog", "prompt": "A: Are you excited about the trip?<br>B: Yes, I've been ______ (look) forward ______ it for months!", "answer": "looking / to"}, {"n": 16, "type": "mcq", "prompt": "The noun form of \"impress\" is...", "options": ["impression", "impressive", "impressed"], "answer": "impression"}, {"n": 17, "type": "mcq", "prompt": "\"I was hoping for something better\" means the speaker...", "options": ["wasn't pleased", "was pleased", "didn't care"], "answer": "wasn't pleased"}, {"n": 18, "type": "mcq", "prompt": "\"She made a good first impression on me\" means...", "options": ["before I got to know her, I liked her", "after I got to know her, I liked her"], "answer": "before I got to know her, I liked her"}, {"n": 19, "type": "mcq", "prompt": "\"The play was a success\" means...", "options": ["people liked it", "people didn't like it", "it was cancelled"], "answer": "people liked it"}, {"n": 20, "type": "mcq", "prompt": "The adjective form of \"disappoint\" describing a person's feeling is...", "options": ["disappointed", "disappointment", "disappointing"], "answer": "disappointed"}, {"n": 21, "type": "mcq", "prompt": "The adjective form of \"disappoint\" describing a thing/event is...", "options": ["disappointing", "disappointed", "disappointment"], "answer": "disappointing"}, {"n": 22, "type": "fill", "prompt": "I can't ______ (live) without my morning coffee.", "answer": "live"}, {"n": 23, "type": "fill", "prompt": "Their performance ______ (impress) the whole audience.", "answer": "impressed"}, {"n": 24, "type": "fill", "prompt": "He ______ (fail) to meet his own expectations this year.", "answer": "failed"}, {"n": 25, "type": "fill", "prompt": "We were ______ (hope) for a bigger bonus this year.", "answer": "hoping"}, {"n": 26, "type": "error", "prompt": "The movie was a big disappoint for everyone.", "answer": "disappoint → disappointment"}, {"n": 27, "type": "error", "prompt": "She succeeded to pass the exam on her first try.", "answer": "succeeded to pass → succeeded in passing"}, {"n": 28, "type": "error", "prompt": "I have high expectation for this project.", "answer": "expectation → expectations"}, {"n": 29, "type": "dialog", "prompt": "A: How did the interview go?<br>B: I think I ______ (impress) them — they said they'd call this week.", "answer": "impressed"}, {"n": 30, "type": "dialog", "prompt": "A: Are you disappointed with the results?<br>B: A little. I was ______ (hope) for something better.", "answer": "hoping"}]}, {"code": "V4", "title": "3A: Urban places and problems", "explanation": "\n    <div class=\"explain\">\n    <p><b>คำศัพท์สำคัญ:</b> harbor (ท่าเรือ), taxi stand (จุดจอดรับแท็กซี่), business district (ย่านธุรกิจ),\n    smog (หมอกควัน), congestion (การจราจรติดขัด), crosswalk (ทางม้าลาย), jaywalking (การข้ามถนนผิดกฎ/ไม่ข้ามทางม้าลาย),\n    sidewalk (ทางเท้า), a fine (ค่าปรับ), a generous tip (ทิปที่ให้อย่างเอื้อเฟื้อ), rush hour (ชั่วโมงเร่งด่วน),\n    pedestrian (คนเดินเท้า), downtown (ใจกลางเมือง)</p>\n    </div>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "A place to keep boats and ships is called a...", "options": ["harbor", "sidewalk", "crosswalk"], "answer": "harbor"}, {"n": 2, "type": "mcq", "prompt": "A commercial area in a city is called the...", "options": ["business district", "taxi stand", "harbor"], "answer": "business district"}, {"n": 3, "type": "mcq", "prompt": "A type of dirty, hazy air that affects cities is called...", "options": ["smog", "congestion", "a fine"], "answer": "smog"}, {"n": 4, "type": "mcq", "prompt": "When roads are blocked by too many cars, this is called...", "options": ["congestion", "smog", "a crosswalk"], "answer": "congestion"}, {"n": 5, "type": "mcq", "prompt": "Crossing the street somewhere other than a marked crossing is called...", "options": ["jaywalking", "commuting", "sightseeing"], "answer": "jaywalking"}, {"n": 6, "type": "mcq", "prompt": "The amount of money you have to pay for breaking a rule is called a...", "options": ["fine", "tip", "fee"], "answer": "fine"}, {"n": 7, "type": "fill", "prompt": "I left a ______ tip because the service was excellent.", "answer": "generous"}, {"n": 8, "type": "fill", "prompt": "We got to the ______ ______ to catch a cab back to the hotel.", "answer": "taxi / stand"}, {"n": 9, "type": "fill", "prompt": "The officer gave him an $80 ______ for crossing outside the crosswalk.", "answer": "fine"}, {"n": 10, "type": "fill", "prompt": "Traffic was moving slowly because of the ______ downtown.", "answer": "congestion"}, {"n": 11, "type": "error", "prompt": "You must always cross the street at the sidewalk, or you might get a fine.", "answer": "sidewalk → crosswalk"}, {"n": 12, "type": "error", "prompt": "The sky was dark gray — I wondered if it was congestion.", "answer": "congestion → smog"}, {"n": 13, "type": "error", "prompt": "We waited at the business district to catch a taxi.", "answer": "business district → taxi stand"}, {"n": 14, "type": "dialog", "prompt": "A: Why did you get a ticket?<br>B: I didn't realize ______ (jaywalk) was illegal here — I just crossed wherever I wanted!", "answer": "jaywalking"}, {"n": 15, "type": "dialog", "prompt": "A: Why is it taking so long to get downtown?<br>B: There's terrible ______ (congest) at this time of day.", "answer": "congestion"}, {"n": 16, "type": "mcq", "prompt": "The time of day when traffic is heaviest is called...", "options": ["rush hour", "congestion", "crosswalk"], "answer": "rush hour"}, {"n": 17, "type": "mcq", "prompt": "A person walking (not driving) is called a...", "options": ["pedestrian", "commuter", "resident"], "answer": "pedestrian"}, {"n": 18, "type": "mcq", "prompt": "The main commercial area of a city, often full of offices and shops, is the...", "options": ["downtown", "harbor", "sidewalk"], "answer": "downtown"}, {"n": 19, "type": "mcq", "prompt": "The paved path beside a street for walking is called the...", "options": ["sidewalk", "crosswalk", "harbor"], "answer": "sidewalk"}, {"n": 20, "type": "mcq", "prompt": "If you don't leave enough money for good service, your tip might be considered...", "options": ["not generous", "generous", "illegal"], "answer": "not generous"}, {"n": 21, "type": "mcq", "prompt": "A marked area where pedestrians can safely cross the street is a...", "options": ["crosswalk", "sidewalk", "taxi stand"], "answer": "crosswalk"}, {"n": 22, "type": "fill", "prompt": "It's hard to find parking ______ during the day.", "answer": "downtown"}, {"n": 23, "type": "fill", "prompt": "The city was full of ______ (pedestrian) rushing to work.", "answer": "pedestrians"}, {"n": 24, "type": "fill", "prompt": "Traffic barely moves during ______ hour.", "answer": "rush"}, {"n": 25, "type": "fill", "prompt": "He got a ______ for parking in a no-parking zone.", "answer": "fine"}, {"n": 26, "type": "error", "prompt": "We waited on the crosswalk for a taxi to arrive.", "answer": "crosswalk → taxi stand"}, {"n": 27, "type": "error", "prompt": "There was a lot of congestion, so traffic moved very quickly.", "answer": "quickly → slowly"}, {"n": 28, "type": "error", "prompt": "Jaywalking means crossing the street safely at a marked crosswalk.", "answer": "safely at a marked crosswalk → illegally, not at a marked crossing"}, {"n": 29, "type": "dialog", "prompt": "A: Why is it so hazy outside today?<br>B: There's a lot of ______ (smog) from the traffic.", "answer": "smog"}, {"n": 30, "type": "dialog", "prompt": "A: Where should we wait for a cab?<br>B: There's a ______ ______ (taxi/stand) right around the corner.", "answer": "taxi stand"}]}], "listening": {"code": "L", "title": "Listening Practice", "note": "\n<p class=\"note\"><b>หมายเหตุ:</b> เนื่องจากเอกสารต้นฉบับที่แนบมาไม่มีไฟล์เสียงประกอบ ส่วนนี้จึงจำลองข้อสอบ Listening\nโดยใช้ <b>บทพูด/บทสนทนา (transcript)</b> จากหัวข้อ Unit 1 และ Unit 3 ให้อ่านแทนการฟัง แต่รูปแบบคำถาม\n(identifying attitude, true/false, multiple choice) เหมือนกับที่จะออกสอบจริงทุกประการ\nควรฝึกอ่านออกเสียงบทสนทนาเหล่านี้ดัง ๆ เพื่อฝึกทักษะการฟังไปพร้อมกัน</p>\n", "passages": ["\n<div class=\"passage\">\n<p class=\"ptitle\">Transcript 1 — \"Talking Zone\": The Cool Factor (อ้างอิงหัวข้อ 1B)</p>\n<p><b>Albany:</b> \"You know, people ask me all the time what it takes to be 'cool'. Honestly? I don't think\nabout it. I think cool is just being yourself. In a way, I tend to think that most people care way too much\nabout that kind of thing. I've never tried to plan how I act — I just do what feels natural, and somehow\npeople responded to that. This is probably the most important thing I've learned: you can't force it.\nThe moment you try too hard, it stops being real.\"</p>\n</div>\n", "\n<div class=\"passage\">\n<p class=\"ptitle\">Transcript 2 — A bad trip story (อ้างอิงหัวข้อ 1C / 3A)</p>\n<p><b>Sam:</b> Hey, how was your trip to New York?<br>\n<b>Dana:</b> Honestly, it didn't go as planned. We'd been looking forward to it for months, so we splurged\non a nice dinner our first night. The food was great, but when I left a 10% tip — which is generous back\nhome — the waiter told me it wasn't enough! Apparently in New York people expect at least 20%.<br>\n<b>Sam:</b> Oh no, that's an expensive lesson.<br>\n<b>Dana:</b> It gets worse. The next morning, I was jaywalking to get to a coffee shop, and a police officer\nstopped me. I had no idea it was illegal there! He gave me a fine on the spot.<br>\n<b>Sam:</b> Wow, sounds like a rough start to the trip.<br>\n<b>Dana:</b> It was, but by the end of the week we'd figured out the local rules and had a great time.</p>\n</div>\n"], "exercises": [{"n": 1, "type": "mcq", "prompt": "[Transcript 1] What is Albany's attitude toward being cool?", "options": ["She never thinks about being cool and doesn't try.", "She tries very hard to be cool all the time.", "She thinks being cool is impossible."], "answer": "She never thinks about being cool and doesn't try."}, {"n": 2, "type": "tf", "prompt": "[Transcript 1] Albany believes most people don't care about being cool.", "answer": "False (she says most people care too much about it)"}, {"n": 3, "type": "mcq", "prompt": "[Transcript 1] Which phrase shows Albany expressing a fairly confident opinion?", "options": ["\"I tend to think...\"", "\"It might be...\"", "\"I'm not sure, but...\""], "answer": "\"I tend to think...\""}, {"n": 4, "type": "mcq", "prompt": "[Transcript 1] According to Albany, what happens when you try too hard to be cool?", "options": ["It stops being real.", "People like you more.", "Nothing changes."], "answer": "It stops being real."}, {"n": 5, "type": "tf", "prompt": "[Transcript 1] Albany describes her advice about being cool as \"probably the most important thing\" she's learned.", "answer": "True"}, {"n": 6, "type": "mcq", "prompt": "[Transcript 2] Why was Dana's tip a problem?", "options": ["It was less than what New York waiters expect.", "She forgot to leave a tip.", "She paid in the wrong currency."], "answer": "It was less than what New York waiters expect."}, {"n": 7, "type": "tf", "prompt": "[Transcript 2] Dana already knew that jaywalking was illegal in New York.", "answer": "False (she had no idea it was illegal)"}, {"n": 8, "type": "mcq", "prompt": "[Transcript 2] What tense is used in \"We'd been looking forward to it for months\"?", "options": ["Past perfect continuous", "Past continuous", "Present perfect"], "answer": "Past perfect continuous"}, {"n": 9, "type": "mcq", "prompt": "[Transcript 2] How does the story end?", "options": ["They eventually learned the local rules and enjoyed the rest of the trip.", "They left the city early.", "They never figured out the rules."], "answer": "They eventually learned the local rules and enjoyed the rest of the trip."}, {"n": 10, "type": "tf", "prompt": "[Transcript 2] Dana received a fine for not leaving enough of a tip.", "answer": "False (the fine was for jaywalking, not the tip)"}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const TYPE_LABEL = {mcq:"เลือกคำตอบ", fill:"เติมคำ", error:"แก้ที่ผิด", dialog:"บทสนทนา", tf:"True/False"};

// answers[qid] = 'correct' | 'incorrect'
const answers = {};

function allTopics(){
  return [...DATA.grammar.map(t=>({...t, group:'grammar'})),
          ...DATA.vocabulary.map(t=>({...t, group:'vocabulary'})),
          {...DATA.listening, group:'listening', exercises: DATA.listening.exercises}];
}

function topicById(code){ return allTopics().find(t=>t.code===code); }

function topicProgress(topic){
  let answered=0, correct=0;
  topic.exercises.forEach(q=>{
    const id = topic.code+'-'+q.n;
    if(answers[id]){ answered++; if(answers[id]==='correct') correct++; }
  });
  return {answered, correct, total: topic.exercises.length};
}

function buildNav(){
  const g = document.getElementById('nav-grammar');
  const v = document.getElementById('nav-vocab');
  g.innerHTML=''; v.innerHTML='';
  DATA.grammar.forEach((t,i)=>{
    g.innerHTML += navItemHtml(t, 'G'+(i+1)+': '+t.title.split(': ')[1]);
  });
  DATA.vocabulary.forEach((t,i)=>{
    v.innerHTML += navItemHtml(t, 'V'+(i+1)+': '+t.title.split(': ')[1]);
  });
}
function navItemHtml(t, label){
  const p = topicProgress(t);
  const done = p.total>0 && p.answered===p.total;
  return `<div class="navitem${done?' done':''}" data-target="${t.code}">
    <span>${label}</span><span class="stamp">${done?'✓':p.answered+'/'+p.total}</span></div>`;
}

function setActive(target){
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.target===target);
  });
}

function render(target){
  setActive(target);
  const main = document.getElementById('main');
  if(target==='overview'){ main.innerHTML = renderOverview(); attachOverviewHandlers(); return; }
  if(target==='listening'){ main.innerHTML = renderListening(); attachQuestionHandlers(DATA.listening); return; }
  const topic = topicById(target);
  main.innerHTML = renderTopic(topic);
  attachQuestionHandlers(topic);
  const tog = document.getElementById('explain-toggle-btn');
  if(tog){ tog.addEventListener('click', ()=>{
    document.getElementById('explain-wrap').classList.toggle('open');
  }); }
}

function renderTicketHeader(title, sub, badge){
  const total = arguments[3] || 0, answeredCorrect = arguments[4];
  return `<div class="ticket"><div class="row1">
      <div><h2 class="disp">${title}</h2><div class="meta">${sub}</div></div>
      <div class="badge">${badge}</div>
    </div></div>`;
}

function renderTopic(topic){
  const p = topicProgress(topic);
  let html = `<div class="ticket">
    <div class="row1">
      <div><h2 class="disp">${topic.title}</h2><div class="meta">${topic.exercises.length} ข้อฝึกหัด &middot; ผสม MCQ / เติมคำ / แก้ที่ผิด / บทสนทนา</div></div>
      <div class="badge">${topic.code}</div>
    </div>
    <div class="stats">
      <div class="stat"><b class="disp">${p.answered}/${p.total}</b><span>ทำแล้ว</span></div>
      <div class="stat"><b class="disp">${p.correct}</b><span>ตอบถูก</span></div>
      <div class="stat"><b class="disp">${p.total? Math.round(p.correct/p.total*100):0}%</b><span>ความแม่นยำ</span></div>
    </div>
  </div>`;

  if(topic.explanation){
    html += `<button class="explain-toggle" id="explain-toggle-btn">📖 แสดง/ซ่อน สรุปไวยากรณ์</button>
      <div class="explain-wrap" id="explain-wrap"><div class="explain-box">${topic.explanation}</div></div>`;
  }

  html += `<div style="margin-bottom:14px;"><button class="btn" data-reset="${topic.code}">↺ รีเซ็ตหัวข้อนี้</button></div>`;

  topic.exercises.forEach(q=>{ html += renderQuestion(topic.code, q); });
  html += `<footer class="foot">B2 Exam Prep — Unit 1 &amp; Unit 3 · ${topic.title}</footer>`;
  return html;
}

function renderListening(){
  const topic = DATA.listening;
  const p = topicProgress(topic);
  let html = `<div class="ticket">
    <div class="row1">
      <div><h2 class="disp">Listening Practice</h2><div class="meta">จำลองจากเนื้อหา Unit 1 &amp; Unit 3 (ใช้ transcript แทนไฟล์เสียง)</div></div>
      <div class="badge">L</div>
    </div>
    <div class="stats">
      <div class="stat"><b class="disp">${p.answered}/${p.total}</b><span>ทำแล้ว</span></div>
      <div class="stat"><b class="disp">${p.correct}</b><span>ตอบถูก</span></div>
      <div class="stat"><b class="disp">${p.total? Math.round(p.correct/p.total*100):0}%</b><span>ความแม่นยำ</span></div>
    </div>
  </div>`;
  html += topic.note;
  topic.passages.forEach(pas=>{ html += pas; });
  html += `<div style="margin-bottom:14px;"><button class="btn" data-reset="L">↺ รีเซ็ตหัวข้อนี้</button></div>`;
  topic.exercises.forEach(q=>{ html += renderQuestion('L', q); });
  html += `<footer class="foot">B2 Exam Prep — Unit 1 &amp; Unit 3 · Listening</footer>`;
  return html;
}

function renderQuestion(code, q){
  const id = code+'-'+q.n;
  const state = answers[id];
  let cls = state ? state : '';
  let body = '';
  if(q.type==='mcq'){
    const letters=['a','b','c','d'];
    body = `<div class="qopts">` + q.options.map((o,i)=>{
      let extra='';
      if(state){
        if(o===q.answer) extra = state==='correct' ? ' selected-correct' : ' reveal-correct';
        else if(state==='incorrect') { /* mark chosen wrong one if we track it separately - simplified: nothing extra */ }
      }
      return `<button class="opt-btn${extra}" data-qid="${id}" data-val="${escapeAttr(o)}" data-qtype="mcq" ${state?'disabled':''}>${letters[i]}) ${o}</button>`;
    }).join('') + `</div>`;
  } else if(q.type==='tf'){
    const answerBool = q.answer.trim().toLowerCase().startsWith('true');
    body = `<div class="qopts">
      <button class="opt-btn${state? (answerBool? (state==='correct'?' selected-correct':' reveal-correct'):'' ) : ''}" data-qid="${id}" data-val="true" data-qtype="tf" ${state?'disabled':''}>True</button>
      <button class="opt-btn${state? (!answerBool? (state==='correct'?' selected-correct':' reveal-correct'):'' ) : ''}" data-qid="${id}" data-val="false" data-qtype="tf" ${state?'disabled':''}>False</button>
      </div>
      <div class="answer-reveal${state?' open':''}">${q.answer}</div>`;
  } else {
    // fill / error / dialog -> self-graded
    body = `<div class="text-row">
        <input type="text" placeholder="พิมพ์คำตอบของคุณที่นี่..." data-qid="${id}" ${state?'disabled':''}>
        <button class="btn" data-reveal="${id}" ${state?'disabled':''}>เฉลย</button>
      </div>
      <div class="answer-reveal${state?' open':''}" id="reveal-${id}"><b>เฉลย:</b> ${q.answer}</div>
      <div class="self-grade" id="grade-${id}">
        <span style="font-size:12px;color:#8b8367;align-self:center;">ตอบถูกไหม?</span>
        <button class="btn good" data-self="${id}" data-self-val="correct" ${state?'disabled':''}>✓ ถูก</button>
        <button class="btn bad" data-self="${id}" data-self-val="incorrect" ${state?'disabled':''}>✗ ผิด</button>
      </div>`;
  }
  return `<div class="qcard ${cls}" id="card-${id}">
    <div class="qhead"><span class="qnum">${q.n}.</span><span class="qtype">${TYPE_LABEL[q.type]}</span></div>
    <div class="qprompt">${q.prompt}</div>
    ${body}
  </div>`;
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function attachQuestionHandlers(topic){
  // MCQ / TF buttons
  document.querySelectorAll('.opt-btn[data-qtype]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.qid;
      const qtype = btn.dataset.qtype;
      const q = findQuestion(id);
      let isCorrect;
      if(qtype==='mcq'){
        isCorrect = btn.dataset.val === q.answer;
      } else { // tf
        const answerBool = q.answer.trim().toLowerCase().startsWith('true');
        isCorrect = (btn.dataset.val==='true') === answerBool;
      }
      answers[id] = isCorrect ? 'correct' : 'incorrect';
      refreshCurrent();
    });
  });
  // reveal buttons
  document.querySelectorAll('[data-reveal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.reveal;
      document.getElementById('reveal-'+id).classList.add('open');
      document.getElementById('grade-'+id).classList.add('open');
    });
  });
  // self grade
  document.querySelectorAll('[data-self]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.self;
      answers[id] = btn.dataset.selfVal;
      refreshCurrent();
    });
  });
  // reset
  document.querySelectorAll('[data-reset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const code = btn.dataset.reset;
      Object.keys(answers).forEach(k=>{ if(k.startsWith(code+'-')) delete answers[k]; });
      refreshCurrent();
    });
  });
}

let currentTarget = 'overview';
function findQuestion(id){
  const [code, nStr] = id.split('-');
  const n = parseInt(nStr,10);
  const topic = topicById(code);
  return topic.exercises.find(q=>q.n===n);
}
function refreshCurrent(){
  buildNav();
  render(currentTarget);
}

function renderOverview(){
  const groups = [
    {label:'Grammar', topics: DATA.grammar},
    {label:'Vocabulary', topics: DATA.vocabulary},
    {label:'Listening', topics: [DATA.listening]},
  ];
  let totalQ=0, totalAns=0, totalCorrect=0;
  let rows = '';
  groups.forEach(g=>{
    rows += `<h3 style="margin-top:18px;color:var(--teal);">${g.label}</h3>`;
    g.topics.forEach(t=>{
      const p = topicProgress(t);
      totalQ += p.total; totalAns += p.answered; totalCorrect += p.correct;
      const pct = p.total? Math.round(p.answered/p.total*100):0;
      rows += `<div class="ov-row" data-target="${t.code}">
          <div class="ov-title">${t.title}<div class="ov-sub">${p.correct}/${p.answered} ถูก จากที่ทำแล้ว</div></div>
          <div class="ov-bar"><div class="ov-bar-fill" style="width:${pct}%"></div></div>
          <div class="ov-pct">${p.answered}/${p.total}</div>
        </div>`;
    });
  });
  const overallPct = totalQ? Math.round(totalAns/totalQ*100):0;
  const overallAcc = totalAns? Math.round(totalCorrect/totalAns*100):0;
  return `<div class="ticket">
      <div class="row1">
