<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 Exam Prep — Unit 1 &amp; Unit 3 Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e6;
  --paper-2:#efe7d6;
  --ink:#1f2d2a;
  --teal:#1f4d47;
  --teal-2:#2c6a61;
  --coral:#c1442d;
  --mustard:#e2a63b;
  --mustard-2:#c98a1f;
  --good:#2f7a4f;
  --bad:#c1442d;
  --line:#d9cfb8;
  --card:#fffdf7;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter','Noto Sans Thai',sans-serif;
  font-size:15px;
  line-height:1.6;
}
h1,h2,h3,.disp{ font-family:'Space Grotesk','Noto Sans Thai',sans-serif; letter-spacing:.2px; }

/* ---------- Layout ---------- */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:270px; flex:none; background:var(--teal); color:#fdfaf0;
  padding:20px 14px 20px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.brand .dot{ width:10px;height:10px;border-radius:50%; background:var(--mustard); }
.brand h1{ font-size:15px; margin:0; color:#fdfaf0; }
.brand-sub{ font-size:10.5px; color:#bcd7ce; margin:0 0 18px 18px; }

.navgroup-label{ font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:#9fc4bb; margin:16px 6px 6px; }
.navitem{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px;
  font-size:12.8px; color:#eaf3ef; transition:background .15s;
}
.navitem:hover{ background:rgba(255,255,255,.08); }
.navitem.active{ background:#fdfaf0; color:var(--teal); font-weight:600; }
.navitem .stamp{
  width:20px;height:20px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:9.5px; border:1.5px solid rgba(255,255,255,.4); color:#cfe6df;
}
.navitem.active .stamp{ border-color:var(--teal); color:var(--teal); }
.navitem.done .stamp{ background:var(--mustard); border-color:var(--mustard); color:#1f2d2a; font-weight:700; }
.navitem.active.done .stamp{ background:var(--mustard); border-color:var(--mustard); color:#1f2d2a; }
.navitem.info-item{ font-style:normal; }

.main{ flex:1; padding:28px 34px 80px; max-width:920px; }

/* ---------- Ticket header ---------- */
.ticket{
  background:var(--card); border:1.5px solid var(--ink); border-radius:14px;
  padding:20px 26px; margin-bottom:26px; position:relative; overflow:hidden;
  box-shadow:5px 5px 0 var(--coral);
}
.ticket:before{
  content:""; position:absolute; left:0; right:0; top:64px; height:0;
  border-top:2px dashed var(--line);
}
.ticket.no-stats:before{ display:none; }
.ticket .row1{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
.ticket h2.disp{ font-size:21px; margin:0; color:var(--teal); }
.ticket .badge{
  background:var(--coral); color:#fff; font-size:10.5px; font-weight:700; padding:4px 10px;
  border-radius:20px; white-space:nowrap;
}
.ticket .meta{ font-size:11.5px; color:#6b6252; margin-top:4px; }
.ticket .stats{ display:flex; gap:22px; margin-top:20px; flex-wrap:wrap; }
.ticket .stat b.disp{ display:block; font-size:20px; color:var(--teal); }
.ticket .stat span{ font-size:10.5px; color:#7a7261; text-transform:uppercase; letter-spacing:.6px; }

/* ---------- Explanation (ELI5) ---------- */
.explain-toggle, .tips-toggle{
  display:inline-flex; align-items:center; gap:6px; color:#fff;
  border:none; padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600;
  cursor:pointer; margin-bottom:10px; margin-right:8px;
}
.explain-toggle{ background:var(--teal); }
.explain-toggle:hover{ background:var(--teal-2); }
.tips-toggle{ background:var(--mustard-2); }
.tips-toggle:hover{ background:#a8790f; }
.explain-wrap, .tips-wrap{ display:none; margin-bottom:18px; }
.explain-wrap.open, .tips-wrap.open{ display:block; }
.explain-wrap.always-open{ display:block; }

.eli5-block{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 18px; margin-bottom:12px; font-size:13.6px;
}
.eli5-block h3{ font-size:14px; color:var(--teal); margin:0 0 8px; }
.eli5-block p{ margin:6px 0; }
.ex-eli5{
  background:#fff; border-left:3px solid var(--teal-2); padding:8px 12px; border-radius:4px;
  font-size:13.2px; margin:8px 0;
}
.tip-callout{
  background:#fdf2df; border:1px dashed var(--mustard-2); border-radius:8px;
  padding:9px 13px; margin:9px 0; font-size:12.8px;
}
.thai-note{ color:#8b8367; font-size:11.5px; }
.explain-box{
  background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 20px; font-size:13.6px;
}
.eli5 table.rule-table, .explain-box table{ width:100%; border-collapse:collapse; margin:8px 0; font-size:12.6px; }
.eli5 table.rule-table th, .eli5 table.rule-table td,
.explain-box th,.explain-box td{ border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
.eli5 table.rule-table th, .explain-box th{ background:#e2d9c2; }

.tips-box{
  background:#fdf6e6; border:1.5px solid var(--mustard-2); border-radius:var(--radius);
  padding:14px 20px;
}
.tips-box h3{ margin-top:0; color:var(--mustard-2); font-size:14px; }
ul.tips-list{ margin:6px 0 0; padding-left:20px; font-size:13.2px; }
ul.tips-list li{ margin-bottom:8px; }

.passage{ background:#fffef9; border:1px dashed #b9ab88; padding:12px 16px; border-radius:8px; margin:0 0 14px; font-size:13.6px; }
.passage .ptitle{ font-weight:700; color:var(--coral); margin-bottom:6px; }
.note{ font-size:12px; color:#6b6252; background:var(--paper-2); padding:9px 13px; border-radius:6px; margin-bottom:14px; }

/* ---------- Questions ---------- */
.qcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:14px; transition:border-color .15s, box-shadow .15s;
}
.qcard.correct{ border-color:var(--good); box-shadow:0 0 0 1.5px var(--good) inset; }
.qcard.incorrect{ border-color:var(--bad); box-shadow:0 0 0 1.5px var(--bad) inset; }
.qhead{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.qnum{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--coral); font-size:15px; }
.qtype{ font-size:10px; color:#8b8367; background:var(--paper-2); padding:2px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.4px; }
.qprompt{ font-size:14.5px; margin-bottom:10px; }
.qopts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt-btn{
  border:1.5px solid var(--line); background:#fff; padding:8px 14px; border-radius:8px;
  cursor:pointer; font-size:13.5px; font-family:inherit; transition:all .12s;
}
.opt-btn:hover{ border-color:var(--teal-2); }
.opt-btn.selected-correct{ background:var(--good); border-color:var(--good); color:#fff; }
.opt-btn.selected-incorrect{ background:var(--bad); border-color:var(--bad); color:#fff; }
.opt-btn.reveal-correct{ border-color:var(--good); color:var(--good); font-weight:700; }
.opt-btn[disabled]{ cursor:default; opacity:.85; }

.text-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.text-row input[type=text]{
  flex:1; min-width:180px; padding:9px 12px; border:1.5px solid var(--line); border-radius:8px;
  font-family:inherit; font-size:13.5px; background:#fff;
}
.text-row input[type=text]:focus{ outline:none; border-color:var(--teal-2); }
.btn{
  border:1.5px solid var(--teal); background:#fff; color:var(--teal); padding:8px 14px;
  border-radius:8px; cursor:pointer; font-size:12.6px; font-weight:600; font-family:inherit;
}
.btn:hover{ background:var(--teal); color:#fff; }
.btn.solid{ background:var(--teal); color:#fff; }
.btn.solid:hover{ background:var(--teal-2); }
.answer-reveal{
  margin-top:9px; padding:9px 12px; background:#eef6f0; border-left:3px solid var(--good);
  border-radius:6px; font-size:13px; display:none;
}
.answer-reveal.open{ display:block; }
.self-grade{ margin-top:9px; display:none; gap:8px; }
.self-grade.open{ display:flex; }
.self-grade button.good{ border-color:var(--good); color:var(--good); }
.self-grade button.good:hover{ background:var(--good); color:#fff; }
.self-grade button.bad{ border-color:var(--bad); color:var(--bad); }
.self-grade button.bad:hover{ background:var(--bad); color:#fff; }

/* ---------- Overview ---------- */
.ov-row{
  display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:12px 16px; margin-bottom:10px; cursor:pointer;
}
.ov-row:hover{ border-color:var(--teal-2); }
.ov-row .ov-title{ flex:1; font-size:13.6px; font-weight:600; }
.ov-row .ov-sub{ font-size:11px; color:#8b8367; font-weight:400; }
.ov-bar{ width:130px; height:8px; background:var(--paper-2); border-radius:6px; overflow:hidden; flex:none; }
.ov-bar-fill{ height:100%; background:var(--mustard); }
.ov-pct{ width:70px; text-align:right; font-size:12px; font-weight:700; color:var(--teal); flex:none; }

/* ---------- Analysis dashboard ---------- */
.analysis-box{
  background:#fff; border:1.5px solid var(--ink); border-radius:14px; padding:18px 22px;
  margin-bottom:22px; box-shadow:5px 5px 0 var(--mustard);
}
.analysis-box h3{ margin:0 0 4px; color:var(--teal); font-size:15px; }
.analysis-sub{ font-size:11.5px; color:#8b8367; margin:10px 0 8px; text-transform:uppercase; letter-spacing:.5px; }
.type-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }
.type-bar-label{ width:100px; flex:none; font-size:12.5px; font-weight:600; }
.type-bar{ flex:1; height:9px; background:var(--paper-2); border-radius:6px; overflow:hidden; }
.type-bar-fill{ height:100%; background:var(--teal-2); }
.type-bar-pct{ width:110px; flex:none; text-align:right; font-size:11.5px; color:#6b6252; }
ul.weak-list{ margin:4px 0 0; padding-left:18px; font-size:13px; }
ul.weak-list li{ margin-bottom:8px; }
ul.weak-list button{ margin-left:8px; }
.analysis-empty{ font-size:13px; color:#8b8367; }

footer.foot{ margin-top:30px; font-size:11px; color:#9c937c; text-align:center; }

@media (max-width:760px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; height:auto; position:relative; }
  .main{ padding:20px; }
}
</style>
</head>
