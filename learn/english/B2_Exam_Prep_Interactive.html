": "mcq", "prompt": "[Transcript 1] What is Albany's attitude toward being cool?", "options": ["She never thinks about being cool and doesn't try.", "She tries very hard to be cool all the time.", "She thinks being cool is impossible."], "answer": "She never thinks about being cool and doesn't try."}, {"n": 2, "type": "tf", "prompt": "[Transcript 1] Albany believes most people don't care about being cool.", "answer": "False (she says most people care too much about it)"}, {"n": 3, "type": "mcq", "prompt": "[Transcript 1] Which phrase shows Albany expressing a fairly confident opinion?", "options": ["\"I tend to think...\"", "\"It might be...\"", "\"I'm not sure, but...\""], "answer": "\"I tend to think...\""}, {"n": 4, "type": "mcq", "prompt": "[Transcript 1] According to Albany, what happens when you try too hard to be cool?", "options": ["It stops being real.", "People like you more.", "Nothing changes."], "answer": "It stops being real."}, {"n": 5, "type": "tf", "prompt": "[Transcript 1] Albany describes her advice about being cool as \"probably the most important thing\" she's learned.", "answer": "True"}, {"n": 6, "type": "mcq", "prompt": "[Transcript 2] Why was Dana's tip a problem?", "options": ["It was less than what New York waiters expect.", "She forgot to leave a tip.", "She paid in the wrong currency."], "answer": "It was less than what New York waiters expect."}, {"n": 7, "type": "tf", "prompt": "[Transcript 2] Dana already knew that jaywalking was illegal in New York.", "answer": "False (she had no idea it was illegal)"}, {"n": 8, "type": "mcq", "prompt": "[Transcript 2] What tense is used in \"We'd been looking forward to it for months\"?", "options": ["Past perfect continuous", "Past continuous", "Present perfect"], "answer": "Past perfect continuous"}, {"n": 9, "type": "mcq", "prompt": "[Transcript 2] How does the story end?", "options": ["They eventually learned the local rules and enjoyed the rest of the trip.", "They left the city early.", "They never figured out the rules."], "answer": "They eventually learned the local rules and enjoyed the rest of the trip."}, {"n": 10, "type": "tf", "prompt": "[Transcript 2] Dana received a fine for not leaving enough of a tip.", "answer": "False (the fine was for jaywalking, not the tip)"}], "tips": "\n<ul class=\"tips-list\">\n<li>อ่าน/ฟังคำถามก่อนเริ่มอ่าน/ฟัง transcript ถ้าทำได้ — จะได้รู้ว่าต้อง \"จับ\" ประเด็นอะไรล่วงหน้า</li>\n<li>โจทย์ \"identifying attitude\" ให้สังเกตคำแสดงความมั่นใจ เช่น definitely, I tend to think, it might be, I'm not sure —\n    คำเหล่านี้บอกระดับความมั่นใจของผู้พูด ไม่ใช่แค่เนื้อหา</li>\n<li>โจทย์ True/False มักมี 1 คำในประโยคที่ถูกเปลี่ยนจากต้นฉบับ (เช่น เปลี่ยนตัวเลข, สลับคนพูด, ใส่คำปฏิเสธเพิ่ม) —\n    อ่านให้ละเอียดทีละคำ</li>\n<li>ถ้าพลาดบางช่วง อย่าเสียเวลาคิดย้อน ให้ตามฟัง/อ่านต่อไปก่อน แล้วค่อยกลับมาตอบทีหลัง</li>\n</ul>\n", "explanation": ""}}</script>
<script>
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const TYPE_LABEL = {mcq:"เลือกคำตอบ", fill:"เติมคำ", error:"แก้ที่ผิด", dialog:"บทสนทนา", tf:"True/False"};

// answers[qid] = 'correct' | 'incorrect'
const answers = {};

function quizTopics(){
  return [...DATA.grammar.map(t=>({...t, group:'grammar'})),
          ...DATA.vocabulary.map(t=>({...t, group:'vocabulary'})),
          {...DATA.listening, group:'listening'}];
}
function allTopics(){
  return [...DATA.info.map(t=>({...t, group:'info'})), ...quizTopics()];
}

function topicById(code){ return allTopics().find(t=>t.code===code); }

function topicProgress(topic){
  let answered=0, correct=0;
  (topic.exercises||[]).forEach(q=>{
    const id = topic.code+'-'+q.n;
    if(answers[id]){ answered++; if(answers[id]==='correct') correct++; }
  });
  return {answered, correct, total: (topic.exercises||[]).length};
}

function buildNav(){
  const info = document.getElementById('nav-info');
  const g = document.getElementById('nav-grammar');
  const v = document.getElementById('nav-vocab');
  info.innerHTML=''; g.innerHTML=''; v.innerHTML='';
  DATA.info.forEach(t=>{
    info.innerHTML += `<div class="navitem info-item" data-target="${t.code}"><span>${t.code==='F0'?'🧩':'🎯'} ${t.title}</span></div>`;
  });
  DATA.grammar.forEach((t,i)=>{
    g.innerHTML += navItemHtml(t, 'G'+(i+1)+': '+t.title.split(': ')[1]);
  });
  DATA.vocabulary.forEach((t,i)=>{
    v.innerHTML += navItemHtml(t, 'V'+(i+1)+': '+t.title.split(': ')[1]);
  });
}
function navItemHtml(t, label){
  const p = topicProgress(t);
  const done = p.total>0 && p.answered===p.total;
  return `<div class="navitem${done?' done':''}" data-target="${t.code}">
    <span>${label}</span><span class="stamp">${done?'✓':p.answered+'/'+p.total}</span></div>`;
}

function setActive(target){
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.target===target);
  });
}

function render(target){
  currentTarget = target;
  setActive(target);
  const main = document.getElementById('main');
  if(target==='overview'){ main.innerHTML = renderOverview(); attachOverviewHandlers(); window.scrollTo(0,0); return; }
  if(target==='listening'){ main.innerHTML = renderListening(); attachQuestionHandlers(); bindToggles(); window.scrollTo(0,0); return; }
  const topic = topicById(target);
  main.innerHTML = renderTopic(topic);
  attachQuestionHandlers();
  bindToggles();
  window.scrollTo(0,0);
}

function bindToggles(){
  const etog = document.getElementById('explain-toggle-btn');
  if(etog){ etog.addEventListener('click', ()=>{
    document.getElementById('explain-wrap').classList.toggle('open');
  }); }
  const ttog = document.getElementById('tips-toggle-btn');
  if(ttog){ ttog.addEventListener('click', ()=>{
    document.getElementById('tips-wrap').classList.toggle('open');
  }); }
}

function renderExplainAndTips(topic, alwaysOpenExplain){
  let html = '';
  if(topic.explanation){
    html += `<button class="explain-toggle" id="explain-toggle-btn">📖 ${alwaysOpenExplain?'สรุปเนื้อหา':'แสดง/ซ่อน สรุปแบบเข้าใจง่าย (ELI5)'}</button>`;
  }
  if(topic.tips){
    html += `<button class="tips-toggle" id="tips-toggle-btn">🎯 เทคนิคการทำข้อสอบหัวข้อนี้</button>`;
  }
  if(topic.explanation){
    html += `<div class="explain-wrap${alwaysOpenExplain?' always-open':''}" id="explain-wrap">${topic.explanation}</div>`;
  }
  if(topic.tips){
    html += `<div class="tips-wrap" id="tips-wrap"><div class="tips-box"><h3>เทคนิคการทำข้อสอบ</h3>${topic.tips}</div></div>`;
  }
  return html;
}

function renderTopic(topic){
  const hasExercises = (topic.exercises||[]).length > 0;
  const p = topicProgress(topic);
  let html = `<div class="ticket${hasExercises?'':' no-stats'}">
    <div class="row1">
      <div><h2 class="disp">${topic.title}</h2>
      <div class="meta">${hasExercises ? topic.exercises.length+' ข้อฝึกหัด &middot; ผสม MCQ / เติมคำ / แก้ที่ผิด / บทสนทนา' : 'หน้าเรียนรู้ (ไม่มีแบบฝึกหัด)'}</div></div>
      <div class="badge">${topic.code}</div>
    </div>`;
  if(hasExercises){
    html += `<div class="stats">
      <div class="stat"><b class="disp">${p.answered}/${p.total}</b><span>ทำแล้ว</span></div>
      <div class="stat"><b class="disp">${p.correct}</b><span>ตอบถูก</span></div>
      <div class="stat"><b class="disp">${p.total? Math.round(p.correct/p.total*100):0}%</b><span>ความแม่นยำ</span></div>
    </div>`;
  }
  html += `</div>`;

  html += renderExplainAndTips(topic, !hasExercises);

  if(hasExercises){
    html += `<div style="margin:14px 0;"><button class="btn" data-reset="${topic.code}">↺ รีเซ็ตหัวข้อนี้</button></div>`;
    topic.exercises.forEach(q=>{ html += renderQuestion(topic.code, q); });
  }
  html += `<footer class="foot">B2 Exam Prep — Unit 1 &amp; Unit 3 · ${topic.title}</footer>`;
  return html;
}

function renderListening(){
  const topic = DATA.listening;
  const p = topicProgress(topic);
  let html = `<div class="ticket">
    <div class="row1">
      <div><h2 class="disp">Listening Practice</h2><div class="meta">จำลองจากเนื้อหา Unit 1 &amp; Unit 3 (ใช้ transcript แทนไฟล์เสียง)</div></div>
      <div class="badge">L</div>
    </div>
    <div class="stats">
      <div class="stat"><b class="disp">${p.answered}/${p.total}</b><span>ทำแล้ว</span></div>
      <div class="stat"><b class="disp">${p.correct}</b><span>ตอบถูก</span></div>
      <div class="stat"><b class="disp">${p.total? Math.round(p.correct/p.total*100):0}%</b><span>ความแม่นยำ</span></div>
    </div>
  </div>`;
  html += renderExplainAndTips(topic, false);
  html += topic.note;
  topic.passages.forEach(pas=>{ html += pas; });
  html += `<div style="margin-bottom:14px;"><button class="btn" data-reset="L">↺ รีเซ็ตหัวข้อนี้</button></div>`;
  topic.exercises.forEach(q=>{ html += renderQuestion('L', q); });
  html += `<footer class="foot">B2 Exam Prep — Unit 1 &amp; Unit 3 · Listening</footer>`;
  return html;
}

function renderQuestion(code, q){
  const id = code+'-'+q.n;
  const state = answers[id];
  let cls = state ? state : '';
  let body = '';
  if(q.type==='mcq'){
    const letters=['a','b','c','d'];
    body = `<div class="qopts">` + q.options.map((o,i)=>{
      let extra='';
      if(state){
        if(o===q.answer) extra = state==='correct' ? ' selected-correct' : ' reveal-correct';
      }
      return `<button class="opt-btn${extra}" data-qid="${id}" data-val="${escapeAttr(o)}" data-qtype="mcq" ${state?'disabled':''}>${letters[i]}) ${o}</button>`;
    }).join('') + `</div>`;
  } else if(q.type==='tf'){
    const answerBool = q.answer.trim().toLowerCase().startsWith('true');
    body = `<div class="qopts">
      <button class="opt-btn${state? (answerBool? (state==='correct'?' selected-correct':' reveal-correct'):'' ) : ''}" data-qid="${id}" data-val="true" data-qtype="tf" ${state?'disabled':''}>True</button>
      <button class="opt-btn${state? (!answerBool? (state==='correct'?' selected-correct':' reveal-correct'):'' ) : ''}" data-qid="${id}" data-val="false" data-qtype="tf" ${state?'disabled':''}>False</button>
      </div>
      <div class="answer-reveal${state?' open':''}">${q.answer}</div>`;
  } else {
    // fill / error / dialog -> self-graded
    body = `<div class="text-row">
        <input type="text" placeholder="พิมพ์คำตอบของคุณที่นี่..." data-qid="${id}" ${state?'disabled':''}>
        <button class="btn" data-reveal="${id}" ${state?'disabled':''}>เฉลย</button>
      </div>
      <div class="answer-reveal${state?' open':''}" id="reveal-${id}"><b>เฉลย:</b> ${q.answer}</div>
      <div class="self-grade" id="grade-${id}">
        <span style="font-size:12px;color:#8b8367;align-self:center;">ตอบถูกไหม?</span>
        <button class="btn good" data-self="${id}" data-self-val="correct" ${state?'disabled':''}>✓ ถูก</button>
        <button class="btn bad" data-self="${id}" data-self-val="incorrect" ${state?'disabled':''}>✗ ผิด</button>
      </div>`;
  }
  return `<div class="qcard ${cls}" id="card-${id}">
    <div class="qhead"><span class="qnum">${q.n}.</span><span class="qtype">${TYPE_LABEL[q.type]}</span></div>
    <div class="qprompt">${q.prompt}</div>
    ${body}
  </div>`;
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

function attachQuestionHandlers(){
  document.querySelectorAll('.opt-btn[data-qtype]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.qid;
      const qtype = btn.dataset.qtype;
      const q = findQuestion(id);
      let isCorrect;
      if(qtype==='mcq'){
        isCorrect = btn.dataset.val === q.answer;
      } else {
        const answerBool = q.answer.trim().toLowerCase().startsWith('true');
        isCorrect = (btn.dataset.val==='true') === answerBool;
      }
      answers[id] = isCorrect ? 'correct' : 'incorrect';
      refreshCurrent();
    });
  });
  document.querySelectorAll('[data-reveal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.reveal;
      document.getElementById('reveal-'+id).classList.add('open');
      document.getElementById('grade-'+id).classList.add('open');
    });
  });
  document.querySelectorAll('[data-self]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.self;
      answers[id] = btn.dataset.selfVal;
      refreshCurrent();
    });
  });
  document.querySelectorAll('[data-reset]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const code = btn.dataset.reset;
      Object.keys(answers).forEach(k=>{ if(k.startsWith(code+'-')) delete answers[k]; });
      refreshCurrent();
    });
  });
}

let currentTarget = 'overview';
function findQuestion(id){
  const idx = id.lastIndexOf('-');
  const code = id.substring(0, idx);
  const n = parseInt(id.substring(idx+1), 10);
  const topic = topicById(code);
  return topic.exercises.find(q=>q.n===n);
}
function refreshCurrent(){
  buildNav();
  render(currentTarget);
}

/* ---------- Analysis ---------- */
function computeTypeStats(){
  const stats = {};
  quizTopics().forEach(t=>{
    (t.exercises||[]).forEach(q=>{
      const id = t.code+'-'+q.n;
      if(!stats[q.type]) stats[q.type] = {correct:0, answered:0, total:0};
      stats[q.type].total++;
      if(answers[id]){ stats[q.type].answered++; if(answers[id]==='correct') stats[q.type].correct++; }
    });
  });
  return stats;
}

function renderAnalysis(){
  const topics = quizTopics().map(t=>{
    const p = topicProgress(t);
    return {...t, ...p, acc: p.answered? p.correct/p.answered : null};
  });
  const totalAnsweredAll = topics.reduce((s,t)=>s+t.answered,0);

  if(totalAnsweredAll < 5){
    return `<div class="analysis-box">
      <h3>📊 การวิเคราะห์คำตอบของคุณ</h3>
      <p class="analysis-empty">ลองทำแบบฝึกหัดสัก 5-10 ข้อก่อน แล้วกลับมาดูสรุปว่าควรเน้นเรื่องไหนตรงนี้ได้เลย 🙂</p>
    </div>`;
  }

  const typeStats = computeTypeStats();
  const typeBars = Object.entries(typeStats).filter(([k,v])=>v.answered>0).map(([k,v])=>{
    const pct = Math.round(v.correct/v.answered*100);
    return `<div class="type-bar-row"><span class="type-bar-label">${TYPE_LABEL[k]}</span>
      <div class="type-bar"><div class="type-bar-fill" style="width:${pct}%"></div></div>
      <span class="type-bar-pct">${pct}% (${v.correct}/${v.answered})</span></div>`;
  }).join('');

  const withData = topics.filter(t=>t.answered>=3 && t.acc!==null).sort((a,b)=>a.acc-b.acc);
  const weak = withData.filter(t=>t.acc<0.7).slice(0,4);
  let weakHtml;
  if(weak.length===0 && withData.length>0){
    weakHtml = '<li>ยังไม่มีหัวข้อไหนที่น่าเป็นห่วงเป็นพิเศษ ทำได้ดีมาก! ลองไปหัวข้อที่ยังไม่ได้ทำต่อได้เลย 🎉</li>';
  } else if(withData.length===0){
    weakHtml = '<li>ทำแบบฝึกหัดในแต่ละหัวข้อให้ครบอย่างน้อย 3 ข้อ เพื่อให้ระบบวิเคราะห์ได้แม่นยำขึ้น</li>';
  } else {
    weakHtml = weak.map(t=>`<li><b>${t.title}</b> — ความแม่นยำ ${Math.round(t.acc*100)}% (${t.correct}/${t.answered} ข้อที่ทำ)
      <button class="btn" data-target-jump="${t.code}">ไปฝึกเพิ่ม →</button></li>`).join('');
  }

  let worstType = null;
  Object.entries(typeStats).forEach(([k,v])=>{
    if(v.answered>=3){
      const acc = v.correct/v.answered;
      if(!worstType || acc < worstType.acc){ worstType = {type:k, acc}; }
    }
  });
  const typeNote = worstType && worstType.acc < 0.7
    ? `<p class="analysis-empty" style="margin-top:10px;">🔎 สังเกตว่าคุณทำโจทย์ประเภท <b>${TYPE_LABEL[worstType.type]}</b>
       ผิดบ่อยกว่าประเภทอื่น (${Math.round(worstType.acc*100)}%) ลองกลับไปอ่านเทคนิคการทำข้อสอบสำหรับโจทย์ประเภทนี้ในหน้า
       "เทคนิคการทำข้อสอบ" อีกครั้ง</p>` : '';

  return `<div class="analysis-box">
    <h3>📊 การวิเคราะห์คำตอบของคุณ</h3>
    <p class="analysis-sub">ความแม่นยำแยกตามประเภทโจทย์</p>
    ${typeBars}
    <p class="analysis-sub">หัวข้อที่ควรเน้นเป็นพิเศษ (เรียงจากแม่นยำน้อยสุด)</p>
    <ul class="weak-list">${weakHtml}</ul>
    ${typeNote}
  </div>`;
}

function renderOverview(){
  const groups = [
    {label:'Grammar', topics: DATA.grammar},
    {label:'Vocabulary', topics: DATA.vocabulary},
    {label:'Listening', topics: [DATA.listening]},
  ];
  let totalQ=0, totalAns=0, totalCorrect=0;
  let rows = '';
  groups.forEach(g=>{
    rows += `<h3 style="margin-top:18px;color:var(--teal);">${g.label}</h3>`;
    g.topics.forEach(t=>{
      const p = topicProgress(t);
      totalQ += p.total; totalAns += p.answered; totalCorrect += p.correct;
      const pct = p.total? Math.round(p.answered/p.total*100):0;
      rows += `<div class="ov-row" data-target="${t.code}">
          <div class="ov-title">${t.title}<div class="ov-sub">${p.correct}/${p.answered} ถูก จากที่ทำแล้ว</div></div>
          <div class="ov-bar"><div class="ov-bar-fill" style="width:${pct}%"></div></div>
          <div class="ov-pct">${p.answered}/${p.total}</div>
        </div>`;
    });
  });
  const overallPct = totalQ? Math.round(totalAns/totalQ*100):0;
  const overallAcc = totalAns? Math.round(totalCorrect/totalAns*100):0;
  return `<div class="ticket">
      <div class="row1">
        <div><h2 class="disp">เอกสารเตรียมสอบ B2 — Interactive</h2>
          <div class="meta">Personal Best American B2 (Upper-Intermediate B) — Unit 1 &amp; Unit 3</div></div>
        <div class="badge">30 ข้อสอบจริง</div>
      </div>
      <div class="stats">
        <div class="stat"><b class="disp">${totalAns}/${totalQ}</b><span>ข้อที่ทำแล้ว</span></div>
        <div class="stat"><b class="disp">${overallAcc}%</b><span>ความแม่นยำรวม</span></div>
        <div class="stat"><b class="disp">${overallPct}%</b><span>ความคืบหน้ารวม</span></div>
      </div>
    </div>
    <div class="note">💡 ยังไม่แน่นเรื่องรูปกริยา V1/V2/V3 หรือ -ing? เริ่มที่หัวข้อ <b>"พื้นฐานที่ต้องรู้ก่อน"</b> ในเมนูด้านซ้ายก่อนได้เลย
    แต่ละหัวข้อมีปุ่ม "เทคนิคการทำข้อสอบ" ให้กดดูได้ด้วย
    <br>คำถามแบบเลือกตอบ/True-False จะตรวจให้อัตโนมัติ ส่วนแบบเติมคำ/แก้ที่ผิด/บทสนทนา ให้พิมพ์คำตอบ กด "เฉลย" แล้วประเมินตัวเอง
    <br><b>หมายเหตุ:</b> ความคืบหน้าจะรีเซ็ตเมื่อโหลดหน้าใหม่ (ไม่บันทึกลงเครื่อง)</div>
    ${renderAnalysis()}
    ${rows}
    <footer class="foot">B2 Exam Prep — Unit 1 &amp; Unit 3 · Interactive Learning</footer>`;
}
function attachOverviewHandlers(){
  document.querySelectorAll('.ov-row').forEach(el=>{
    el.addEventListener('click', ()=>{ render(el.dataset.target); });
  });
  document.querySelectorAll('[data-target-jump]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); render(el.dataset.targetJump); });
  });
}

document.addEventListener('click', (e)=>{
  const item = e.target.closest('.navitem');
  if(item){ render(item.dataset.target); }
});

buildNav();
render('overview');
</script>
</body>
