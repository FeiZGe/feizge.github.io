<script id="app-data" type="application/json">{"info": [{"code": "F0", "title": "พื้นฐานที่ต้องรู้ก่อน: V1, V2, V3 และ -ing คืออะไร", "explanation": "\n    <div class=\"eli5\">\n\n    <div class=\"eli5-block\">\n    <h3>🧩 ทำไมต้องรู้เรื่องนี้ก่อน?</h3>\n    <p>เวลาเจอโจทย์แล้วงงว่า \"ทำไมต้องเติม -ing\" หรือ \"ทำไมต้องเปลี่ยนรูปกริยา\" ปัญหาส่วนใหญ่ไม่ได้อยู่ที่ grammar\n    ยาก ๆ แต่อยู่ที่เรา<b>ไม่คุ้นกับรูปกริยาพื้นฐาน 5 แบบ</b> ที่ภาษาอังกฤษใช้สลับกันไปมา ถ้าจำ 5 แบบนี้ได้แม่น\n    ทุกเรื่องในเล่มนี้จะง่ายขึ้นทันที</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>1️⃣ กริยามี 5 รูปหลัก จำแบบนี้</h3>\n    <table class=\"rule-table\">\n    <tr><th>ชื่อเรียก</th><th>คืออะไร</th><th>ตัวอย่าง (look)</th><th>ตัวอย่าง (go) — ผิดปกติ</th></tr>\n    <tr><td><b>V1 (Base form)</b></td><td>รูปเดิม ไม่เติมอะไร — รูปที่เจอในดิกชันนารี</td><td>look</td><td>go</td></tr>\n    <tr><td><b>V1 + s/es</b></td><td>รูปเดิม + s หรือ es — ใช้ตอนประธานเป็น he/she/it</td><td>looks</td><td>goes</td></tr>\n    <tr><td><b>V-ing</b></td><td>รูปเดิม + ing — ใช้กับ \"กำลังทำ\"</td><td>looking</td><td>going</td></tr>\n    <tr><td><b>V2 (Past simple)</b></td><td>รูปอดีต — กริยาปกติ +ed, กริยาผิดปกติเปลี่ยนรูปเอง</td><td>looked</td><td>went</td></tr>\n    <tr><td><b>V3 (Past participle)</b></td><td>รูปที่ใช้คู่กับ have/has/had — กริยาปกติเหมือน V2 (+ed),\n        กริยาผิดปกติมักมีรูปของตัวเอง</td><td>looked</td><td>gone</td></tr>\n    </table>\n    <p class=\"tip-callout\">💡 <b>สังเกต:</b> กริยา<b>ปกติ (regular)</b> อย่าง <i>look</i> จะมี V2 กับ V3 เหมือนกัน (looked)\n    แต่กริยา<b>ผิดปกติ (irregular)</b> อย่าง <i>go</i> จะมี 3 รูปไม่เหมือนกันเลย (go → went → gone) กริยาผิดปกติพวกนี้\n    ต้อง<b>ท่องจำเป็นชุด</b> ไม่มีสูตรตายตัว — ถ้าไม่แน่ใจให้เปิดตาราง irregular verbs ท้ายเล่มเรียนของคุณ</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>2️⃣ ทำไม \"look\" กับ \"looks\" ถึงไม่เหมือนกัน?</h3>\n    <p>นี่คือกฎที่ง่ายที่สุดแต่คนมักงงที่สุด: <b>ไม่ได้เกี่ยวกับเวลา (tense) เลย</b> — มันเกี่ยวกับ \"ประธาน\" (subject)\n    ของประโยคต่างหาก!</p>\n    <table class=\"rule-table\">\n    <tr><th>ประธาน (Subject)</th><th>ใช้กริยารูปไหน</th><th>ตัวอย่าง</th></tr>\n    <tr><td>I / You / We / They<br><span class=\"thai-note\">(และคำนามพหูพจน์)</span></td>\n        <td><b>V1</b> (รูปเดิม ไม่เติมอะไร)</td><td>I <b>look</b> tired. / They <b>look</b> happy.</td></tr>\n    <tr><td>He / She / It<br><span class=\"thai-note\">(และคำนามเอกพจน์ 1 คน/สิ่ง)</span></td>\n        <td><b>V1 + s</b></td><td>He <b>looks</b> tired. / The soup <b>looks</b> delicious.</td></tr>\n    </table>\n    <p class=\"tip-callout\">🎯 <b>สรุปแบบง่ายที่สุด:</b> look และ looks เป็น <u>tense เดียวกัน</u> (Simple Present)\n    แค่ต้อง \"ปรับหาง\" ให้ตรงกับประธาน เหมือนภาษาไทยที่เราไม่ต้องผัน แต่ภาษาอังกฤษต้องผัน — กฎคือ\n    <b>He/She/It → เติม s เสมอ</b> (ในประโยคบอกเล่า Simple Present) ส่วนประธานอื่น ๆ ใช้รูปเดิม</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>3️⃣ -ing คืออะไร ใช้ตอนไหน?</h3>\n    <p>V-ing (เช่น looking, going, eating) แปลว่า <b>\"กำลังทำอยู่\"</b> แต่ตัวมันเองใช้โดด ๆ ไม่ได้\n    ต้องมีตัวช่วย <b>is / am / are</b> (สำหรับปัจจุบัน) นำหน้าเสมอ</p>\n    <p class=\"ex-eli5\">I <b>am looking</b> for my keys right now. (ไม่ใช่ I looking...)<br>\n    She <b>is eating</b> lunch. (ไม่ใช่ She eating...)</p>\n    <p>โครงสร้างคือ: <b>Subject + is/am/are + V-ing</b> เรียกว่า <i>Present Continuous</i>\n    (ใช้บอกว่ากำลังทำอะไรอยู่ตอนนี้ หรือเป็นเรื่องชั่วคราว)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>4️⃣ แล้วเมื่อไหร่ใช้ V1/V1+s เมื่อไหร่ใช้ V-ing?</h3>\n    <p>นี่คือหัวใจของหัวข้อ \"Present forms\" ในบทที่ 1A — อธิบายแบบง่ายที่สุด:</p>\n    <table class=\"rule-table\">\n    <tr><th></th><th>ใช้เมื่อไหร่</th><th>ตัวอย่าง</th></tr>\n    <tr><td><b>V1 / V1+s</b><br>(Simple Present)</td>\n        <td>สิ่งที่เป็นจริงเสมอ, กิจวัตร, หรือ<b>ความรู้สึก/ความคิด/การรับรู้</b>ที่ไม่ได้ \"ทำ\" เป็นการกระทำ</td>\n        <td>I <b>like</b> coffee. (ชอบ = ความรู้สึก ไม่ใช่การกระทำที่มองเห็น)</td></tr>\n    <tr><td><b>V-ing</b><br>(Present Continuous)</td>\n        <td>การกระทำที่กำลังเกิดขึ้นจริง ๆ ตอนนี้ มองเห็นได้ว่ากำลังทำ</td>\n        <td>I <b>am drinking</b> coffee right now. (กำลังยกแก้วดื่มอยู่จริง ๆ)</td></tr>\n    </table>\n    <p class=\"tip-callout\">🧠 <b>วิธีจำง่าย ๆ:</b> ถามตัวเองว่า \"นี่เป็นสิ่งที่ทำอยู่ให้เห็นเป็นแอ็คชั่นตอนนี้เลยไหม\n    หรือเป็นแค่ความรู้สึก/ความคิด/ข้อเท็จจริง\" — ถ้าเป็นแอ็คชั่นจริง ๆ ที่กำลังเกิด → เติม -ing\n    ถ้าเป็นความรู้สึก/ความคิด/ข้อเท็จจริง → ไม่เติม (แค่ผันตามประธาน V1 หรือ V1+s)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>5️⃣ กลุ่มคำที่ \"ห้ามเติม -ing\" (State verbs)</h3>\n    <p>มีกริยากลุ่มหนึ่งที่ตามกฎแล้ว<b>ไม่ค่อยเติม -ing</b> เพราะมันไม่ใช่ \"การกระทำ\" แต่เป็น \"สภาวะ/ความรู้สึก\"\n    ลองท่องกลุ่มนี้ไว้ — เจอคำพวกนี้เมื่อไหร่ ให้เอะใจว่าอาจจะต้องใช้ V1/V1+s ไม่ใช่ V-ing:</p>\n    <p class=\"ex-eli5\">\n    ความรู้สึก: like, love, hate, want, need, prefer<br>\n    ความคิดเห็น: think (ตอนแปลว่า \"คิดว่า/เห็นว่า\"), believe, know, understand, remember<br>\n    การรับรู้ทางประสาทสัมผัส: see, hear, smell, taste, feel, look, sound<br>\n    สภาวะ: be, have (ตอนแปลว่า \"มี/ครอบครอง\"), seem, belong, own\n    </p>\n    <p class=\"tip-callout\">⚠️ <b>ระวัง:</b> บางคำในกลุ่มนี้ (think, have, feel, taste, look) มีได้ 2 ความหมาย\n    ถ้าความหมายเป็น \"การกระทำที่ทำได้จริง\" (เช่น taste = ชิมอาหารด้วยปาก, have = กิน/ทาน) จะเติม -ing ได้\n    แต่ถ้าความหมายเป็น \"ความรู้สึก/สภาวะ\" (เช่น taste = มีรสชาติ, have = มี/ครอบครอง) จะไม่เติม -ing\n    → วิธีเช็ค: ลองแทนคำถามว่า \"นี่เป็นการกระทำที่มองเห็นได้ไหม\" ถ้าใช่ → เติม -ing ได้</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>✅ สรุปก่อนไปทำโจทย์จริง</h3>\n    <p class=\"ex-eli5\">\n    1. ดูประธานก่อนเสมอ (I/You/We/They vs He/She/It) เพื่อรู้ว่าจะผัน V1 หรือ V1+s<br>\n    2. ถามตัวเองว่า \"กำลังทำอยู่จริง ๆ ตอนนี้ไหม\" → ถ้าใช่และไม่ใช่ state verb → เติม -ing ได้ (พร้อม is/am/are)<br>\n    3. ถ้าเป็นความรู้สึก ความคิดเห็น หรือประสาทสัมผัส (state verb) → ไม่เติม -ing แม้จะพูดถึง \"ตอนนี้\"<br>\n    4. V2/V3 (รูปอดีต) จะอธิบายละเอียดในหัวข้อ \"Narrative tenses\" ถัดไป\n    </p>\n    </div>\n\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>ก่อนตอบโจทย์ทุกข้อที่เกี่ยวกับกริยา ให้ <b>วงประธาน (subject)</b> ของประโยคก่อนเสมอ — จะช่วยตัดตัวเลือกผิดได้ทันที</li>\n    <li>ถ้าเห็นคำว่า <b>right now, at the moment, Look!, Listen!</b> → มักเป็นสัญญาณของ Present Continuous (V-ing)</li>\n    <li>ถ้าเห็นคำว่า <b>every day, usually, always, often, never</b> → มักเป็นสัญญาณของ Simple Present (V1/V1+s)</li>\n    <li>เจอคำในกลุ่ม state verbs (like, want, think, believe, know, seem, own...) ให้ระวังเป็นพิเศษ — ส่วนใหญ่ไม่เติม -ing</li>\n    </ul>\n    ", "exercises": []}, {"code": "TIPS", "title": "เทคนิคการทำข้อสอบ (ทุกประเภทโจทย์)", "explanation": "\n    <div class=\"eli5\">\n\n    <div class=\"eli5-block\">\n    <h3>📝 โจทย์แบบเลือกตอบ (Multiple Choice)</h3>\n    <p class=\"ex-eli5\">\n    1. อ่านประโยคให้จบก่อน อย่าเพิ่งดูตัวเลือก — พยายามเดาคำตอบในใจก่อน แล้วค่อยไปหาในตัวเลือก<br>\n    2. หาคำ \"ตัวชี้เวลา\" ในประโยค (now, yesterday, by the time, always...) มันจะบอกใบ้ tense ที่ถูกต้อง<br>\n    3. ตัดตัวเลือกที่ผิดชัดเจนออกก่อน (elimination) แม้ไม่รู้คำตอบ 100% ก็เพิ่มโอกาสถูกได้<br>\n    4. ถ้าตัวเลือกมี 2 ตัวที่คล้ายกันมาก (เช่น look/looks) แปลว่าโจทย์กำลังเทสต์จุดนั้นเป๊ะ ๆ — กลับไปดูประธานของประโยค\n    </p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>✍️ โจทย์เติมคำ (Fill in the blank)</h3>\n    <p class=\"ex-eli5\">\n    1. หาประธานของประโยคก่อนเสมอ (เอกพจน์/พหูพจน์? บุรุษที่ 1/2/3?)<br>\n    2. ดูคำในวงเล็บ — เป็น verb ต้องผันรูปยังไง เป็น noun/adjective ต้องเปลี่ยนรูปคำไหม<br>\n    3. อ่านทั้งประโยค (ไม่ใช่แค่ก่อน-หลังช่องว่าง) เพื่อจับ context ทั้งหมด บางทีคำใบ้เวลาอยู่ท้ายประโยค<br>\n    4. เติมเสร็จแล้ว \"อ่านออกเสียงในใจ\" ทั้งประโยคอีกครั้ง ถ้าฟังดูแปลก ๆ มักจะผิด\n    </p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>🔍 โจทย์หาที่ผิด (Error Correction)</h3>\n    <p>โจทย์แบบนี้คนมักตกม้าตายเพราะรีบมองหา \"คำที่แปลกตา\" ทั้งที่จริง ๆ ต้องเช็คเป็นระบบ ลองไล่เช็คตามลำดับนี้:</p>\n    <p class=\"ex-eli5\">\n    ✅ Subject-Verb agreement: he/she/it ต้องมี s ไหม?<br>\n    ✅ Adjective vs Adverb: หลัง sense verb (look/sound/feel/smell/taste) ต้องเป็น adjective ไม่ใช่ adverb<br>\n    ✅ Tense ถูกต้องไหม: V1, V2, V3, V-ing ใช้ตรงกับบริบทเวลาหรือเปล่า<br>\n    ✅ Preposition/particle: phrasal verb ใช้คำต่อท้ายถูกไหม (เช่น look up ไม่ใช่ look at เมื่อหมายถึงค้นหาในดิก)<br>\n    ✅ ตำแหน่งคำ: สรรพนาม (it, him, them) ต้องอยู่ตรงไหนใน phrasal verb แบบ separable\n    </p>\n    <p class=\"tip-callout\">💡 ข้อสอบส่วนใหญ่ผิด \"จุดเดียว\" ในประโยค ไม่ใช่หลายจุด — เจอจุดแรกที่รู้สึกแปลกให้เช็คก่อน\n    แล้วค่อยไล่ดูจุดอื่นถ้ายังไม่เจอ</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>💬 โจทย์บทสนทนา (Conversation)</h3>\n    <p class=\"ex-eli5\">\n    1. อ่านทั้งบทสนทนาก่อนตอบ — คำตอบที่ถูกมักต้อง \"เข้ากับ\" สิ่งที่อีกฝ่ายพูดด้วย ไม่ใช่แค่ถูกไวยากรณ์<br>\n    2. สังเกต tense ของประโยคก่อนหน้า/หลัง — บทสนทนามักเล่าเรื่องต่อเนื่อง tense มักจะสอดคล้องกัน<br>\n    3. ฟัง (หรืออ่าน) น้ำเสียง/บริบท — เป็นการถาม แนะนำ ขอโทษ หรือบ่น จะมีโครงสร้างประโยคที่ต่างกัน\n    </p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>⏰ การบริหารเวลาสอบ</h3>\n    <p class=\"ex-eli5\">\n    • ข้อไหนไม่แน่ใจ ให้ข้ามไปก่อน อย่าติดอยู่ข้อเดียวนานเกิน 1 นาที<br>\n    • ทำ Grammar/Vocabulary ให้เสร็จก่อน (เป็นข้อที่ใช้เวลาแน่นอนได้) แล้วค่อยไปสู้กับ Listening<br>\n    • เหลือเวลา 5 นาทีสุดท้าย ให้กลับไปเช็คข้อที่ข้ามไว้ ดีกว่าเดามั่ว ๆ ตั้งแต่ต้น\n    </p>\n    </div>\n\n    </div>\n    ", "tips": "", "exercises": []}], "grammar": [{"code": "G1", "title": "1A: Present forms; like, as if, as though", "explanation": "\n    <div class=\"eli5\">\n\n    <div class=\"eli5-block\">\n    <h3>🤔 \"look\" กับ \"looks\" ต่างกันตรงไหน?</h3>\n    <p>คำถามนี้จริง ๆ ไม่เกี่ยวกับเรื่อง as if / as though เลย แต่เป็นกฎพื้นฐานที่สุด: <b>ผันตามประธาน</b></p>\n    <p class=\"ex-eli5\">I/You/We/They <b>look</b> tired. (ไม่เติม s)<br>\n    He/She/It <b>looks</b> tired. (เติม s)</p>\n    <p>ถ้ายังไม่แน่นเรื่องนี้ แนะนำให้ไปอ่านหน้า \"พื้นฐานที่ต้องรู้ก่อน\" ในเมนูด้านซ้ายก่อน จะช่วยให้เข้าใจหัวข้อนี้ง่ายขึ้นมาก\n    ในหัวข้อนี้เราจะโฟกัสที่ <b>เมื่อไหร่ใช้ V1/V1+s เมื่อไหร่ใช้ V-ing</b> และ <b>sense verbs</b> (look, sound, feel...)\n    ตามด้วยอะไรได้บ้าง</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>1️⃣ Simple Present (V1 / V1+s) ใช้ตอนไหน?</h3>\n    <p>ใช้กับสิ่งที่ <b>เป็นจริงเสมอ ไม่เปลี่ยนแปลงบ่อย</b> — แบ่งเป็น 2 กลุ่มใหญ่:</p>\n    <p class=\"ex-eli5\">\n    <b>(ก) กิจวัตร/ความจริงทั่วไป:</b> Every evening, I <b>listen</b> to music. (ทำเป็นประจำ)<br>\n    <b>(ข) State verbs — ความรู้สึก/ความคิด/สภาวะ/ประสาทสัมผัส:</b> I <b>like</b> chocolate. She <b>knows</b> the answer.\n    </p>\n    <p>State verbs คือกลุ่มคำที่<b>ไม่ใช่การกระทำที่มองเห็นเป็นแอ็คชั่น</b> เช่น like, love, want, need, think (คิดว่า),\n    believe, know, understand, be, have (มี/ครอบครอง), seem, taste, sound, look, feel, smell, own, belong —\n    ปกติแล้วคำกลุ่มนี้<b>ไม่เติม -ing</b> แม้จะพูดถึงตอนนี้ก็ตาม</p>\n    <p class=\"tip-callout\">🎯 ทำไมถึง \"ไม่เติม -ing\"? เพราะ -ing บอกว่า \"กำลังทำอยู่แบบเป็นแอ็คชั่น\" แต่ความรู้สึกอย่าง\n    \"ชอบ\" หรือ \"รู้\" มันไม่ใช่สิ่งที่คุณ \"กำลังลงมือทำ\" ในแบบเดียวกับการวิ่งหรือกิน — มันเป็น \"สภาวะ\" ที่คงอยู่ ไม่ใช่การกระทำ</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>2️⃣ Present Continuous (is/am/are + V-ing) ใช้ตอนไหน?</h3>\n    <p>ใช้กับ<b>การกระทำที่กำลังเกิดขึ้นจริง ๆ ตอนนี้</b> หรือเรื่องชั่วคราว (ไม่ใช่กิจวัตรถาวร)</p>\n    <p class=\"ex-eli5\">Look! The sun<b>'s setting</b> right now. (กำลังเกิดขึ้นตอนนี้เป๊ะ ๆ)<br>\n    You<b>'re working</b> such long hours this week. (ชั่วคราว แค่สัปดาห์นี้)</p>\n    <p>อีกจุดที่ควรรู้: ใช้ <b>always + V-ing</b> เพื่อบ่นเรื่องที่ทำบ่อยจนน่ารำคาญ</p>\n    <p class=\"ex-eli5\">My parents <b>are always criticizing</b> me! (บ่นว่าทำแบบนี้บ่อยเกินไป)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>3️⃣ กับดัก: คำที่เป็นได้ทั้ง 2 แบบ (think, have, feel)</h3>\n    <p>บางคำความหมายเปลี่ยน ก็เปลี่ยนกฎไปด้วย — ให้เช็คว่า <b>\"นี่คือการกระทำที่ทำอยู่จริง ๆ หรือเป็นแค่ความคิด/สภาวะ\"</b></p>\n    <table class=\"rule-table\">\n    <tr><th>คำ</th><th>ความหมายแบบ \"การกระทำ\" (เติม -ing ได้)</th><th>ความหมายแบบ \"สภาวะ\" (ห้ามเติม -ing)</th></tr>\n    <tr><td>think</td><td>I'<b>m thinking</b> about buying a car. (กำลังใคร่ครวญ/ชั่งใจ)</td>\n        <td>I <b>think</b> it's a good idea. (ความเห็น = คิดว่า)</td></tr>\n    <tr><td>have</td><td>We'<b>re having</b> dinner now. (กำลังกิน)</td>\n        <td>I <b>have</b> a car. (มี/ครอบครอง)</td></tr>\n    <tr><td>feel</td><td>I'<b>m feeling</b> the fabric. (กำลังสัมผัสด้วยมือ)</td>\n        <td>I <b>feel</b> tired. (สภาวะความรู้สึก)</td></tr>\n    </table>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>4️⃣ Sense verbs: look, sound, feel, smell, taste ตามด้วยอะไรได้บ้าง?</h3>\n    <p>นี่คือหัวใจของบทนี้ — กริยากลุ่มนี้ \"ตามด้วยอะไร\" จะเปลี่ยนไปตามสิ่งที่ตามมา ลองดูสูตร 3 แบบนี้:</p>\n    <table class=\"rule-table\">\n    <tr><th>ตามด้วย...</th><th>ใช้คำว่า</th><th>ตัวอย่าง</th></tr>\n    <tr><td><b>adjective</b> (คำเดียว บรรยายลักษณะ)</td><td>ไม่ต้องมีคำเชื่อม</td><td>You <b>look</b> tired.</td></tr>\n    <tr><td><b>noun</b> (คำนาม)</td><td><b>like</b></td><td>It <b>looks like</b> gold.</td></tr>\n    <tr><td><b>clause</b> (มีประธาน+กริยาของตัวเอง)</td><td><b>as if / as though</b></td>\n        <td>It <b>looks as if</b> you need help.</td></tr>\n    </table>\n    <p class=\"tip-callout\">🧠 <b>วิธีจำ:</b> ดูว่าหลังคำนั้นมี \"ประธาน+กริยา\" ครบเป็นประโยคย่อยไหม\n    ถ้ามี → ต้องใช้ as if/as though ถ้าเป็นแค่คำนามคำเดียว → ใช้ like ถ้าเป็นแค่คำคุณศัพท์ → ไม่ต้องมีคำเชื่อมเลย</p>\n    <p><b>⚠️ กับดักสำคัญ:</b> หลัง sense verb ต้องใช้ <b>adjective</b> ไม่ใช่ <b>adverb</b></p>\n    <p class=\"ex-eli5\">✅ That sounds wonderful. &nbsp;&nbsp; ❌ That sounds wonderfully.<br>\n    ✅ You look really good in green. &nbsp;&nbsp; ❌ You look really well in green.</p>\n    <p><b>as if vs as though vs like (ก่อน clause):</b> ความหมายเหมือนกันหมด แต่ระดับความเป็นทางการต่างกัน —\n    <b>as though</b> เป็นทางการที่สุด, <b>as if</b> กลาง ๆ ใช้ได้ทั้งพูดและเขียน, <b>like</b> ก่อน clause\n    ใช้ได้เฉพาะภาษาพูดที่ไม่เป็นทางการเท่านั้น (ในข้อสอบเขียนทางการ ไม่ควรใช้ like แบบนี้)</p>\n    </div>\n\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>เจอคำถามเรื่อง look/looks, think/thinks ฯลฯ ให้ <b>วงประธานก่อน</b> แล้วเช็คว่าเป็น he/she/it หรือไม่</li>\n    <li>เจอคำถามเรื่อง state verbs (like, want, know, think, believe, seem...) ให้เดาไว้ก่อนว่า <b>\"ไม่น่าจะเติม -ing\"</b>\n        เว้นแต่จะมีสัญญาณชัดว่าเป็นความหมายแบบ \"การกระทำ\" (เช่น have ที่แปลว่ากิน)</li>\n    <li>เจอ sense verb (look/sound/feel/smell/taste) แล้วมีตัวเลือกเป็น adjective กับ adverb คู่กัน\n        (เช่น good/well, bad/badly) → <b>เลือก adjective เสมอ</b></li>\n    <li>เจอ sense verb + ประโยคเต็ม (มีประธาน+กริยา) ตามหลัง → ใช้ as if/as though ไม่ใช่ like (ยกเว้นโจทย์ระบุว่าเป็นภาษาพูด)</li>\n    <li>คำว่า always ที่ตามด้วย verb ให้เช็คก่อนว่าอยู่ในรูป <b>is/am/are + always + V-ing</b> (บ่นเรื่องน่ารำคาญ)\n        หรือเป็น <b>simple present ธรรมดา</b> (กิจวัตรทั่วไป)</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "I ___ you're right, but I need to think about it more.", "options": ["am thinking", "think", "thinks"], "answer": "think"}, {"n": 2, "type": "mcq", "prompt": "Look! The kids ___ soccer in the yard right now.", "options": ["play", "are playing", "played"], "answer": "are playing"}, {"n": 3, "type": "mcq", "prompt": "This cake ___ amazing! What's in it?", "options": ["is smelling", "smells", "smelling"], "answer": "smells"}, {"n": 4, "type": "mcq", "prompt": "It ___ as if she has already left.", "options": ["looks", "is looking", "look"], "answer": "looks"}, {"n": 5, "type": "mcq", "prompt": "He ___ always checking his phone during class — it's so annoying!", "options": ["is", "has", "was"], "answer": "is"}, {"n": 6, "type": "mcq", "prompt": "That jacket ___ really good on you.", "options": ["look", "looks", "is looking"], "answer": "looks"}, {"n": 7, "type": "fill", "prompt": "My sister ______ (not/believe) in ghosts, but she loves horror movies.", "answer": "doesn't believe"}, {"n": 8, "type": "fill", "prompt": "Right now, the manager ______ (interview) candidates for the new position.", "answer": "is interviewing"}, {"n": 9, "type": "fill", "prompt": "This milk ______ (smell) strange. Did you check the expiration date?", "answer": "smells"}, {"n": 10, "type": "fill", "prompt": "It ______ (sound) as though the meeting has been cancelled.", "answer": "sounds"}, {"n": 11, "type": "error", "prompt": "You look really beautifully in that dress tonight.", "answer": "beautifully → beautiful (adjective ต้องตามหลัง sense verb ไม่ใช่ adverb)"}, {"n": 12, "type": "error", "prompt": "She's thinking that communication styles are fascinating.", "answer": "is thinking → thinks (think ในความหมาย \"เห็นว่า/คิดว่า\" เป็น state verb)"}, {"n": 13, "type": "error", "prompt": "This soup tastes badly. Did you forget the salt?", "answer": "badly → bad (adjective หลัง sense verb)"}, {"n": 14, "type": "dialog", "prompt": "A: Why is your brother so quiet today? ______ (something/bother) him?<br>B: I'm not sure. He's been acting strange since this morning.", "answer": "Is something bothering"}, {"n": 15, "type": "dialog", "prompt": "A: You ______ (seem) worried. Is everything okay?<br>B: I'm just thinking about my exam tomorrow.", "answer": "seem"}, {"n": 16, "type": "mcq", "prompt": "I ___ what you mean, but I don't fully agree.", "options": ["understand", "am understanding", "understood"], "answer": "understand"}, {"n": 17, "type": "mcq", "prompt": "She ___ always changing her mind — it's hard to keep up.", "options": ["is", "has", "does"], "answer": "is"}, {"n": 18, "type": "mcq", "prompt": "Do you ___ what I'm saying?", "options": ["understand", "are understanding", "understood"], "answer": "understand"}, {"n": 19, "type": "mcq", "prompt": "This perfume ___ like roses.", "options": ["smell", "smells", "is smelling"], "answer": "smells"}, {"n": 20, "type": "mcq", "prompt": "He ___ to be a great communicator these days.", "options": ["seems", "is seeming", "seem"], "answer": "seems"}, {"n": 21, "type": "mcq", "prompt": "We ___ dinner right now — can you call back later?", "options": ["have", "are having", "has"], "answer": "are having"}, {"n": 22, "type": "fill", "prompt": "I ______ (not/understand) why she's upset.", "answer": "don't understand"}, {"n": 23, "type": "fill", "prompt": "At the moment, they ______ (discuss) the merger.", "answer": "are discussing"}, {"n": 24, "type": "fill", "prompt": "This jacket ______ (feel) like real leather.", "answer": "feels"}, {"n": 25, "type": "fill", "prompt": "It ______ (seem) as though nobody read the email.", "answer": "seems"}, {"n": 26, "type": "error", "prompt": "He's having a lot of money, so he never worries.", "answer": "'s having → has (have แปลว่า \"มี/ครอบครอง\" เป็น state verb)"}, {"n": 27, "type": "error", "prompt": "This coffee tastes wonderfully with milk.", "answer": "wonderfully → wonderful"}, {"n": 28, "type": "error", "prompt": "I'm always think about moving abroad.", "answer": "always think → always thinking (\"always\" + present continuous ต้องมี -ing)"}, {"n": 29, "type": "dialog", "prompt": "A: You ______ (look) exhausted. Rough day?<br>B: You have no idea.", "answer": "look"}, {"n": 30, "type": "dialog", "prompt": "A: It ______ (sound) as though you've already decided.<br>B: Yeah, pretty much.", "answer": "sounds"}]}, {"code": "G2", "title": "1C: Narrative tenses", "explanation": "\n    <div class=\"eli5\">\n\n    <div class=\"eli5-block\">\n    <h3>🎬 ลองนึกภาพ: การเล่าเรื่องเหมือนหนัง มีหลายฉากซ้อนกัน</h3>\n    <p>เวลาเล่าเรื่องที่ผ่านมาแล้ว (narrative) มักมีมากกว่า 1 เหตุการณ์ และเหตุการณ์เหล่านั้น \"เกิดก่อน-หลังกัน\"\n    ไม่เท่ากัน ภาษาอังกฤษเลยมี tense หลายแบบ เพื่อบอกว่า \"อันไหนเกิดก่อน อันไหนเกิดกำลังเป็นฉากหลัง\"\n    หัวใจของเรื่องนี้คือ <b>V2</b> และ <b>V3</b> (ถ้ายังไม่แม่น 2 คำนี้ ไปอ่านหน้า \"พื้นฐานที่ต้องรู้ก่อน\" มาก่อนนะ)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>1️⃣ Simple Past (V2) — เหตุการณ์หลักของเรื่อง</h3>\n    <p>ใช้เล่า<b>เหตุการณ์หลัก</b>ที่จบไปแล้ว เรียงตามลำดับเวลาปกติ เหมือนเวลาเราเล่าเรื่องทั่วไป\n    \"แล้วก็ ... แล้วก็ ...\" — ใช้ V2 (past simple) ล้วน ๆ</p>\n    <p class=\"ex-eli5\">I <b>opened</b> the door and <b>found</b> a cat inside. (เปิด แล้วก็เจอ — เหตุการณ์หลักเรียงกัน)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>2️⃣ Past Continuous (was/were + V-ing) — ฉากหลังที่ \"กำลังเกิดอยู่\"</h3>\n    <p>ใช้บอกว่า <b>ตอนนั้นกำลังทำอะไรอยู่</b> เหมือนกล้องแพนไปที่ฉากหลัง แล้วจู่ ๆ มีเหตุการณ์ V2 (simple past)\n    แทรกเข้ามาขัดจังหวะ</p>\n    <p class=\"ex-eli5\">I <b>was drinking</b> coffee <u>when</u> Amy <b>came</b> in.<br>\n    (แปล: ฉัน<u>กำลัง</u>ดื่มกาแฟอยู่ [ฉากหลัง] จู่ ๆ Amy ก็<u>เดินเข้ามา</u> [เหตุการณ์แทรก, V2])</p>\n    <p class=\"tip-callout\">🧠 <b>จำง่าย ๆ:</b> Past Continuous = \"กำลัง...อยู่\" (เหมือน -ing ในภาษาไทย) ส่วน Simple Past\n    = เหตุการณ์ที่เกิดขึ้นแล้วจบเลย ไม่ได้ \"กำลัง\" ทำ</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>3️⃣ Past Perfect (had + V3) — เหตุการณ์ที่เกิด \"ก่อน\" อีกเหตุการณ์ในอดีต</h3>\n    <p>นี่คือจุดที่ V3 เข้ามา! ใช้ตอนที่มี 2 เหตุการณ์ในอดีต แต่อยากบอกว่า<b>อันไหนเกิดก่อนอันไหน</b> —\n    เหตุการณ์ที่ \"เกิดก่อนสุด\" ให้ใช้ <b>had + V3</b> ส่วนเหตุการณ์ที่ \"เกิดทีหลัง\" ใช้ V2 ธรรมดา</p>\n    <p class=\"ex-eli5\">By the time I <b>got</b> to school, everyone <b>had</b> already <b>finished</b> the exam.<br>\n    (ลำดับคือ: 1) ทุกคน<b>สอบเสร็จ</b>ก่อน [had finished = เกิดก่อน] → 2) ฉัน<b>มาถึง</b>ทีหลัง [got = เกิดทีหลัง])</p>\n    <p class=\"tip-callout\">🎯 <b>ทำไมต้อง V3?</b> เพราะโครงสร้าง \"had + V3\" คือรูปเดียวกับ Present Perfect (have/has + V3)\n    เพียงแต่ย้ายทุกอย่างถอยไปเป็นอดีตอีกขั้นหนึ่ง — คิดง่าย ๆ ว่า \"มันเสร็จไปแล้ว ตั้งแต่ก่อนอีกเหตุการณ์หนึ่งจะเกิดด้วยซ้ำ\"</p>\n    <p>คำสัญญาณที่มักเจอคู่กับ Past Perfect: <b>by the time, before, after, already, just, never...before</b></p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>4️⃣ Past Perfect Continuous (had been + V-ing) — เน้น \"ระยะเวลา\" ก่อนอีกเหตุการณ์</h3>\n    <p>คล้าย Past Perfect แต่เพิ่ม -ing เพื่อเน้นว่า <b>\"ทำต่อเนื่องมานานแค่ไหน\"</b> ก่อนอีกเหตุการณ์จะเกิด</p>\n    <p class=\"ex-eli5\">It <b>had been raining</b> for hours when we left.<br>\n    (ฝนตกต่อเนื่องมาหลายชั่วโมงแล้ว ก่อนที่เราจะออกจากบ้าน — เน้นว่า \"นานแค่ไหน\" ไม่ใช่แค่ \"เกิดก่อน\")</p>\n    <p class=\"tip-callout\">⚠️ <b>ข้อควรระวัง:</b> Past Continuous และ Past Perfect Continuous มักไม่ใช้กับ state verbs\n    (เหมือนที่เรียนในหัวข้อ 1A) → <i>I'd had my car for five years when I sold it.</i> ไม่ใช่\n    <s>I'd been having my car...</s> เพราะ \"have\" ที่แปลว่า \"มี/ครอบครอง\" เป็น state verb</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>5️⃣ สรุปด้วยไทม์ไลน์ง่าย ๆ</h3>\n    <p class=\"ex-eli5\">\n    เหตุการณ์ A (เกิดก่อนสุด, ใช้เวลานาน) → <b>had been + V-ing</b><br>\n    เหตุการณ์ A (เกิดก่อนสุด, จบแล้ว) → <b>had + V3</b><br>\n    เหตุการณ์ B (เกิดทีหลัง/เหตุการณ์หลักของเรื่อง) → <b>V2 (simple past)</b><br>\n    ฉากหลังที่กำลังเกิดตอน B เกิดขึ้น → <b>was/were + V-ing</b>\n    </p>\n    <p>💬 ในบทสนทนาที่ลำดับเหตุการณ์ชัดเจนอยู่แล้วจากบริบท บางครั้งคนพูดใช้ simple past แทน past perfect ก็ได้\n    เช่น <i>I wrote to Bill, and soon after, I got an answer.</i> (เข้าใจได้อยู่แล้วว่าเขียนก่อน ได้รับคำตอบทีหลัง)</p>\n    </div>\n\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>เจอ <b>by the time, before, after, already, just, never...before</b> → มักต้องใช้ <b>Past Perfect (had + V3)</b>\n        กับเหตุการณ์ที่เกิดก่อน</li>\n    <li>เจอ <b>while, as, when + กำลังเกิดอยู่</b> → มักเป็น <b>Past Continuous (was/were + V-ing)</b></li>\n    <li>ถ้าโจทย์เน้น \"นานแค่ไหน\" (for + ระยะเวลา) ของเหตุการณ์ที่เกิดก่อน → เลือก <b>Past Perfect Continuous</b></li>\n    <li>ระวัง state verbs (own, have=มี, know, want...) ไม่ควรอยู่ในรูป continuous — ถ้าเจอตัวเลือกเป็น\n        \"had been owning\" กับ \"had owned\" ให้เลือก <b>had owned</b></li>\n    <li>เทคนิคจับลำดับเวลา: ลองวาดเส้นเวลาในกระดาษทด ใส่จุด 2 จุด แล้วดูว่าอันไหนอยู่ซ้ายสุด (เกิดก่อน) → อันนั้นต้อง V3</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "Jim ___ for us when we arrived at the station.", "options": ["had waited", "was waiting", "waits"], "answer": "was waiting"}, {"n": 2, "type": "mcq", "prompt": "We ___ to see the new movie for weeks by the time we finally saw it.", "options": ["'d been dying", "died", "die"], "answer": "'d been dying"}, {"n": 3, "type": "mcq", "prompt": "Henry ___ a little depressed, so he decided to take a vacation.", "options": ["had been feeling", "was feeling"], "answer": "had been feeling"}, {"n": 4, "type": "mcq", "prompt": "While I ___ to some friends, someone tapped me on the shoulder.", "options": ["talked", "was talking", "had talked"], "answer": "was talking"}, {"n": 5, "type": "mcq", "prompt": "By the time Anna joined us for dinner, we ___ most of the food.", "options": ["ate", "were eating", "had eaten"], "answer": "had eaten"}, {"n": 6, "type": "mcq", "prompt": "When I met Mike in person, it felt as if I ___ him my whole life!", "options": ["knew", "had known", "was knowing"], "answer": "had known"}, {"n": 7, "type": "fill", "prompt": "I ______ (just/wake) up when I started to feel sick.", "answer": "had just woken"}, {"n": 8, "type": "fill", "prompt": "It ______ (rain) heavily for several hours before the game was cancelled.", "answer": "had been raining"}, {"n": 9, "type": "fill", "prompt": "While we ______ (wait) for the bus, I met someone amazing.", "answer": "were waiting"}, {"n": 10, "type": "fill", "prompt": "He ______ (try) to make eye contact and kept looking in my direction.", "answer": "was trying"}, {"n": 11, "type": "error", "prompt": "I was owning a great apartment in Italy, right by the sea.", "answer": "was owning → owned (own เป็น state verb ไม่ใช้ continuous)"}, {"n": 12, "type": "error", "prompt": "By the time we arrived, the movie already started.", "answer": "already started → had already started (เหตุการณ์ที่เกิดก่อนอีกเหตุการณ์ในอดีต ต้องใช้ past perfect)"}, {"n": 13, "type": "error", "prompt": "I've been to Jim's house a few times before yesterday.", "answer": "'ve been → 'd been (เล่าเหตุการณ์ในอดีตทั้งหมด ต้องใช้ past perfect ไม่ใช่ present perfect)"}, {"n": 14, "type": "dialog", "prompt": "A: You're not going to believe what ______ (happen) to me a few days ago!<br>B: What? ______ (you/win) the lottery?", "answer": "happened / Did you win"}, {"n": 15, "type": "dialog", "prompt": "A: Well, I ______ (stand) at the bus stop, and I ______ (think) about my day at work. Then when I turned around, I saw this guy.<br>B: And then what happened?", "answer": "was standing / was thinking"}, {"n": 16, "type": "mcq", "prompt": "When we got home, someone ___ into our apartment.", "options": ["broke", "was breaking", "had broken"], "answer": "had broken"}, {"n": 17, "type": "mcq", "prompt": "I ___ for the bus for twenty minutes before it finally arrived.", "options": ["waited", "had been waiting", "was waiting"], "answer": "had been waiting"}, {"n": 18, "type": "mcq", "prompt": "She ___ TV when the power went out.", "options": ["watched", "was watching", "had watched"], "answer": "was watching"}, {"n": 19, "type": "mcq", "prompt": "By the time the ambulance arrived, the man ___ conscious again.", "options": ["became", "had become", "was becoming"], "answer": "had become"}, {"n": 20, "type": "mcq", "prompt": "We ___ friends for ten years before we finally got married.", "options": ["were", "had been", "have been"], "answer": "had been"}, {"n": 21, "type": "mcq", "prompt": "I looked out the window and saw that it ___ all night.", "options": ["snowed", "was snowing", "had been snowing"], "answer": "had been snowing"}, {"n": 22, "type": "fill", "prompt": "She ______ (never/see) snow before she moved to Canada.", "answer": "had never seen"}, {"n": 23, "type": "fill", "prompt": "I ______ (walk) home when it started to rain.", "answer": "was walking"}, {"n": 24, "type": "fill", "prompt": "By the time I finished cooking, everyone ______ (already/leave).", "answer": "had already left"}, {"n": 25, "type": "fill", "prompt": "We ______ (drive) for six hours straight before we stopped for gas.", "answer": "had been driving"}, {"n": 26, "type": "error", "prompt": "I had been living in Paris for two years when I meet my husband.", "answer": "meet → met"}, {"n": 27, "type": "error", "prompt": "She was already gone by the time I have arrived.", "answer": "have arrived → arrived"}, {"n": 28, "type": "error", "prompt": "He was working there since 2010 before the company closed.", "answer": "was working → had been working (ระยะเวลาต่อเนื่องก่อนเหตุการณ์อื่นในอดีต)"}, {"n": 29, "type": "dialog", "prompt": "A: Why were you so tired yesterday?<br>B: I ______ (study) all night for the exam.", "answer": "had been studying"}, {"n": 30, "type": "dialog", "prompt": "A: Had you met him before the party?<br>B: No, that ______ (be) the first time we ______ (meet).", "answer": "was / had met"}]}, {"code": "G3", "title": "3A: Advice, expectation, and obligation", "explanation": "\n    <div class=\"eli5\">\n\n    <div class=\"eli5-block\">\n    <h3>🎚️ ลองนึกภาพ \"ไม้บรรทัดความหนักเบา\"</h3>\n    <p>คำกริยาช่วยกลุ่มนี้ (modals) ทุกตัวพูดเรื่อง \"ควรทำ/ต้องทำ/ห้ามทำ\" เหมือนกัน แต่ต่างกันที่ <b>\"ใครเป็นคนสั่ง\"</b>\n    และ <b>\"หนักแน่นแค่ไหน\"</b> ลองจัดเรียงเป็นไม้บรรทัดในหัว:</p>\n    <p class=\"ex-eli5\">\n    ห้ามเด็ดขาด (mustn't) → ต้องทำ (must / have to) → แนะนำหนักแน่น (had better) →\n    แนะนำทั่วไป (should / ought to) → คาดหวังตามกฎ (be supposed to) → ไม่จำเป็น (don't have to) →\n    อนุญาต (be allowed to)\n    </p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>1️⃣ must vs. have to — เหมือนกันแต่ \"ใครสั่ง\" ต่างกัน</h3>\n    <p><b>must</b> = ผู้พูดตัดสินใจเองว่าสำคัญ (มาจากใจ) &nbsp;|&nbsp; <b>have to</b> = มีกฎ/คนอื่นบังคับจากภายนอก</p>\n    <p class=\"ex-eli5\">I <b>must</b> call my mom tonight. (ฉันรู้สึกเองว่าต้องโทร ไม่มีใครบังคับ)<br>\n    You <b>have to</b> wear a badge in this building. (กฎของอาคารบังคับ ไม่ใช่ความรู้สึกส่วนตัว)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>2️⃣ ⚠️ จุดที่งงที่สุด: mustn't ≠ don't have to</h3>\n    <p>สองคำนี้หน้าตาคล้ายกัน (must/have to + not) แต่ความหมาย<b>ตรงข้ามกันเลย</b> — ข้อสอบชอบเอามาหลอก!</p>\n    <table class=\"rule-table\">\n    <tr><th></th><th>ความหมาย</th><th>ตัวอย่าง</th></tr>\n    <tr><td><b>mustn't</b></td><td>🚫 ห้ามทำเด็ดขาด (prohibition)</td><td>You <b>mustn't</b> smoke here. (ห้ามสูบบุหรี่)</td></tr>\n    <tr><td><b>don't have to</b></td><td>🙆 ไม่จำเป็นต้องทำ แต่ทำก็ได้ ไม่ทำก็ได้ (no obligation)</td>\n        <td>You <b>don't have to</b> tip. (จะให้ทิปหรือไม่ก็ได้)</td></tr>\n    </table>\n    <p class=\"tip-callout\">🧠 <b>วิธีจำ:</b> ให้แปลเป็นไทยตรง ๆ ในหัว — mustn't = \"ห้าม\" (ทำไม่ได้เลย)\n    ส่วน don't have to = \"ไม่ต้อง\" (จะทำหรือไม่ทำก็ได้ ไม่มีใครว่า) ถ้าแปลแล้วความหมายในประโยคดูขัดกับ \"ห้าม\" หรือ \"ไม่ต้อง\"\n    ที่ให้มา แสดงว่าเลือกผิดตัว</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>3️⃣ should / ought to / had better — แนะนำ แต่หนักเบาไม่เท่ากัน</h3>\n    <p class=\"ex-eli5\">\n    <b>should / ought to</b> = คำแนะนำทั่วไป เหมือนเพื่อนแนะนำ ไม่ทำก็ไม่เป็นไรมาก<br>\n    You <b>should</b> try the local food.<br><br>\n    <b>had better</b> = แนะนำหนักแน่นกว่า มักใช้กับสถานการณ์เฉพาะหน้า และ \"มีผลเสียชัดเจน\" ถ้าไม่ทำตาม<br>\n    You'<b>d better</b> hurry, or you'll miss the bus. (ถ้าไม่รีบ = จะพลาดรถบัสแน่ ๆ)\n    </p>\n    <p class=\"tip-callout\">⚠️ <b>ข้อควรระวังเรื่อง grammar:</b> should/ought to/had better ตามด้วย <b>V1 เปล่า ๆ ไม่มี to</b>\n    (ยกเว้น ought to ที่มี to ในตัวมันเองอยู่แล้ว) → <i>You should go.</i> ไม่ใช่ <s>You should to go.</s></p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>4️⃣ be supposed to — คาดหวังตามกฎ/ข้อตกลง (แต่จริง ๆ อาจไม่ทำ)</h3>\n    <p>ใช้พูดถึงสิ่งที่ \"ควรจะเป็นแบบนั้นตามกฎ\" แต่มีนัยว่าในความเป็นจริงอาจไม่ได้เป็นแบบนั้นเป๊ะ</p>\n    <p class=\"ex-eli5\">You'<b>re not supposed to</b> smoke here. (กฎบอกว่าห้าม แต่บางคนก็ยังแอบทำ)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>5️⃣ be allowed to / be permitted to — ได้รับอนุญาต</h3>\n    <p class=\"ex-eli5\">You'<b>re allowed to</b> park here after 6 p.m. (มีสิทธิ์จอดได้ตามกฎ)</p>\n    </div>\n\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>เจอ mustn't กับ don't have to ในตัวเลือกคู่กัน → <b>อ่านประโยคช้า ๆ แปลเป็นไทยในหัว</b> ว่าควรจะเป็น\n        \"ห้าม\" หรือ \"ไม่จำเป็น\" ก่อนเลือก</li>\n    <li>ถ้าประโยคพูดถึง \"กฎของสถานที่/องค์กร\" (เช่น สนามบิน, โรงเรียน, บริษัท) มักเป็น <b>have to</b> ไม่ใช่ must</li>\n    <li>ถ้าประโยคมีคำว่า \"or else / or you'll...\" (บอกผลเสียถ้าไม่ทำ) มักเป็นสัญญาณของ <b>had better</b></li>\n    <li>ระวัง grammar: should/ought to/had better <b>ห้ามมี to อยู่หน้ากริยา</b> (ยกเว้น ought to)</li>\n    <li>ถ้าประโยคบอกว่า \"กฎบอกไว้แบบนี้ แต่จริง ๆ คนอาจไม่ทำตาม\" → นึกถึง <b>be supposed to</b> ก่อนตัวอื่น</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "In many U.S. cities, pedestrians ___ cross at a crosswalk — jaywalking is against the law.", "options": ["don't have to", "have to", "could"], "answer": "have to"}, {"n": 2, "type": "mcq", "prompt": "You ___ leave a tip if the service was terrible, but most people still leave something small.", "options": ["mustn't", "don't have to", "aren't allowed to"], "answer": "don't have to"}, {"n": 3, "type": "mcq", "prompt": "___ cross here — the sign clearly says 'No Crossing'.", "options": ["You'd better not", "You don't have to", "You should"], "answer": "You'd better not"}, {"n": 4, "type": "mcq", "prompt": "Visitors ___ wear a helmet on a bike in this city — it's the law.", "options": ["are supposed to", "have to", "should"], "answer": "have to"}, {"n": 5, "type": "mcq", "prompt": "You ___ smoke in the restaurant. It's strictly forbidden.", "options": ["mustn't", "don't have to", "aren't supposed"], "answer": "mustn't"}, {"n": 6, "type": "mcq", "prompt": "According to the sign, guests ___ check out by 11 a.m.", "options": ["are supposed to", "mustn't", "had better not"], "answer": "are supposed to"}, {"n": 7, "type": "fill", "prompt": "You ______ (had better) call ahead — the restaurant gets full fast on weekends.", "answer": "had better"}, {"n": 8, "type": "fill", "prompt": "In this office, employees ______ (not/allowed) to use their phones during meetings.", "answer": "aren't allowed"}, {"n": 9, "type": "fill", "prompt": "I really ______ (ought) to apologize to her — I was rude yesterday.", "answer": "ought"}, {"n": 10, "type": "fill", "prompt": "You ______ (not/have) to bring anything to the party — we've got it all covered.", "answer": "don't have"}, {"n": 11, "type": "error", "prompt": "You don't have to park here — it's a fire lane and you'll get a fine.", "answer": "don't have to → mustn't (เป็นการห้ามเด็ดขาด ไม่ใช่แค่ไม่จำเป็น)"}, {"n": 12, "type": "error", "prompt": "According to the rules, you must not check in online, but most people do it anyway to save time.", "answer": "must not → don't have to (ไม่ใช่ข้อห้าม แค่ไม่จำเป็นต้องทำ)"}, {"n": 13, "type": "error", "prompt": "She should to see a doctor about that cough.", "answer": "should to → should (should ตามด้วย infinitive ไม่มี to)"}, {"n": 14, "type": "dialog", "prompt": "A: Can I park my car here overnight?<br>B: No, you ______ (allowed) — this area is for residents only.", "answer": "aren't allowed to"}, {"n": 15, "type": "dialog", "prompt": "A: Do I need a reservation for that restaurant?<br>B: You ______ (not/have to), but I'd recommend it since it's popular.", "answer": "don't have to"}, {"n": 16, "type": "mcq", "prompt": "You ___ take your shoes off before entering — it's the custom here.", "options": ["are supposed to", "mustn't", "don't have to"], "answer": "are supposed to"}, {"n": 17, "type": "mcq", "prompt": "Employees ___ arrive late more than twice a month, or they'll be fired.", "options": ["mustn't", "don't have to", "could"], "answer": "mustn't"}, {"n": 18, "type": "mcq", "prompt": "You ___ bring your passport — a copy is fine.", "options": ["don't have to", "mustn't", "shouldn't"], "answer": "don't have to"}, {"n": 19, "type": "mcq", "prompt": "___ leave now if you want to catch the early train.", "options": ["You'd better", "You don't have to", "You could"], "answer": "You'd better"}, {"n": 20, "type": "mcq", "prompt": "Students ___ submit the assignment by Friday at the latest.", "options": ["are supposed to", "mustn't", "needn't"], "answer": "are supposed to"}, {"n": 21, "type": "mcq", "prompt": "You ___ worry about the deadline — it's been extended.", "options": ["don't have to", "mustn't", "had better not"], "answer": "don't have to"}, {"n": 22, "type": "fill", "prompt": "Passengers ______ (not/allowed) to use phones during takeoff.", "answer": "aren't allowed"}, {"n": 23, "type": "fill", "prompt": "You ______ (ought) to see a dentist about that toothache.", "answer": "ought"}, {"n": 24, "type": "fill", "prompt": "At my old school, we ______ (have to) wear uniforms every day.", "answer": "had to"}, {"n": 25, "type": "fill", "prompt": "You ______ (better) not be late again, or you'll be in trouble.", "answer": "'d better"}, {"n": 26, "type": "error", "prompt": "You should to ask for permission before you leave early.", "answer": "should to → should (should ตามด้วย infinitive ไม่มี to)"}, {"n": 27, "type": "error", "prompt": "We must to finish this by Friday.", "answer": "must to → must"}, {"n": 28, "type": "error", "prompt": "Visitors don't have to touch the paintings in this gallery.", "answer": "don't have to → mustn't / aren't allowed to (เป็นข้อห้าม ไม่ใช่แค่ไม่จำเป็น)"}, {"n": 29, "type": "dialog", "prompt": "A: Do we need a visa to visit?<br>B: No, you ______ (not/have to) — it's visa-free for 30 days.", "answer": "don't have to"}, {"n": 30, "type": "dialog", "prompt": "A: Can I take photos inside the museum?<br>B: No, you ______ (allowed) — it's strictly prohibited.", "answer": "aren't allowed to"}]}, {"code": "G4", "title": "3C: Phrasal verbs", "explanation": "\n    <div class=\"eli5\">\n\n    <div class=\"eli5-block\">\n    <h3>🧱 Phrasal verb คืออะไร แบบง่ายที่สุด</h3>\n    <p>Phrasal verb = <b>กริยา + คำเล็ก ๆ ต่อท้าย</b> (เช่น up, down, out, on, off) ที่รวมกันแล้วได้ความหมายใหม่\n    บางทีก็เดาความหมายจากกริยาหลักได้ (turn off = หมุนปิด → ปิด) แต่ส่วนใหญ่<b>เดาไม่ได้เลย</b> ต้องจำเป็นชุดคำ\n    เหมือนจำสำนวนไทย เช่น \"come across\" ไม่ได้แปลว่า \"มาข้าม\" แต่แปลว่า <b>\"บังเอิญเจอ\"</b></p>\n    <p class=\"tip-callout\">🎯 อย่าพยายามแปลทีละคำ — ให้จำเป็น \"คำผสมทั้งชุด\" แล้วผูกกับสถานการณ์ที่ใช้ จะจำได้ติดทนกว่า</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>🧩 ปัญหาที่แท้จริงของหัวข้อนี้ไม่ใช่ความหมาย แต่คือ \"จะวางคำไว้ตรงไหน\"</h3>\n    <p>Phrasal verb มี 4 แบบ ต่างกันตรงที่ <b>\"กรรม (object) วางตรงไหนได้บ้าง\"</b> ลองดูทีละแบบ:</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>1️⃣ แบบไม่มีกรรม — จบในตัวเอง</h3>\n    <p>ไม่มีอะไรมาคั่นกลางเลย เพราะไม่มีกรรม (object)</p>\n    <p class=\"ex-eli5\">My daughter wants to be a doctor when she <b>grows up</b>.<br>\n    What time should we <b>go back</b> tomorrow?</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>2️⃣ แบบมีกรรม แยกได้ (separable) — กรรมอยู่ตรงไหนก็ได้ แต่ถ้าเป็นสรรพนามต้องแทรกกลาง</h3>\n    <p>ถ้ากรรมเป็น \"คำนาม\" ธรรมดา จะวางหลังกริยาทั้งชุด หรือแทรกกลางก็ได้ ความหมายเหมือนกัน:</p>\n    <p class=\"ex-eli5\">Try on my shoes. &nbsp; = &nbsp; Try my shoes on. (2 แบบนี้ถูกทั้งคู่)</p>\n    <p><b>แต่!</b> ถ้ากรรมเป็น <b>สรรพนาม</b> (it, him, her, them, this...) กฎจะเข้มกว่า — ต้อง<b>แทรกกลางเท่านั้น</b>\n    ห้ามวางท้ายสุด</p>\n    <p class=\"ex-eli5\">✅ I bought you a jacket. Try <b>it</b> on.<br>❌ Try on <b>it</b>. (ผิด! ห้ามพูดแบบนี้)</p>\n    <p class=\"tip-callout\">🧠 <b>วิธีจำ:</b> ลองแทนกรรมด้วยสรรพนามในหัวก่อนตอบเสมอ — ถ้าใช้สรรพนามแล้วต้องแทรกกลาง\n    แปลว่าตัวเลือกที่วางสรรพนามไว้ท้ายสุดผิดแน่นอน</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>3️⃣ แบบมีกรรม แยกไม่ได้ (non-separable) — กรรมอยู่ท้ายเสมอ ไม่ว่าจะเป็นอะไร</h3>\n    <p>กลุ่มนี้ต่างจากแบบที่ 2 ตรงที่<b>ห้ามแทรกกรรมเข้ากลาง</b>เด็ดขาด แม้เป็นสรรพนามก็ต้องอยู่ท้าย</p>\n    <p class=\"ex-eli5\">I'll go over the questions with you. → I'll go over <b>them</b> with you.<br>\n    ❌ I'll go <b>them</b> over. (ผิด! ห้ามแทรกกลาง)</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>4️⃣ แบบ 3 คำ (แยกไม่ได้) — กรรมอยู่ท้ายสุดเสมอ</h3>\n    <p>กริยากลุ่มนี้มี 3 ส่วนติดกันตลอด (เช่น get along with, get away with, come up with) กรรมต้องอยู่หลังสุดเท่านั้น</p>\n    <p class=\"ex-eli5\">Do you <b>get along with</b> your sister?<br>\n    He tried to cheat, but he didn't <b>get away with</b> it.</p>\n    </div>\n\n    <div class=\"eli5-block\">\n    <h3>📚 คำศัพท์สำคัญจากบทเรียน (ท่องเป็นชุด อย่าแยกคำ)</h3>\n    <p class=\"ex-eli5\">break up (เลิกกัน), throw out (ทิ้ง), show...around (พาชมสถานที่), pick up (หยิบ/เก็บขึ้นมา),\n    take after (มีนิสัย/หน้าตาคล้ายใคร), put up with (ทนกับ), turn off (ปิด), come across (บังเอิญเจอ),\n    grow up (เติบโต), go back (กลับไป), try on (ลองสวมใส่), get on (ขึ้นรถ/เข้ากันได้), go over (ทบทวน),\n    get along with (เข้ากันได้กับ), get away with (ทำผิดแล้วรอดตัว), eat out (ทานข้าวนอกบ้าน), look for (ค้นหา),\n    look forward to (ตั้งตารอ), look up (ค้นหาในดิก/แหล่งข้อมูล), take off (เครื่องบินขึ้น/ถอด), talk into\n    (ชักชวนโน้มน้าวให้ทำ), turn down (ปฏิเสธ/ลดเสียง), use up (ใช้จนหมด), come up with (คิดหาไอเดียได้),\n    get out of (หลีกเลี่ยงการทำ), figure out (คิดออก/หาคำตอบได้), pay off (คุ้มค่า/ประสบผล)</p>\n    </div>\n\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>ถ้ากรรมในโจทย์เป็นสรรพนาม (it, him, her, them) → เช็คว่าต้อง<b>แทรกกลาง</b> phrasal verb แบบแยกได้เสมอ</li>\n    <li>ถ้าไม่แน่ใจว่ากริยาตัวไหน separable/non-separable → สังเกตว่ามีคำว่า \"with\" ต่อท้ายไหม (go over\n        <b>with</b> you, get along <b>with</b>...) กริยาที่มี preposition ต่อท้ายแบบนี้ <b>มักแยกไม่ได้</b></li>\n    <li>อย่าแปลทีละคำ ให้จำทั้งวลีพร้อมตัวอย่างประโยค จะช่วยให้เดาความหมายในบริบทข้อสอบได้แม่นกว่า</li>\n    <li>โจทย์แก้ที่ผิด (error correction) ที่เกี่ยวกับ phrasal verbs มักผิดที่ <b>ตำแหน่งของกรรม</b> ไม่ใช่ตัวคำเอง\n        ให้เพ่งดูตรงนั้นเป็นอันดับแรก</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "I really don't know how much longer I can ___ my boss's bad attitude!", "options": ["put up with", "look up", "take after"], "answer": "put up with"}, {"n": 2, "type": "mcq", "prompt": "If you don't know a word, you can always ___ it in a dictionary.", "options": ["look up", "look for", "look forward to"], "answer": "look up"}, {"n": 3, "type": "mcq", "prompt": "I think my daughter really ___ her father — same sense of humor.", "options": ["takes after", "gets along with", "shows around"], "answer": "takes after"}, {"n": 4, "type": "mcq", "prompt": "Our plane ___ on time and landed early.", "options": ["took off", "turned down", "gave up"], "answer": "took off"}, {"n": 5, "type": "mcq", "prompt": "Choose the correct sentence with a pronoun object.", "options": ["I bought you a jacket. Try on it.", "I bought you a jacket. Try it on.", "I bought you a jacket. Try on."], "answer": "I bought you a jacket. Try it on."}, {"n": 6, "type": "mcq", "prompt": "Choose the correct sentence (non-separable phrasal verb + pronoun).", "options": ["I'll go them over with you.", "I'll go over them with you.", "I'll go over with them."], "answer": "I'll go over them with you."}, {"n": 7, "type": "fill", "prompt": "We ______ (break up) last week after the party — it just wasn't working out.", "answer": "broke up"}, {"n": 8, "type": "fill", "prompt": "You dropped a fork. Please ______ (pick) it ______ and put it in the sink.", "answer": "pick / up"}, {"n": 9, "type": "fill", "prompt": "Katie ______ her parents ______ (show) her new apartment yesterday.", "answer": "showed / around"}, {"n": 10, "type": "fill", "prompt": "I can't find my glasses! I ______ (look) for them all day yesterday!", "answer": "looked"}, {"n": 11, "type": "error", "prompt": "I thought I'd lost my wallet, but then it turned it up.", "answer": "turned it up → turned up (ไม่มีกรรม จึงไม่มี \"it\")"}, {"n": 12, "type": "error", "prompt": "I came something really weird across. I don't know what it is.", "answer": "came something really weird across → came across something really weird (come across แยกไม่ได้)"}, {"n": 13, "type": "error", "prompt": "I know you don't want to go, but we can't get it out of.", "answer": "get it out of → get out of it (get out of เป็นกริยา 2 คำ แยกไม่ได้, กรรมวางหลังเสมอ)"}, {"n": 14, "type": "dialog", "prompt": "A: Why isn't Joe with you tonight?<br>B: Did you not hear? We ______ (break up) last month.", "answer": "broke up"}, {"n": 15, "type": "dialog", "prompt": "A: These math problems are so hard!<br>B: I know, I can't ______ (figure) them ______ either.", "answer": "figure / out"}, {"n": 16, "type": "mcq", "prompt": "I can't believe he ___ his best friend at the airport by pure chance!", "options": ["came across", "took after", "gave up"], "answer": "came across"}, {"n": 17, "type": "mcq", "prompt": "She's trying to ___ a solution to the problem.", "options": ["come up with", "get along with", "put up with"], "answer": "come up with"}, {"n": 18, "type": "mcq", "prompt": "The hard work finally ___ when he got the promotion.", "options": ["paid off", "turned down", "used up"], "answer": "paid off"}, {"n": 19, "type": "mcq", "prompt": "He ___ the job offer because the salary was too low.", "options": ["turned down", "took off", "looked up"], "answer": "turned down"}, {"n": 20, "type": "mcq", "prompt": "We ___ all the milk, so we need to buy more.", "options": ["used up", "turned down", "paid off"], "answer": "used up"}, {"n": 21, "type": "mcq", "prompt": "Choose the sentence with correct pronoun placement.", "options": ["She picked up it from the floor.", "She picked it up from the floor.", "She picked up from it the floor."], "answer": "She picked it up from the floor."}, {"n": 22, "type": "fill", "prompt": "I ______ (throw) out my old notes by mistake!", "answer": "threw"}, {"n": 23, "type": "fill", "prompt": "Let's ______ (eat) out tonight — I don't feel like cooking.", "answer": "eat"}, {"n": 24, "type": "fill", "prompt": "He tried to cheat on the test, but he didn't ______ (get) away with it.", "answer": "get"}, {"n": 25, "type": "fill", "prompt": "Do you ______ (get) along with your new roommate?", "answer": "get"}, {"n": 26, "type": "error", "prompt": "I couldn't come up any good ideas for the project.", "answer": "come up any → come up with any"}, {"n": 27, "type": "error", "prompt": "The teacher talked me into join the debate club.", "answer": "into join → into joining (phrasal verb + gerund)"}, {"n": 28, "type": "error", "prompt": "Please turn down it — it's too loud.", "answer": "turn down it → turn it down (สรรพนามต้องแทรกกลาง)"}, {"n": 29, "type": "dialog", "prompt": "A: Are you going to ______ (take) that job?<br>B: No, I've decided to ______ (turn) it ______.", "answer": "take / turn / down"}, {"n": 30, "type": "dialog", "prompt": "A: What time does your flight ______ (take) ______?<br>B: Around 7 a.m., so we'd better hurry.", "answer": "take / off"}]}], "vocabulary": [{"code": "V1", "title": "1A: Body language and communication", "explanation": "\n    <div class=\"explain\">\n    <p><b>คำศัพท์สำคัญ:</b> raise your voice (พูดเสียงดังขึ้น/ตะโกน), shrug your shoulders (ยักไหล่ — ไม่รู้/ไม่สนใจ),\n    tap someone on the shoulder (แตะไหล่เพื่อเรียกความสนใจ), nod (พยักหน้า), shake your head (ส่ายหน้า),\n    wave (โบกมือ), give someone a hug (กอด), kiss someone on the cheek (จูบแก้ม), stare (จ้องมอง),\n    gaze (จ้องมองด้วยความหลงใหล/เพลิดเพลิน), wink (ขยิบตา), frown (ทำหน้าบึ้ง/ขมวดคิ้ว),\n    make eye contact (สบตา), shake hands (จับมือทักทาย)</p>\n    <p><b>รูปแบบการสื่อสาร (communication styles):</b> audio communicator (เน้นฟัง), visual communicator (เน้นเห็นภาพ),\n    kinesthetic communicator (เน้นสัมผัส/เคลื่อนไหว)</p>\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>คำเหล่านี้ส่วนใหญ่เป็น \"verb + preposition\" ตายตัว เช่น tap someone <b>on</b> the shoulder,\n        stare/wink/gaze <b>at</b> someone — จำ preposition คู่กันไปเลย อย่าเดาแยก</li>\n    <li>เวลาทำโจทย์เติมคำ ให้สังเกตว่าต้องการ \"กริยา\" (nod, wave) หรือ \"กริยา+กรรม\" (give someone a hug)</li>\n    <li>nod = เห็นด้วย/ตอบรับ, shake your head = ไม่เห็นด้วย/ปฏิเสธ — จำคู่ตรงข้ามนี้ไว้ มักออกสอบเทียบกัน</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "\"I have no idea what you're talking about\" is best expressed with...", "options": ["shrugging your shoulders", "nodding", "winking"], "answer": "shrugging your shoulders"}, {"n": 2, "type": "mcq", "prompt": "To get someone's attention from behind without speaking, you could...", "options": ["tap them on the shoulder", "frown at them", "stare at them"], "answer": "tap them on the shoulder"}, {"n": 3, "type": "mcq", "prompt": "Agreeing silently with someone is usually shown by...", "options": ["nodding", "shaking your head", "shrugging"], "answer": "nodding"}, {"n": 4, "type": "mcq", "prompt": "Disagreeing or saying \"no\" without words is usually shown by...", "options": ["shaking your head", "nodding", "waving"], "answer": "shaking your head"}, {"n": 5, "type": "mcq", "prompt": "A visual communicator mainly interacts with the world using their...", "options": ["eyes", "ears", "hands"], "answer": "eyes"}, {"n": 6, "type": "mcq", "prompt": "\"He's staring at me from across the room\" most likely means he is trying to...", "options": ["make eye contact", "shrug his shoulders", "raise his voice"], "answer": "make eye contact"}, {"n": 7, "type": "fill", "prompt": "There's no microphone, so the audience won't hear you unless you ______ your ______.", "answer": "raise / voice"}, {"n": 8, "type": "fill", "prompt": "When my mother told me the news, I said \"No way!\" and ______ my ______ from side to side.", "answer": "shook / head"}, {"n": 9, "type": "fill", "prompt": "In the business world, you can tell a lot about someone's character by how they ______ their head up and down.", "answer": "nod"}, {"n": 10, "type": "fill", "prompt": "He was standing with his back to me, so I ______ him ______ the shoulder.", "answer": "tapped / on"}, {"n": 11, "type": "error", "prompt": "She tapped me at the shoulder to get my attention.", "answer": "at the shoulder → on the shoulder"}, {"n": 12, "type": "error", "prompt": "He winked to me, so I knew it was a joke.", "answer": "winked to me → winked at me"}, {"n": 13, "type": "error", "prompt": "I could tell she was annoyed because she was smiling the whole time.", "answer": "smiling → frowning (การบึ้งหน้าแสดงความหงุดหงิด ไม่ใช่ยิ้ม)"}, {"n": 14, "type": "dialog", "prompt": "A: How did you know Keith didn't agree with the plan?<br>B: He didn't say anything — he just ______ (shake) his head.", "answer": "shook"}, {"n": 15, "type": "dialog", "prompt": "A: Did she seem happy to see you?<br>B: Definitely — she ran over and ______ (give) me a big ______.", "answer": "gave / hug"}, {"n": 16, "type": "mcq", "prompt": "Winking at someone usually signals...", "options": ["a shared joke or secret", "anger", "confusion"], "answer": "a shared joke or secret"}, {"n": 17, "type": "mcq", "prompt": "A kinesthetic communicator mainly interacts with the world using their...", "options": ["body and touch", "eyes", "ears"], "answer": "body and touch"}, {"n": 18, "type": "mcq", "prompt": "\"He's frowning\" means his face shows...", "options": ["displeasure", "happiness", "surprise"], "answer": "displeasure"}, {"n": 19, "type": "mcq", "prompt": "Which expression means greeting someone formally with your hand?", "options": ["shake hands", "wave", "tap on the shoulder"], "answer": "shake hands"}, {"n": 20, "type": "mcq", "prompt": "An audio communicator mainly interacts with the world using their...", "options": ["ears", "eyes", "hands"], "answer": "ears"}, {"n": 21, "type": "mcq", "prompt": "\"She gazed at the painting\" suggests she looked...", "options": ["with fascination for a while", "briefly and rudely", "angrily"], "answer": "with fascination for a while"}, {"n": 22, "type": "fill", "prompt": "He ______ (wink) at me, so I knew he was joking.", "answer": "winked"}, {"n": 23, "type": "fill", "prompt": "I ______ (wave) at my friend across the street.", "answer": "waved"}, {"n": 24, "type": "fill", "prompt": "They greeted each other with a warm ______ (hug).", "answer": "hug"}, {"n": 25, "type": "fill", "prompt": "She ______ (kiss) her grandmother on the cheek before leaving.", "answer": "kissed"}, {"n": 26, "type": "error", "prompt": "He stared to her for a long time without saying anything.", "answer": "stared to her → stared at her"}, {"n": 27, "type": "error", "prompt": "We shook our hands to say hello.", "answer": "shook our hands → shook hands"}, {"n": 28, "type": "error", "prompt": "She gave a hug to me at the airport.", "answer": "gave a hug to me → gave me a hug"}, {"n": 29, "type": "dialog", "prompt": "A: How did he react when you told him the news?<br>B: He just ______ (stare) at me in silence.", "answer": "stared"}, {"n": 30, "type": "dialog", "prompt": "A: Did she seem upset?<br>B: Yes, she was ______ (frown) the whole time.", "answer": "frowning"}]}, {"code": "V2", "title": "1B: Compound adjectives", "explanation": "\n    <div class=\"explain\">\n    <p>Compound adjective คือคำคุณศัพท์ที่เกิดจากการรวมคำสองคำ (มักมี hyphen คั่น) แบ่งเป็น 3 กลุ่มหลัก:</p>\n    <table class=\"rule-table\">\n    <tr><th>โครงสร้าง</th><th>ตัวอย่าง</th><th>ความหมาย</th></tr>\n    <tr><td>adj/adv + present participle (-ing)</td><td>good-looking, far-reaching, forward-thinking, slow-moving</td>\n        <td>หน้าตาดี, ส่งผลกว้างไกล, มองการณ์ไกล, เคลื่อนไหวช้า</td></tr>\n    <tr><td>adj/adv/noun + past participle (-ed)</td><td>old-fashioned, highly respected, middle-aged, open-minded, well-educated, self-centered</td>\n        <td>ล้าสมัย, ได้รับการยกย่องสูง, วัยกลางคน, ใจกว้าง, มีการศึกษาดี, เห็นแก่ตัว</td></tr>\n    <tr><td>noun + adjective/present participle</td><td>world-famous, life-changing, record-breaking, time-consuming</td>\n        <td>โด่งดังทั่วโลก, เปลี่ยนชีวิต, ทำลายสถิติ, กินเวลานาน</td></tr>\n    </table>\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>สังเกตส่วนท้ายของคำ: ลงท้ายด้วย <b>-ing</b> มักบรรยาย \"ลักษณะที่เป็นอยู่ต่อเนื่อง\" (forward-thinking,\n        good-looking) ส่วนลงท้ายด้วย <b>-ed</b> มักบรรยาย \"สิ่งที่ถูกกระทำ/อยู่ในสภาพนั้น\" (well-educated, open-minded)</li>\n    <li>คำที่ขึ้นต้นด้วย noun (world-, life-, record-, time-) มักอธิบาย \"ขนาด/ผลกระทบ\" ของสิ่งนั้น\n        ไม่ใช่บรรยายนิสัยคน — ระวังอย่าใช้ far-reaching หรือ record-breaking กับ \"คน\" โดยตรง</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "That dress is totally out of style — it's very ___.", "options": ["old-fashioned", "world-famous", "record-breaking"], "answer": "old-fashioned"}, {"n": 2, "type": "mcq", "prompt": "It's really ___ to do all this homework — I'll be here for hours.", "options": ["time-consuming", "good-looking", "middle-aged"], "answer": "time-consuming"}, {"n": 3, "type": "mcq", "prompt": "My manager is very ___ — she always has innovative ideas.", "options": ["forward-thinking", "self-centered", "old-fashioned"], "answer": "forward-thinking"}, {"n": 4, "type": "mcq", "prompt": "A ___ novelist spoke at our school, but I'd never heard of him before.", "options": ["world-famous", "slow-moving", "highly respected"], "answer": "world-famous"}, {"n": 5, "type": "mcq", "prompt": "His decision to leave his job had ___ consequences for his whole family.", "options": ["far-reaching", "record-breaking", "well-educated"], "answer": "far-reaching"}, {"n": 6, "type": "mcq", "prompt": "People who are ___ only think about what's important for themselves.", "options": ["self-centered", "open-minded", "well-educated"], "answer": "self-centered"}, {"n": 7, "type": "fill", "prompt": "When Emily was over 50, she made a ______ decision and moved to China.", "answer": "life-changing"}, {"n": 8, "type": "fill", "prompt": "When I meet new people, I always try to be ______, even if I don't agree with them.", "answer": "open-minded"}, {"n": 9, "type": "fill", "prompt": "The athlete set a new ______ time in the marathon this year.", "answer": "record-breaking"}, {"n": 10, "type": "fill", "prompt": "He may be young, but he's incredibly ______, with two university degrees.", "answer": "well-educated"}, {"n": 11, "type": "error", "prompt": "The traffic on the highway is very slow-move today.", "answer": "slow-move → slow-moving"}, {"n": 12, "type": "error", "prompt": "She's a middle-age woman who runs her own business.", "answer": "middle-age → middle-aged"}, {"n": 13, "type": "error", "prompt": "He's a highly-respect doctor in this city.", "answer": "highly-respect → highly respected"}, {"n": 14, "type": "dialog", "prompt": "A: What's your new boss like?<br>B: Honestly, really ______ (open/mind) — she listens to everyone's ideas.", "answer": "open-minded"}, {"n": 15, "type": "dialog", "prompt": "A: Why did you choose that actor for the ad?<br>B: Because he's ______ (world/famous) and very ______ (good/look), so people will notice him.", "answer": "world-famous / good-looking"}, {"n": 16, "type": "mcq", "prompt": "The company's new policy had ___ effects on the whole industry.", "options": ["far-reaching", "good-looking", "middle-aged"], "answer": "far-reaching"}, {"n": 17, "type": "mcq", "prompt": "That's a ___ car — it looks like it's from the 1980s.", "options": ["old-fashioned", "world-famous", "life-changing"], "answer": "old-fashioned"}, {"n": 18, "type": "mcq", "prompt": "He's ___ — he graduated top of his class from two universities.", "options": ["well-educated", "slow-moving", "self-centered"], "answer": "well-educated"}, {"n": 19, "type": "mcq", "prompt": "The traffic downtown is always ___ during rush hour.", "options": ["slow-moving", "good-looking", "open-minded"], "answer": "slow-moving"}, {"n": 20, "type": "mcq", "prompt": "She's a ___ scientist known all over the world for her research.", "options": ["world-famous", "middle-aged", "self-centered"], "answer": "world-famous"}, {"n": 21, "type": "mcq", "prompt": "Meeting my mentor was a ___ experience for me.", "options": ["life-changing", "time-consuming", "old-fashioned"], "answer": "life-changing"}, {"n": 22, "type": "fill", "prompt": "He's quite ______ (self/center) — he never asks how others are doing.", "answer": "self-centered"}, {"n": 23, "type": "fill", "prompt": "The professor is ______ (highly/respect) in the field of medicine.", "answer": "highly respected"}, {"n": 24, "type": "fill", "prompt": "Renovating the house was a very ______ (time/consume) project.", "answer": "time-consuming"}, {"n": 25, "type": "fill", "prompt": "The runner achieved a ______ (record/break) time in the marathon.", "answer": "record-breaking"}, {"n": 26, "type": "error", "prompt": "She's very good-look for her age.", "answer": "good-look → good-looking"}, {"n": 27, "type": "error", "prompt": "He is a far-reach thinker who plans years ahead.", "answer": "far-reach thinker → forward-thinking (far-reaching อธิบายผลกระทบ ไม่ใช่ตัวคน)"}, {"n": 28, "type": "error", "prompt": "That's such a life-change opportunity — you should take it!", "answer": "life-change → life-changing"}, {"n": 29, "type": "dialog", "prompt": "A: What's your grandfather like?<br>B: He's elderly but incredibly ______ (open/mind) for his generation.", "answer": "open-minded"}, {"n": 30, "type": "dialog", "prompt": "A: Why do people admire her so much?<br>B: She's ______ (world/famous) for her ______ (record/break) achievements in swimming.", "answer": "world-famous / record-breaking"}]}, {"code": "V3", "title": "1C: Expectations", "explanation": "\n    <div class=\"explain\">\n    <p><b>คำศัพท์เกี่ยวกับความคาดหวัง:</b></p>\n    <table class=\"rule-table\">\n    <tr><th>Verb</th><th>Noun</th><th>ความหมาย</th></tr>\n    <tr><td>expect</td><td>expectation</td><td>คาดหวัง</td></tr>\n    <tr><td>disappoint</td><td>disappointment</td><td>ทำให้ผิดหวัง / ความผิดหวัง</td></tr>\n    <tr><td>succeed</td><td>success</td><td>ประสบความสำเร็จ</td></tr>\n    <tr><td>impress</td><td>impression</td><td>สร้างความประทับใจ</td></tr>\n    <tr><td>fail</td><td>failure</td><td>ล้มเหลว</td></tr>\n    </table>\n    <p><b>สำนวนที่ควรจำ:</b> look forward to (ตั้งตารอ), hope for (หวังว่าจะได้), live without (อยู่ได้โดยไม่มี),\n    meet someone's expectations (เป็นไปตามที่คาดหวัง), lower one's expectations (ลดความคาดหวังลง),\n    make a good first impression (สร้างความประทับใจแรกพบ), a huge disappointment (ความผิดหวังครั้งใหญ่)</p>\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>ดูว่าโจทย์ต้องการ verb, noun หรือ adjective — เช็คคำข้างเคียง (a/an นำหน้า → ต้องเป็น noun,\n        be + ___ → มักเป็น adjective)</li>\n    <li>สำนวน look forward to และ hope for ต้องมี preposition ต่อท้ายเสมอ (to / for) ห้ามลืม</li>\n    <li>expect/expectation มักใช้พหูพจน์ \"expectations\" เวลาพูดถึงความคาดหวังโดยรวม ไม่ใช่สิ่งเดียว</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "\"I can't wait to meet her\" means the speaker is...", "options": ["looking forward to meeting her", "not interested in meeting her", "worried about meeting her"], "answer": "looking forward to meeting her"}, {"n": 2, "type": "mcq", "prompt": "\"The service met my expectations\" means...", "options": ["it was what I expected", "it wasn't what I expected", "it was terrible"], "answer": "it was what I expected"}, {"n": 3, "type": "mcq", "prompt": "\"The movie was such a disappointment to my mother\" means she...", "options": ["expected it to be better", "expected it to be worse", "loved it"], "answer": "expected it to be better"}, {"n": 4, "type": "mcq", "prompt": "\"My brother says he can't live without his cell phone\" means he...", "options": ["hates not having it with him", "doesn't mind not having it", "never uses it"], "answer": "hates not having it with him"}, {"n": 5, "type": "mcq", "prompt": "The noun form of \"succeed\" is...", "options": ["success", "successful", "succession"], "answer": "success"}, {"n": 6, "type": "mcq", "prompt": "The noun form of \"disappoint\" is...", "options": ["disappointment", "disappointing", "disappointed"], "answer": "disappointment"}, {"n": 7, "type": "fill", "prompt": "The band's last album was a huge ______ (succeed) — it sold millions of copies.", "answer": "success"}, {"n": 8, "type": "fill", "prompt": "I was really ______ (disappoint) with how the trip turned out.", "answer": "disappointed"}, {"n": 9, "type": "fill", "prompt": "His performance really ______ (impress) the judges.", "answer": "impressed"}, {"n": 10, "type": "fill", "prompt": "The experiment was a ______ (fail) because we didn't follow the instructions.", "answer": "failure"}, {"n": 11, "type": "error", "prompt": "I was hoping to something better than this.", "answer": "hoping to → hoping for"}, {"n": 12, "type": "error", "prompt": "She made a good first impress on the interviewer.", "answer": "impress → impression"}, {"n": 13, "type": "error", "prompt": "I expected the food to be better, so I had to lower my expectation.", "answer": "expectation → expectations (มักใช้พหูพจน์ในสำนวนนี้)"}, {"n": 14, "type": "dialog", "prompt": "A: How was the new restaurant?<br>B: Honestly, it ______ (fail) to ______ (impress) me at all.", "answer": "failed / impress"}, {"n": 15, "type": "dialog", "prompt": "A: Are you excited about the trip?<br>B: Yes, I've been ______ (look) forward ______ it for months!", "answer": "looking / to"}, {"n": 16, "type": "mcq", "prompt": "The noun form of \"impress\" is...", "options": ["impression", "impressive", "impressed"], "answer": "impression"}, {"n": 17, "type": "mcq", "prompt": "\"I was hoping for something better\" means the speaker...", "options": ["wasn't pleased", "was pleased", "didn't care"], "answer": "wasn't pleased"}, {"n": 18, "type": "mcq", "prompt": "\"She made a good first impression on me\" means...", "options": ["before I got to know her, I liked her", "after I got to know her, I liked her"], "answer": "before I got to know her, I liked her"}, {"n": 19, "type": "mcq", "prompt": "\"The play was a success\" means...", "options": ["people liked it", "people didn't like it", "it was cancelled"], "answer": "people liked it"}, {"n": 20, "type": "mcq", "prompt": "The adjective form of \"disappoint\" describing a person's feeling is...", "options": ["disappointed", "disappointment", "disappointing"], "answer": "disappointed"}, {"n": 21, "type": "mcq", "prompt": "The adjective form of \"disappoint\" describing a thing/event is...", "options": ["disappointing", "disappointed", "disappointment"], "answer": "disappointing"}, {"n": 22, "type": "fill", "prompt": "I can't ______ (live) without my morning coffee.", "answer": "live"}, {"n": 23, "type": "fill", "prompt": "Their performance ______ (impress) the whole audience.", "answer": "impressed"}, {"n": 24, "type": "fill", "prompt": "He ______ (fail) to meet his own expectations this year.", "answer": "failed"}, {"n": 25, "type": "fill", "prompt": "We were ______ (hope) for a bigger bonus this year.", "answer": "hoping"}, {"n": 26, "type": "error", "prompt": "The movie was a big disappoint for everyone.", "answer": "disappoint → disappointment"}, {"n": 27, "type": "error", "prompt": "She succeeded to pass the exam on her first try.", "answer": "succeeded to pass → succeeded in passing"}, {"n": 28, "type": "error", "prompt": "I have high expectation for this project.", "answer": "expectation → expectations"}, {"n": 29, "type": "dialog", "prompt": "A: How did the interview go?<br>B: I think I ______ (impress) them — they said they'd call this week.", "answer": "impressed"}, {"n": 30, "type": "dialog", "prompt": "A: Are you disappointed with the results?<br>B: A little. I was ______ (hope) for something better.", "answer": "hoping"}]}, {"code": "V4", "title": "3A: Urban places and problems", "explanation": "\n    <div class=\"explain\">\n    <p><b>คำศัพท์สำคัญ:</b> harbor (ท่าเรือ), taxi stand (จุดจอดรับแท็กซี่), business district (ย่านธุรกิจ),\n    smog (หมอกควัน), congestion (การจราจรติดขัด), crosswalk (ทางม้าลาย), jaywalking (การข้ามถนนผิดกฎ/ไม่ข้ามทางม้าลาย),\n    sidewalk (ทางเท้า), a fine (ค่าปรับ), a generous tip (ทิปที่ให้อย่างเอื้อเฟื้อ), rush hour (ชั่วโมงเร่งด่วน),\n    pedestrian (คนเดินเท้า), downtown (ใจกลางเมือง)</p>\n    </div>\n    ", "tips": "\n    <ul class=\"tips-list\">\n    <li>แยกให้ออก: <b>crosswalk</b> = จุดที่กฎหมายให้ข้ามถนนได้ vs. <b>sidewalk</b> = ทางเท้าสำหรับเดิน (ไม่ใช่จุดข้ามถนน)\n        ข้อสอบชอบเอามาสลับกัน</li>\n    <li><b>jaywalking</b> = ข้ามถนนผิดกฎ (ไม่ใช่ที่ crosswalk) เป็นคำนาม ไม่ใช่กริยา (\"jaywalk\" เป็นกริยา)</li>\n    <li>smog กับ congestion อย่าสับสน — smog คือ \"หมอกควันในอากาศ\" ส่วน congestion คือ \"รถติด\"</li>\n    </ul>\n    ", "exercises": [{"n": 1, "type": "mcq", "prompt": "A place to keep boats and ships is called a...", "options": ["harbor", "sidewalk", "crosswalk"], "answer": "harbor"}, {"n": 2, "type": "mcq", "prompt": "A commercial area in a city is called the...", "options": ["business district", "taxi stand", "harbor"], "answer": "business district"}, {"n": 3, "type": "mcq", "prompt": "A type of dirty, hazy air that affects cities is called...", "options": ["smog", "congestion", "a fine"], "answer": "smog"}, {"n": 4, "type": "mcq", "prompt": "When roads are blocked by too many cars, this is called...", "options": ["congestion", "smog", "a crosswalk"], "answer": "congestion"}, {"n": 5, "type": "mcq", "prompt": "Crossing the street somewhere other than a marked crossing is called...", "options": ["jaywalking", "commuting", "sightseeing"], "answer": "jaywalking"}, {"n": 6, "type": "mcq", "prompt": "The amount of money you have to pay for breaking a rule is called a...", "options": ["fine", "tip", "fee"], "answer": "fine"}, {"n": 7, "type": "fill", "prompt": "I left a ______ tip because the service was excellent.", "answer": "generous"}, {"n": 8, "type": "fill", "prompt": "We got to the ______ ______ to catch a cab back to the hotel.", "answer": "taxi / stand"}, {"n": 9, "type": "fill", "prompt": "The officer gave him an $80 ______ for crossing outside the crosswalk.", "answer": "fine"}, {"n": 10, "type": "fill", "prompt": "Traffic was moving slowly because of the ______ downtown.", "answer": "congestion"}, {"n": 11, "type": "error", "prompt": "You must always cross the street at the sidewalk, or you might get a fine.", "answer": "sidewalk → crosswalk"}, {"n": 12, "type": "error", "prompt": "The sky was dark gray — I wondered if it was congestion.", "answer": "congestion → smog"}, {"n": 13, "type": "error", "prompt": "We waited at the business district to catch a taxi.", "answer": "business district → taxi stand"}, {"n": 14, "type": "dialog", "prompt": "A: Why did you get a ticket?<br>B: I didn't realize ______ (jaywalk) was illegal here — I just crossed wherever I wanted!", "answer": "jaywalking"}, {"n": 15, "type": "dialog", "prompt": "A: Why is it taking so long to get downtown?<br>B: There's terrible ______ (congest) at this time of day.", "answer": "congestion"}, {"n": 16, "type": "mcq", "prompt": "The time of day when traffic is heaviest is called...", "options": ["rush hour", "congestion", "crosswalk"], "answer": "rush hour"}, {"n": 17, "type": "mcq", "prompt": "A person walking (not driving) is called a...", "options": ["pedestrian", "commuter", "resident"], "answer": "pedestrian"}, {"n": 18, "type": "mcq", "prompt": "The main commercial area of a city, often full of offices and shops, is the...", "options": ["downtown", "harbor", "sidewalk"], "answer": "downtown"}, {"n": 19, "type": "mcq", "prompt": "The paved path beside a street for walking is called the...", "options": ["sidewalk", "crosswalk", "harbor"], "answer": "sidewalk"}, {"n": 20, "type": "mcq", "prompt": "If you don't leave enough money for good service, your tip might be considered...", "options": ["not generous", "generous", "illegal"], "answer": "not generous"}, {"n": 21, "type": "mcq", "prompt": "A marked area where pedestrians can safely cross the street is a...", "options": ["crosswalk", "sidewalk", "taxi stand"], "answer": "crosswalk"}, {"n": 22, "type": "fill", "prompt": "It's hard to find parking ______ during the day.", "answer": "downtown"}, {"n": 23, "type": "fill", "prompt": "The city was full of ______ (pedestrian) rushing to work.", "answer": "pedestrians"}, {"n": 24, "type": "fill", "prompt": "Traffic barely moves during ______ hour.", "answer": "rush"}, {"n": 25, "type": "fill", "prompt": "He got a ______ for parking in a no-parking zone.", "answer": "fine"}, {"n": 26, "type": "error", "prompt": "We waited on the crosswalk for a taxi to arrive.", "answer": "crosswalk → taxi stand"}, {"n": 27, "type": "error", "prompt": "There was a lot of congestion, so traffic moved very quickly.", "answer": "quickly → slowly"}, {"n": 28, "type": "error", "prompt": "Jaywalking means crossing the street safely at a marked crosswalk.", "answer": "safely at a marked crosswalk → illegally, not at a marked crossing"}, {"n": 29, "type": "dialog", "prompt": "A: Why is it so hazy outside today?<br>B: There's a lot of ______ (smog) from the traffic.", "answer": "smog"}, {"n": 30, "type": "dialog", "prompt": "A: Where should we wait for a cab?<br>B: There's a ______ ______ (taxi/stand) right around the corner.", "answer": "taxi stand"}]}], "listening": {"cod
