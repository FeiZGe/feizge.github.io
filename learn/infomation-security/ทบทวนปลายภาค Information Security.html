<html lang="th"><head><meta charset="utf-8">

<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#1b2a33;--mut:#5b6b75;--ac:#0f766e;--acb:#d5ede9;--hl:#fff1a8;--ln:#cfd8de;--pv:#e3e9ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11181c;--card:#1a2328;--ink:#e6edf0;--mut:#9fb0ba;--ac:#4fd1c0;--acb:#16403c;--hl:#4a4217;--ln:#2e3b43;--pv:#25323a}}
:root[data-theme="dark"]{--bg:#11181c;--card:#1a2328;--ink:#e6edf0;--mut:#9fb0ba;--ac:#4fd1c0;--acb:#16403c;--hl:#4a4217;--ln:#2e3b43;--pv:#25323a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans Thai",system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:1.3rem;margin:0;flex:1 1 260px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{height:6px;background:var(--pv);border-radius:3px;flex:1 1 100%}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px;width:0}
main{max-width:1100px;margin:auto;padding:8px 16px 40px;display:grid;grid-template-columns:240px 1fr;gap:16px}
nav{display:flex;flex-direction:column;gap:4px;max-height:80vh;overflow:auto}
nav button{text-align:left;border-color:transparent;background:none;font-size:.9rem;padding:6px 10px}
nav button.on{background:var(--acb);border-color:var(--ac);font-weight:600}
nav button.dn::after{content:" ✓";color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:20px;min-width:0}
h2{margin:0 0 12px;font-size:1.2rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.q .body{filter:blur(9px);cursor:pointer;user-select:none}
ul{padding-left:20px;margin:0}li{margin:6px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.flow span{background:var(--acb);border:1px solid var(--ac);border-radius:6px;padding:4px 10px;font-size:.9rem}
.flow b{color:var(--mut)}
.dif{background:var(--hl);border-radius:8px;padding:10px 14px;margin:8px 0}
.dif strong{display:block}
.ox{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px;text-align:center}
th,td{border:1px solid var(--ln);padding:6px;font-size:.88rem}td.C{background:var(--acb)}td.P{background:var(--pv)}
.foot{display:flex;justify-content:space-between;margin-top:18px;gap:8px;flex-wrap:wrap}
.hint{color:var(--mut);font-size:.85rem}h3{font-size:1rem;margin:20px 0 6px;color:var(--ac)}.mem{background:var(--acb)}
@media(max-width:760px){main{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;max-height:none}nav button{white-space:nowrap}}
</style></head><body>

<script>
const F=a=>a;
const T=[
{t:"Host Security Solutions",a:["EDR/XDR: เฝ้าดูพฤติกรรมบนเครื่อง ตรวจจับ+ตอบโต้ (isolate เครื่อง) ได้","Host-based Firewall: กรอง traffic เข้า-ออกเฉพาะเครื่องนั้น","HIDS/HIPS: ตรวจ (HIDS) / ตรวจและบล็อก (HIPS) กิจกรรมผิดปกติบนโฮสต์","Full Disk Encryption (BitLocker + TPM): เครื่องหาย ข้อมูลก็อ่านไม่ได้","Hardening + Patch Management: ปิด service ที่ไม่ใช้ ตั้ง baseline อัปเดตช่องโหว่ (เสริม: Application Allowlist)"],m:["Defense in depth: endpoint เป็นด่านสุดท้ายเมื่อ network ถูกเจาะ","ตัวอย่าง ransomware: EDR จับพฤติกรรมเข้ารหัสไฟล์ผิดปกติ แล้ว isolate เครื่องทันที","TPM เก็บ key ในชิป ผูกกับฮาร์ดแวร์ ถอดดิสก์ไปอ่านเครื่องอื่นไม่ได้","Secure Boot ตรวจว่า bootloader/OS ไม่ถูกแก้ไขตอนเปิดเครื่อง"],how:"ตอบ 5 ข้อ ข้อละ 1 บรรทัด: ชื่อ + ทำงานอย่างไร + ป้องกันอะไร ไม่ต้องยาว",e:"เครือข่ายคือตึก firewall หน้าตึกคือยามประตูใหญ่ Host security คือล็อก+กล้อง+ยามประจำ 'แต่ละห้อง' ถ้าโจรเข้าตึกได้ ห้องก็ยังปลอดภัย",d:[["HIDS vs HIPS","HIDS แค่แจ้งเตือน (detect) / HIPS บล็อกได้ (prevent)"],["Antivirus vs EDR","AV เทียบ signature ของที่รู้จัก / EDR ดู 'พฤติกรรม' จึงจับของใหม่ได้ + มี response"],["Host FW vs Network FW","ตัวแรกอยู่บนเครื่อง ตัวหลังอยู่ที่ขอบเครือข่าย"]]},
{t:"Third Party Risk Management",flow:["เลือก/Due diligence","ประเมินความเสี่ยง","ทำสัญญา (SLA, NDA, right to audit)","Onboard","เฝ้าติดตามต่อเนื่อง","Offboard (คืน/ทำลายข้อมูล)"],a:["Vendor/supplier/partner อาจเป็นช่องโหว่ (supply chain attack)","ก่อนจ้าง: ตรวจสอบความมั่นคง (questionnaire, ISO 27001, SOC 2)","ในสัญญา: กำหนดความรับผิดชอบด้านความปลอดภัย + สิทธิ์ audit","หลังจ้าง: monitor, ประเมินซ้ำเป็นรอบ","เลิกจ้าง: เพิกถอนสิทธิ์ ทำลาย/คืนข้อมูล"],m:["Due diligence ตรวจ: ใบรับรอง (ISO 27001, SOC 2), ประวัติ breach, ที่เก็บข้อมูล, subcontractor ของ vendor (fourth party)","Right to audit ต้องเขียนไว้ในสัญญาตั้งแต่แรก","ตัวอย่างจริง: Target ถูกเจาะผ่าน credential ของ vendor ระบบปรับอากาศ (2013)"],how:"วาดเป็น lifecycle วนรอบ แล้วเขียนใต้แต่ละกล่องว่า 'ทำอะไร และลดความเสี่ยงอย่างไร'",e:"จะให้ช่างมาซ่อมบ้าน ต้องเช็กประวัติก่อน ทำสัญญาให้ชัด คอยดูตอนทำงาน และเอากุญแจคืนเมื่อเสร็จ",d:[["SLA","ระดับบริการ/uptime ที่รับประกัน วัดได้"],["MOU/MOA","บันทึกข้อตกลงร่วม ไม่ผูกมัดทางกฎหมายเท่าสัญญา"],["MSA","สัญญากรอบ ใช้ร่วมกับงานหลายโครงการ"],["NDA","ห้ามเปิดเผยความลับ"],["BPA","ข้อตกลงหุ้นส่วนธุรกิจ (แบ่งกำไร/ความรับผิดชอบ)"]]},
{t:"Mobile Device Management (MDM)",a:["ระบบศูนย์กลาง (console + agent บนเครื่อง) บริหารอุปกรณ์มือถือขององค์กร","Enroll อุปกรณ์ → ส่ง policy (PIN, encryption, ห้าม root/jailbreak)","ตรวจ compliance ถ้าไม่ผ่านให้ block เข้าระบบ","จัดการแอป (push/ถอด), containerization แยกข้อมูลงาน/ส่วนตัว","เครื่องหายสั่ง remote lock / remote wipe, ตามตำแหน่ง/geofencing"],how:"ตอบเป็นลำดับ: ทำไมต้องมี → ทำงานอย่างไร (enroll, policy, enforce, monitor, wipe) → ประโยชน์",e:"MDM คือครูใหญ่ที่ถือรีโมตคุมแท็บเล็ตของโรงเรียนทุกเครื่อง: ตั้งกฎ ลงแอป ล็อกจากไกล และลบข้อมูลได้ถ้าเครื่องหาย",d:[["MDM vs MAM","MDM คุมทั้งเครื่อง / MAM คุมเฉพาะแอปและข้อมูลงาน (เหมาะ BYOD)"],["MDM vs UEM","UEM รวมการจัดการทุก endpoint (มือถือ+PC) ไว้ที่เดียว"],["BYOD/COPE/CYOD","BYOD เครื่องส่วนตัว / COPE บริษัทซื้อ ใช้ส่วนตัวได้ / CYOD เลือกจากรายการที่บริษัทกำหนด"]]},
{t:"Secure Mobile Solutions",a:["Screen lock + Biometrics: กันคนเปิดใช้เครื่อง","Full Device Encryption: เครื่องหายข้อมูลอ่านไม่ได้","Remote Wipe: ลบข้อมูลทางไกล","Containerization/Sandbox: แยกแอป/ข้อมูลงานจากส่วนตัว","ห้าม sideload/root/jailbreak + ใช้ VPN + ลงแอปจาก official store เท่านั้น"],how:"จัดกลุ่มตามภัย: ถูกขโมย (lock/encrypt/wipe), มัลแวร์ (store/sideload), ดักข้อมูล (VPN), ปนข้อมูล (container)",e:"มือถือคือกระเป๋าเงินที่พกไปทุกที่ ต้องมีล็อก ซองกันน้ำ (encrypt) ปุ่มทำลายจากไกล และห้ามหยิบของแปลกหน้ามาใส่",d:[["Sideloading vs Jailbreak/Root","Sideload = ลงแอปนอก store / Jailbreak/Root = ปลดล็อกสิทธิ์ระบบปฏิบัติการ"],["Remote lock vs wipe","lock กู้กลับได้ / wipe ลบถาวร"],["Geofencing vs Geolocation","fence = กฎตามพื้นที่ / location = รู้ตำแหน่ง"]]},
{t:"Web Application Security",a:["Input Validation + Output Encoding: ไม่เชื่อ input ใคร กัน XSS/injection","Parameterized Query/Prepared Statement: กัน SQL Injection","WAF: กรอง HTTP request (layer 7) ที่เป็นการโจมตี","Secure Session/Cookie (HttpOnly, Secure, SameSite, CSRF token) + HTTPS/TLS","SAST/DAST/Code review + patch library: หาช่องโหว่ก่อนใช้งานจริง"],m:["SQLi ตัวอย่าง: input ' OR 1=1 -- ทำให้ login ผ่านเมื่อต่อ string เข้า query ตรงๆ ส่วน prepared statement แยก 'คำสั่ง' ออกจาก 'ข้อมูล'","XSS มี 3 แบบ: Stored, Reflected, DOM-based กันด้วย output encoding + CSP","CSRF กันด้วย anti-CSRF token และ SameSite cookie","อ้างอิง OWASP Top 10 ในคำตอบได้"],how:"ระบุวิธี + 'กันการโจมตีอะไร' คู่กัน เช่น Parameterized query → SQLi จะได้คะแนนเต็ม",e:"เว็บคือเคาน์เตอร์ร้านค้า: ตรวจของที่ลูกค้ายื่นให้ (validation) พูดกับตู้เซฟแบบมีแบบฟอร์ม ไม่ใช่ตามที่ลูกค้าพูด (parameterized) และมี รปภ. ดูซองจดหมาย (WAF)",d:[["SQLi vs XSS vs CSRF","SQLi โจมตี DB ผ่าน input / XSS ฝัง script ให้รันบนเบราว์เซอร์ผู้ใช้ / CSRF หลอกผู้ใช้ที่ login อยู่ให้ส่งคำสั่ง"],["SAST vs DAST","SAST อ่าน source (ไม่รันโปรแกรม) / DAST ยิงทดสอบแอปที่รันอยู่"],["WAF vs Firewall","WAF เข้าใจ HTTP / firewall ทั่วไปดู IP-port"]]},
{t:"นิยาม Cloud Computing",a:["NIST: โมเดลให้เข้าถึงทรัพยากรไอที (server, storage, network, app) ร่วมกันผ่านเครือข่าย ตามต้องการ จัดสรรเร็ว ใช้แรงจัดการน้อย","5 ลักษณะ: On-demand self-service, Broad network access, Resource pooling, Rapid elasticity, Measured service","Deployment: Public, Private, Hybrid, Community","Service: IaaS, PaaS, SaaS"],how:"ขึ้นต้นด้วยนิยาม 1 ประโยค แล้วไล่ 5 ลักษณะ + 3 service + 4 deployment",e:"แทนที่จะสร้างโรงไฟฟ้าเอง ก็เสียบปลั๊กใช้ไฟแล้วจ่ายตามหน่วย Cloud ก็คือไอทีแบบจ่ายตามใช้",d:[["Elasticity vs Scalability","Elasticity ขยาย/หดอัตโนมัติตามโหลด / Scalability ความสามารถรองรับโหลดที่โตขึ้น"],["Public vs Private vs Hybrid","ใช้ร่วมกับคนอื่น / ใช้องค์กรเดียว / ผสมกัน"]]},
{t:"SSRM: CSP vs CSC",ssrm:1,a:["หลักการ: ยิ่งไป SaaS ผู้ให้บริการ (CSP) ดูแลมาก ลูกค้า (CSC) ดูแลน้อยลง","ข้อมูลและการกำหนดสิทธิ์ผู้ใช้ เป็นของลูกค้าเสมอ ทุกโมเดล","ฟ้า = ลูกค้า, เทา = CSP"],m:["On-prem: ลูกค้าดูแลทุกชั้น ตั้งแต่ห้อง server จนถึงข้อมูล","IaaS: CSP ดูแลฮาร์ดแวร์ + virtualization / ลูกค้าดูแล OS, patch, firewall rule, app, data","PaaS: CSP ดูแล OS + runtime / ลูกค้าดูแลโค้ด, config, ข้อมูล","SaaS: CSP ดูแลเกือบทั้งหมด / ลูกค้าดูแลข้อมูล, บัญชีผู้ใช้, MFA, สิทธิ์","ความผิดพลาดยอดฮิต: ตั้ง storage bucket เป็น public คือ misconfiguration ที่ลูกค้าต้องรับผิดชอบ"],how:"วาดตารางชั้น × โมเดลนี้ แล้วระบายสีแยก CSP/CSC พร้อมประโยคสรุป 'ข้อมูลเป็นของเราเสมอ'",e:"On-prem = ทำอาหารเองหมด / IaaS = เช่าครัว / PaaS = มีครัวและเตา เราแค่ปรุง / SaaS = สั่งเดลิเวอรี แต่ยังต้องเลือกว่าใครรับของได้",d:[["IaaS vs PaaS vs SaaS ตัวอย่าง","AWS EC2 / Heroku, App Engine / Microsoft 365, Gmail"],["Responsibility vs Accountability","ถึง CSP ดูแลโครงสร้าง ลูกค้ายังรับผิดชอบต่อข้อมูลตัวเอง"]]},
{t:"Data Life Cycle",flow:["Create/Collect","Store","Use","Share/Disclose","Archive","Destroy"],a:["Create/Collect: เก็บเท่าที่จำเป็น ขอความยินยอม (PDPA)","Store: จัดชั้นความลับ, เข้ารหัส, สำรอง","Use: จำกัดสิทธิ์ตามหน้าที่ (least privilege)","Share: เปิดเผยเท่าที่ได้รับอนุญาต เข้ารหัสขณะส่ง","Archive: เก็บตามระยะเวลากฎหมาย","Destroy: ทำลายอย่างปลอดภัยเมื่อหมดความจำเป็น"],how:"วาดเป็นวงกลม 6 ขั้น แล้วใต้แต่ละขั้นเขียนมาตรการ security 1 ข้อ",e:"เหมือนชีวิตของสมุดบันทึก: เขียน เก็บ เปิดอ่าน ให้เพื่อนดู เก็บเข้าตู้ แล้วฉีกทิ้งเมื่อไม่ต้องใช้",d:[["Archive vs Backup","Archive = เก็บข้อมูลเก่าระยะยาว / Backup = สำเนาไว้กู้คืน"],["Delete vs Destroy","Delete แค่ซ่อน กู้ได้ / Destroy ทำให้กู้ไม่ได้"]]},
{t:"Incident Response Process",flow:["Preparation","Detection","Analysis","Containment","Eradication","Recovery","Lessons Learned"],a:["Preparation: แผน IR, ทีม, เครื่องมือ, ซ้อมแผน","Detection/Analysis: ตรวจ alert, ยืนยันว่าเป็น incident จริง, จัดระดับความรุนแรง","Containment: จำกัดความเสียหาย (isolate)","Eradication: กำจัดต้นเหตุ","Recovery: กู้ระบบกลับสู่ปกติ","Lessons Learned: ทบทวน ปรับปรุง ป้องกันซ้ำ"],m:["Preparation: IR plan, รายชื่อติดต่อ, playbook, ซ้อมแบบ tabletop, ติดตั้ง logging/SIEM","Detection มาจาก SIEM, IDS/IPS, EDR และรายงานจากผู้ใช้","Triage ตามผลกระทบ: ข้อมูลรั่ว > ระบบหยุด > กระทบน้อย","Lessons Learned ควรทำให้เร็วหลังจบเหตุ ได้รายงานและแผนปรับปรุง กลับไปแก้ Preparation"],how:"วาดเป็นวง (วนกลับไป Preparation) เพราะบทเรียนกลับไปปรับแผนด้วย",e:"ไฟไหม้: ซ้อมหนีไฟ → ได้ยินสัญญาณ → ปิดประตูกันไฟลาม → ดับไฟ → ซ่อมบ้าน → คุยกันว่าทำไมไฟไหม้",d:[["Event vs Incident","Event คือเหตุการณ์ทั่วไป / Incident คือเหตุที่กระทบความมั่นคงจริง"],["Containment vs Eradication","ตัวแรก 'หยุดไม่ให้ลาม' ตัวหลัง 'ถอนรากถอนโคน'"]]},
{t:"Eradication and Recovery",flow:["Eradicate","Rebuild/Patch","Restore (clean backup)","Validate","Monitor"],a:["Eradication: ลบ malware, ปิดบัญชีที่ถูกยึด, ปิดช่องโหว่ (patch), reimage เครื่อง","Recovery: restore จาก backup ที่สะอาด, ทยอยเปิดบริการ, ตรวจสอบว่าทำงานปกติ","Monitor: เฝ้าระวังเพิ่มว่าผู้โจมตีกลับมาไหม","ลำดับ: ลบต้นเหตุก่อน แล้วค่อยกู้ ไม่งั้นโดนซ้ำ"],how:"เน้นสองประโยค: 'ลบสาเหตุให้หมดก่อน' และ 'กู้จากแหล่งที่เชื่อถือได้ แล้วทดสอบก่อนเปิด'",e:"ปลวกกินบ้าน: กำจัดปลวกให้หมดก่อน แล้วค่อยซ่อมและเข้าอยู่ใหม่ ถ้าซ่อมก่อน ปลวกก็กินต่อ",d:[["Recovery vs Restore","Recovery คือทั้งกระบวนการ / Restore คือกู้ข้อมูลจาก backup"],["Reimage vs Clean","Reimage ปลอดภัยกว่าเพราะสร้างใหม่ทั้งหมด"]]},
{t:"Forensic Response",flow:["Legal hold","Identification","Collection/Acquisition","Preservation (hash)","Analysis","Reporting"],a:["Legal hold: ห้ามลบข้อมูลที่เกี่ยวข้อง","Collection: เก็บหลักฐานโดยมี chain of custody","Preservation: ทำสำเนา bit-by-bit, hash (SHA-256) พิสูจน์ว่าไม่ถูกแก้, ใช้ write blocker","Analysis: วิเคราะห์จากสำเนา ไม่ใช่ของจริง","Reporting: รายงานผลที่ศาลเชื่อถือได้"],how:"ย้ำสามคำสำคัญ: Chain of custody, Hash, Write blocker",e:"นักสืบที่เกิดเหตุ: ล้อมเทป ห้ามแตะ ถ่ายรูป ใส่ถุงหลักฐาน จดว่าใครถือเมื่อไหร่ แล้ววิเคราะห์จากสำเนา",d:[["IR vs Forensics","IR = กู้ระบบ หยุดภัย / Forensics = เก็บหลักฐานเพื่อกฎหมาย"],["Chain of custody vs Hash","Chain = บันทึกว่าใครถือ / Hash = พิสูจน์ว่าไม่ถูกแก้"]]},
{t:"Data Acquisition & Order of Volatility",flow:["CPU/Cache","RAM, ARP, process","Swap/Temp","Disk","Remote logs","Config/Topology","Archive/Backup"],a:["Order of Volatility = เก็บข้อมูลที่หายเร็วสุดก่อน (บนไปล่าง)","Acquisition: live (RAM, ระบบรันอยู่) vs dead (ดิสก์ปิดเครื่อง)","ใช้ write blocker, ทำ image ทั้งดิสก์, hash ก่อนและหลัง","ถ้าปิดเครื่อง RAM หายหมด จึงจับ RAM ก่อนเสมอ"],m:["ตัวอย่าง: CPU register/cache (หายใน ns), RAM (หายเมื่อปิดเครื่อง), swap/page file, ดิสก์, log บนเซิร์ฟเวอร์อื่น, ผังเครือข่าย, เทปสำรอง","ARP cache, routing table, connection ปัจจุบัน อยู่ในกลุ่มหายเร็วใกล้ RAM","ขั้นตอน: จับ RAM → image ดิสก์ผ่าน write blocker → hash → บันทึก chain of custody","ไม่ปิดเครื่องทันที เพราะจะเสียหลักฐานใน RAM เช่น process ของ malware หรือ key เข้ารหัส"],how:"ท่องเรียง 'เร็วหาย → คงทน' แล้วอธิบายเหตุผลว่าทำไมต้องเก็บตามนี้",e:"เก็บหลักฐานน้ำแข็งละลายก่อนหินที่เหลือ ถ้าชักช้า น้ำแข็งก็หายไปแล้ว",d:[["Live vs Dead acquisition","Live ได้ RAM แต่ระบบเปลี่ยนต่อเนื่อง / Dead ได้ดิสก์สะอาดแต่เสีย RAM"],["Image vs Copy","Image = bit-by-bit รวม slack/deleted / Copy ธรรมดาได้แค่ไฟล์"]]},
{t:"Risk Management Framework",flow:["Prepare","Categorize","Select controls","Implement","Assess","Authorize","Monitor"],a:["NIST RMF 7 ขั้น (SP 800-37): ไล่ตามภาพ","ภาพรวม: ระบุ → ประเมิน → จัดการ → เฝ้าติดตาม","การจัดการ: Mitigate, Transfer (ประกัน), Accept, Avoid","Risk = Likelihood × Impact"],m:["Categorize: จัดระดับผลกระทบ (Low/Moderate/High) ตาม C-I-A ของระบบ","Select: เลือก control จากชุดมาตรฐาน (เช่น NIST SP 800-53) แล้วปรับให้เหมาะ","Authorize: ผู้บริหารยอมรับความเสี่ยงที่เหลือ (residual risk) อย่างเป็นทางการ","ALE = SLE × ARO และ SLE = Asset Value × Exposure Factor"],how:"ถ้าโจทย์ให้วาด RMF ให้วาด 7 ขั้นเป็นวง และเขียนตัวอย่าง 1 ข้อใน 'Select' กับ 'Assess'",e:"ซื้อรถ: ประเมินว่าใช้ทำอะไร (categorize) เลือกอุปกรณ์ความปลอดภัย ติดตั้ง ตรวจ ขออนุมัติใช้ แล้วเช็กสภาพทุกปี",d:[["Mitigate vs Transfer vs Avoid vs Accept","ลดความเสี่ยง / โอนให้คนอื่น / เลิกกิจกรรม / ยอมรับความเสี่ยง"],["Quantitative vs Qualitative","ตัวเลข (ALE=SLE×ARO) / ระดับ สูง-กลาง-ต่ำ"]]},
{t:"BIA, RPO, RTO, MTD",a:["BIA: วิเคราะห์ว่าระบบใดสำคัญ หยุดแล้วเสียหายเท่าไร เพื่อกำหนดลำดับกู้","RPO: ยอมเสียข้อมูลย้อนหลังได้นานสุดเท่าไร (กำหนดความถี่ backup)","RTO: กู้ระบบให้กลับมาใช้งานได้ภายในกี่ชั่วโมง","MTD: หยุดนานสุดที่ธุรกิจทนได้ก่อนล้ม (RTO < MTD)","ตัวอย่าง: ระบบสั่งซื้อ backup ทุก 1 ชม. (RPO=1) กู้ได้ใน 4 ชม. (RTO=4) ถ้าเกิน 8 ชม. ธุรกิจเสียหายหนัก (MTD=8)"],m:["ขั้นตอน BIA: ระบุ process สำคัญ → ประเมินผลกระทบ (เงิน/ชื่อเสียง/กฎหมาย) → กำหนด MTD, RTO, RPO → จัดลำดับการกู้","MTD = RTO + WRT (Work Recovery Time คือเวลาตรวจ/ทดสอบก่อนใช้งานจริง)","RPO ต่ำ = ต้อง backup/replicate ถี่และแพงขึ้น (real-time replication ได้ RPO ≈ 0)","ตัวอย่าง: ระบบธนาคาร RPO ≈ 0 ส่วนเว็บบล็อก RPO 24 ชม. ก็ยอมรับได้"],how:"ทุกคำตอบควรมีตัวอย่างตัวเลข และระบุ RTO ≤ MTD",e:"ร้านพิซซ่าไฟดับ: RPO = ยอมเสียออเดอร์ที่จดย้อนหลังกี่นาที, RTO = เปิดร้านใหม่กี่ชั่วโมง, MTD = ปิดนานเกินนี้ลูกค้าไปหมด",d:[["RPO vs RTO","RPO = ข้อมูล (ย้อนเวลา) / RTO = เวลา (กู้ระบบ)"],["RTO vs MTD","RTO คือเป้าหมายที่ตั้ง / MTD คือขีดตายที่ห้ามเกิน"]]},
{t:"Asset Management & Configuration Management",a:["Asset Mgmt: ทำทะเบียนทรัพย์สิน กำหนดเจ้าของ จัดชั้นความสำคัญ ดูแลตลอดวงจรชีวิต (ซื้อ ใช้ ดูแล ทำลาย)","Config Mgmt: ตั้งค่ามาตรฐาน (baseline) เก็บใน CMDB ควบคุมเวอร์ชัน ตรวจ drift","ความสัมพันธ์: ไม่รู้ว่ามีอะไร ก็ปกป้องไม่ได้ / ไม่รู้ว่าตั้งค่าอย่างไร ก็ตรวจผิดปกติไม่ได้"],how:"ตอบ 2 ท่อน: 'มีอะไรบ้าง' (asset) และ 'ตั้งค่าอย่างไร' (config) แล้วเชื่อมกันด้วยประโยคสุดท้าย",e:"ห้องสมุด: asset คือสมุดทะเบียนหนังสือทุกเล่ม config คือกฎว่าแต่ละเล่มต้องวางชั้นไหน",d:[["Asset vs Configuration","Asset = สิ่งที่มี / Configuration = สภาพการตั้งค่า"],["Baseline vs Drift","Baseline = ค่ามาตรฐาน / Drift = ตั้งค่าเปลี่ยนไปจากเดิม"]]},
{t:"Change Control & Change Management",flow:["Request","Impact analysis","Approval (CAB)","Test","Backout plan","Implement","Document"],a:["Change Management: กรอบและนโยบายทั้งหมดของการเปลี่ยนแปลง (คน กระบวนการ สื่อสาร)","Change Control: ขั้นตอนเฉพาะที่ขอ พิจารณา อนุมัติ ทดสอบ ทำ และบันทึกแต่ละ change","จุดสำคัญ: backout/rollback plan และ maintenance window"],how:"แยกให้ชัด 'ภาพใหญ่' vs 'ขั้นตอนรายครั้ง' แล้ววาด flow ของ control",e:"Change management คือกฎของหมู่บ้านว่าการสร้างอะไรต้องขออนุญาต Change control คือใบขออนุญาตของแต่ละบ้าน",d:[["Management vs Control","Management = นโยบาย/กรอบ / Control = วิธีปฏิบัติทีละ change"],["Standard vs Emergency change","Standard = ผ่านการอนุมัติไว้ล่วงหน้า / Emergency = เร่งด่วน มีขั้นตอนลัด"]]},
{t:"Physical Security",a:["Perimeter: รั้ว, bollard, ไฟส่องสว่าง (ยับยั้ง/ป้องกัน)","Access control: บัตร, biometrics, Access Control Vestibule (mantrap) กัน tailgating","Surveillance: CCTV + รปภ. (ตรวจจับ/ตรวจสอบย้อนหลัง)","Sensors/Alarms: motion, infrared, door sensor","Locks/Cages/Safes/Cable lock: ป้องกันตัวอุปกรณ์"],how:"จัดกลุ่มตามหน้าที่ Deter / Prevent / Detect / Delay แล้วยกตัวอย่างให้ครบ 5 ข้อ",e:"ปราสาท: คูน้ำ (perimeter) ประตูสองชั้น (mantrap) ทหารยาม+กล้อง (CCTV) กระดิ่งเตือน (sensor) และตู้เซฟเก็บสมบัติ",d:[["Tailgating vs Piggybacking","Tailgating = ตามเข้าโดยไม่รู้ตัว / Piggybacking = ผู้มีสิทธิ์ยอมให้เข้า"],["Preventive vs Detective","กล้อง CCTV เป็น detective ส่วนล็อกเป็น preventive"]]},
{t:"Secure Data Destruction",a:["NIST 800-88 มี 3 ระดับ: Clear, Purge, Destroy","Clear: เขียนทับ (overwrite) ใช้ซ้ำได้","Purge: Degauss (HDD แม่เหล็ก), Crypto erase (ลบ key), Secure Erase (SSD)","Destroy: Shred, Pulverize, Incinerate ทำลายกายภาพ","ขอ Certificate of Destruction เป็นหลักฐาน"],m:["เลือกวิธีตามสื่อ: HDD → overwrite/degauss/shred, SSD → crypto erase/secure erase/shred, กระดาษ → shred/pulp/burn","เขียนทับ SSD ไม่น่าเชื่อถือ เพราะ wear leveling ทำให้ข้อมูลค้างในเซลล์ที่ OS เข้าไม่ถึง","บันทึกหลักฐาน: Certificate of Destruction, ผู้ทำ, วันที่, serial number","อย่าลืมอุปกรณ์แฝง: เครื่องพิมพ์ สแกนเนอร์ มือถือ USB ที่มี memory เก็บข้อมูล"],how:"จัดเป็นบันได Clear < Purge < Destroy และบอกว่าเลือกตามระดับความลับของข้อมูล",e:"จดความลับบนกระดาน: ลบแล้วยังเห็นรอย (delete) เขียนทับ (clear) ละลายหมึก (purge) หรือเผากระดาษ (destroy)",d:[["Delete vs Wipe vs Degauss vs Shred","Delete = ลบ index / Wipe = เขียนทับ / Degauss = ใช้แม่เหล็ก (ไม่ได้ผลกับ SSD) / Shred = ทำลายกายภาพ"],["Crypto erase vs Overwrite","ลบ key ทำให้ข้อมูลเข้ารหัสอ่านไม่ได้ ไม่ต้องเขียนทับทั้งดิสก์"]]}
];
const N=T.length;T.push({t:"⚠ สิ่งที่ควรระวัง",pg:1,a:[["Containment ≠ Eradication ≠ Recovery","หยุดไม่ให้ลาม ≠ ถอนต้นเหตุ ≠ กู้ระบบกลับมา เขียนสลับลำดับเสียคะแนนง่ายที่สุด"],["IR ≠ Forensics","IR เป้าหมายคือหยุดภัยและกู้ระบบ Forensics เป้าหมายคือหลักฐานที่ใช้ทางกฎหมาย อย่าอธิบายสองข้อนี้เหมือนกัน"],["RPO ≠ RTO ≠ MTD","RPO คือ 'ข้อมูล' ที่ยอมเสีย RTO คือ 'เวลา' กู้ระบบ MTD คือขีดสูงสุดที่ธุรกิจทนได้ และ RTO ต้องน้อยกว่า MTD"],["SSRM: ข้อมูลเป็นของลูกค้าเสมอ","แม้เป็น SaaS ลูกค้ายังรับผิดชอบข้อมูล บัญชีผู้ใช้ และสิทธิ์ อย่าเขียนว่า CSP ดูแลทุกอย่าง"],["Order of Volatility: RAM ก่อนดิสก์","ห้ามปิดเครื่องก่อนเก็บ RAM และต้องวิเคราะห์จาก 'สำเนา' ที่ hash แล้ว ไม่ใช่ต้นฉบับ"],["Backup ≠ Archive, Delete ≠ Destroy","Backup ไว้กู้คืน Archive ไว้เก็บระยะยาว / Delete แค่ลบ index ยังกู้ได้ Destroy กู้ไม่ได้"],["Degauss ใช้กับ SSD ไม่ได้ผล","Degauss ใช้ได้กับสื่อแม่เหล็ก (HDD, เทป) ส่วน SSD ใช้ crypto erase, secure erase หรือทำลายกายภาพ"],["Change Management ≠ Change Control","Management คือกรอบนโยบายทั้งหมด Control คือขั้นตอนอนุมัติ ทดสอบ ทำ ของแต่ละ change"],["MDM ≠ MAM","MDM คุมทั้งเครื่อง MAM คุมเฉพาะแอป/ข้อมูลงาน เหมาะกับ BYOD"],["โจทย์ 'ระบุ 5 วิธี'","ต้องครบ 5 ข้อ และทุกข้อต้องมีคำอธิบายการทำงาน ไม่ใช่แค่ชื่อ / โจทย์ 'วาดภาพ' ต้องมีภาพจริงเสมอ"],["ตำราแต่ละเล่มเรียงขั้นไม่เหมือนกัน","IR (NIST vs Security+), Tailgating/Piggybacking บางเล่มให้นิยามต่างกัน ให้ใช้ตามสไลด์อาจารย์เป็นหลัก"]]},{t:"📌 ต้องจำให้แม่น",pg:2,a:[["Cloud 5 ลักษณะ (NIST)","On-demand self-service, Broad network access, Resource pooling, Rapid elasticity, Measured service"],["Cloud: Service 3 / Deployment 4","IaaS, PaaS, SaaS / Public, Private, Hybrid, Community"],["Incident Response 7 ขั้น","Preparation → Detection → Analysis → Containment → Eradication → Recovery → Lessons Learned"],["NIST RMF 7 ขั้น","Prepare → Categorize → Select → Implement → Assess → Authorize → Monitor"],["Order of Volatility (เร็วหาย → คงทน)","CPU/Cache → RAM/ARP/process → Swap/Temp → Disk → Remote logs → Config/Topology → Archive/Backup"],["Data Life Cycle 6 ขั้น","Create/Collect → Store → Use → Share → Archive → Destroy"],["Risk Response 4 แบบ","Mitigate (ลด), Transfer (โอน), Accept (ยอมรับ), Avoid (หลีกเลี่ยง)"],["สูตรที่ต้องจำ","Risk = Likelihood × Impact / SLE = AV × EF / ALE = SLE × ARO / MTD = RTO + WRT"],["NIST 800-88 ระดับการทำลายข้อมูล","Clear (เขียนทับ) < Purge (degauss, crypto erase) < Destroy (shred, pulverize, incinerate)"],["Forensic: คำสำคัญ 3 คำ","Chain of custody, Hash, Write blocker"],["Third Party: เอกสารสัญญา 5 ชนิด","SLA, MOU/MOA, MSA, NDA, BPA"]]});const P=[
"Host Security Solutions คือมาตรการป้องกันที่ติดตั้งบนตัวเครื่อง (endpoint) เอง เพื่อเป็นด่านสุดท้ายเมื่อเครือข่ายถูกเจาะ วิธีสำคัญ 5 วิธี ได้แก่ 1) EDR/XDR ตรวจจับพฤติกรรมผิดปกติบนเครื่องและตอบโต้ เช่น isolate เครื่อง 2) Host-based Firewall กรอง traffic เข้าออกเฉพาะเครื่องนั้น 3) HIDS/HIPS ตรวจจับ (และบล็อก) กิจกรรมน่าสงสัยบนโฮสต์ 4) Full Disk Encryption ร่วมกับ TPM ทำให้ข้อมูลอ่านไม่ได้เมื่อเครื่องสูญหาย 5) Hardening และ Patch Management ปิด service ที่ไม่จำเป็นและอุดช่องโหว่ตาม baseline",
"การบริหารความเสี่ยงจากบุคคลภายนอก คือกระบวนการควบคุมความเสี่ยงที่มาจาก vendor, supplier หรือ partner ที่เข้าถึงระบบหรือข้อมูลขององค์กร เริ่มจากคัดเลือกและทำ due diligence ประเมินความเสี่ยง แล้วทำสัญญาที่ระบุข้อกำหนดด้านความปลอดภัย เช่น SLA, NDA และสิทธิ์ตรวจสอบ (right to audit)|เมื่อเริ่มใช้งานจึง onboard และติดตามประเมินผลอย่างต่อเนื่อง สุดท้ายเมื่อเลิกสัญญา (offboard) ต้องเพิกถอนสิทธิ์และคืนหรือทำลายข้อมูล เพราะช่องโหว่ของ vendor อาจกลายเป็นช่องทางโจมตีองค์กร (supply chain attack)",
"MDM คือระบบบริหารจัดการอุปกรณ์เคลื่อนที่แบบรวมศูนย์ ประกอบด้วย console สำหรับผู้ดูแลและ agent บนอุปกรณ์ เริ่มจาก enroll อุปกรณ์เข้าระบบ แล้วส่ง policy ไปบังคับใช้ เช่น กำหนด PIN เข้ารหัสเครื่อง ห้าม root/jailbreak ระบบจะตรวจ compliance และบล็อกอุปกรณ์ที่ไม่ผ่านไม่ให้เข้าถึงข้อมูลองค์กร|นอกจากนี้ยังติดตั้งหรือถอดแอปได้ แยกข้อมูลงานออกจากส่วนตัว (containerization) และเมื่ออุปกรณ์สูญหายสามารถสั่ง remote lock หรือ remote wipe ได้",
"การรักษาความปลอดภัยมือถือแก้ปัญหาหลัก 3 อย่าง คือเครื่องถูกขโมย มัลแวร์ และการดักข้อมูล โดยมี 5 วิธี ได้แก่ 1) Screen lock และ biometrics ป้องกันผู้อื่นใช้เครื่อง 2) Full device encryption ทำให้ข้อมูลอ่านไม่ได้แม้ได้เครื่องไป 3) Remote wipe ลบข้อมูลทางไกลเมื่อเครื่องหาย 4) Containerization แยกแอปและข้อมูลงานจากส่วนตัว 5) ติดตั้งแอปจาก official store เท่านั้น ห้าม sideload/root/jailbreak และใช้ VPN เมื่อต่อ Wi-Fi สาธารณะ",
"Web Application Security คือการป้องกันช่องโหว่ในเว็บแอปพลิเคชัน มี 5 วิธี ได้แก่ 1) Input validation และ output encoding ไม่เชื่อข้อมูลจากผู้ใช้ ช่วยกัน injection และ XSS 2) Parameterized query แยกคำสั่ง SQL ออกจากข้อมูลเพื่อกัน SQL injection 3) WAF กรอง HTTP request ที่เป็นการโจมตีในชั้น application 4) Secure session management เช่น cookie แบบ HttpOnly/Secure/SameSite, CSRF token และใช้ HTTPS/TLS 5) ทดสอบความปลอดภัย เช่น code review, SAST, DAST พร้อมอัปเดต library เพื่อหาช่องโหว่ก่อนใช้งานจริง",
"ตามนิยามของ NIST Cloud Computing คือโมเดลที่ให้ผู้ใช้เข้าถึงทรัพยากรไอทีที่ใช้ร่วมกัน เช่น เซิร์ฟเวอร์ พื้นที่จัดเก็บ เครือข่าย และแอปพลิเคชัน ผ่านเครือข่ายตามความต้องการ จัดสรรได้รวดเร็วโดยใช้ความพยายามในการบริหารจัดการน้อย|มี 5 ลักษณะสำคัญ คือ on-demand self-service, broad network access, resource pooling, rapid elasticity และ measured service แบ่ง service model เป็น IaaS, PaaS, SaaS และ deployment model เป็น public, private, hybrid, community",
"SSRM กำหนดว่าผู้ให้บริการคลาวด์ (CSP) และลูกค้า (CSC) รับผิดชอบความปลอดภัยในส่วนใด หลักคือยิ่งบริการอยู่ในระดับสูงขึ้น CSP ดูแลมากขึ้น ลูกค้าดูแลน้อยลง ตามภาพ On-prem ลูกค้าดูแลทุกชั้น|IaaS: CSP ดูแลฮาร์ดแวร์ เครือข่าย และ virtualization ลูกค้าดูแล OS แอป และข้อมูล|PaaS: CSP ดูแลถึง OS และ runtime ลูกค้าดูแลโค้ดและข้อมูล|SaaS: CSP ดูแลเกือบทั้งหมด ลูกค้าดูแลข้อมูล บัญชีผู้ใช้ และสิทธิ์การเข้าถึง โดยข้อมูลเป็นความรับผิดชอบของลูกค้าเสมอในทุกโมเดล",
"วงจรชีวิตข้อมูลส่วนบุคคลมี 6 ขั้น ตามภาพ เริ่มจากสร้าง/เก็บรวบรวม (Create/Collect) ซึ่งควรเก็บเท่าที่จำเป็นและได้รับความยินยอม ต่อมาจัดเก็บ (Store) โดยจัดชั้นความลับและเข้ารหัส แล้วนำไปใช้ (Use) โดยจำกัดสิทธิ์ตามหน้าที่ จากนั้นแบ่งปัน/เปิดเผย (Share) เฉพาะที่ได้รับอนุญาต เมื่อไม่ใช้งานประจำแล้วจึงเก็บถาวร (Archive) ตามระยะเวลาที่กฎหมายกำหนด และสุดท้ายทำลาย (Destroy) อย่างปลอดภัยเมื่อหมดความจำเป็น",
"กระบวนการ Incident Response มี 7 ขั้น ตามภาพ เริ่มจาก Preparation เตรียมแผน ทีม และเครื่องมือ จากนั้น Detection ตรวจพบเหตุ และ Analysis ยืนยันว่าเป็น incident จริงพร้อมประเมินความรุนแรง แล้ว Containment จำกัดความเสียหายไม่ให้ลุกลาม Eradication กำจัดสาเหตุ Recovery กู้ระบบกลับสู่การใช้งานปกติ และสุดท้าย Lessons Learned ทบทวนบทเรียนเพื่อปรับปรุงแผน ซึ่งย้อนกลับไปสู่ Preparation",
"Eradication คือการกำจัดสาเหตุของเหตุการณ์ให้หมดก่อน เช่น ลบมัลแวร์ ปิดหรือรีเซ็ตบัญชีที่ถูกยึด อุดช่องโหว่ด้วย patch และ reimage เครื่องที่ติดเชื้อ|หลังจากนั้นจึงเข้าสู่ Recovery คือการกู้ระบบกลับมา โดย restore จาก backup ที่สะอาด ทยอยเปิดบริการ ทดสอบว่าระบบทำงานปกติ และเฝ้าระวังเพิ่มเติมว่าผู้โจมตีย้อนกลับมาอีกหรือไม่ ลำดับสำคัญคือกำจัดต้นเหตุก่อนกู้ มิฉะนั้นระบบที่กู้แล้วอาจถูกโจมตีซ้ำ",
"Forensic Response เป็นกระบวนการเก็บและวิเคราะห์หลักฐานดิจิทัลให้ใช้ได้ทางกฎหมาย ตามภาพ เริ่มจาก legal hold ห้ามลบข้อมูลที่เกี่ยวข้อง ระบุแหล่งหลักฐาน (Identification) แล้วเก็บหลักฐาน (Collection) พร้อมบันทึก chain of custody|จากนั้นรักษาสภาพหลักฐาน (Preservation) ด้วยการทำสำเนา bit-by-bit ผ่าน write blocker และ hash เพื่อพิสูจน์ว่าไม่ถูกแก้ไข วิเคราะห์จากสำเนา และจัดทำรายงาน (Reporting)",
"Data acquisition คือการทำสำเนาข้อมูลหลักฐานจากอุปกรณ์ โดยต้องเก็บตาม Order of Volatility คือเก็บข้อมูลที่หายเร็วที่สุดก่อน เรียงจาก CPU register/cache, RAM (รวม ARP cache, routing table, process), swap/temp file, ดิสก์, log ที่อยู่ระบบอื่น, การตั้งค่าและผังเครือข่าย ไปจนถึงสื่อสำรอง|ไม่ควรปิดเครื่องทันที เพราะข้อมูลใน RAM จะหาย ระหว่างเก็บควรใช้ write blocker ทำ image ทั้งดิสก์ และ hash ก่อนและหลังเพื่อยืนยันความถูกต้อง",
"RMF ของ NIST เป็นกรอบการบริหารความเสี่ยงของระบบสารสนเทศ มี 7 ขั้น ตามภาพ ได้แก่ Prepare เตรียมองค์กร, Categorize จัดระดับผลกระทบของระบบ, Select เลือก control, Implement ติดตั้ง control, Assess ประเมินว่า control ทำงานตามที่ตั้งใจ, Authorize ผู้บริหารอนุมัติให้ใช้โดยยอมรับความเสี่ยงที่เหลือ และ Monitor เฝ้าติดตามต่อเนื่องแล้วปรับปรุง|ความเสี่ยงที่พบจัดการได้ 4 แบบ คือ mitigate, transfer, accept, avoid",
"BIA คือการวิเคราะห์ผลกระทบทางธุรกิจ เพื่อดูว่ากระบวนการใดสำคัญและหากหยุดจะเสียหายเท่าใด ใช้กำหนดลำดับการกู้คืน|RPO คือปริมาณข้อมูลสูงสุดที่ยอมสูญเสียได้ วัดเป็นเวลาย้อนหลัง เช่น backup ทุก 1 ชั่วโมง RPO = 1 ชั่วโมง|RTO คือเวลาสูงสุดที่ใช้กู้ระบบให้กลับมาใช้งาน เช่น 4 ชั่วโมง|MTD คือเวลาหยุดนานที่สุดที่ธุรกิจทนได้ เช่น 8 ชั่วโมง โดย RTO ต้องน้อยกว่า MTD",
"Asset Management คือการบริหารทรัพย์สินขององค์กรตลอดวงจรชีวิต ตั้งแต่จัดซื้อ ใช้งาน ดูแลรักษา จนถึงทำลาย โดยมีทะเบียนทรัพย์สิน ระบุเจ้าของ และจัดระดับความสำคัญ|Configuration Management คือการกำหนดค่ามาตรฐาน (baseline) ของระบบ เก็บข้อมูลการตั้งค่าใน CMDB ควบคุมเวอร์ชัน และตรวจหา configuration drift ทั้งสองเกี่ยวข้องกัน เพราะถ้าไม่รู้ว่ามีทรัพย์สินอะไรก็ปกป้องไม่ได้ และถ้าไม่รู้ว่าตั้งค่าอย่างไรก็ตรวจความผิดปกติไม่ได้",

["IRP vs DRP vs BCP vs COOP (สไลด์ 19)",U("BCP เป็นแผนแม่ แตกเป็น IRP และ DRP (ตามที่อาจารย์วาด)|DRP: วางแผนตอบสนองและกู้คืนจาก major incident|BCP: ทำให้ business procedure ยืดหยุ่น (resilient)|COOP: อาจารย์โน้ตว่าคล้าย BCP แต่เน้นเชิงปฏิบัติการ (อ่านลายมือ อาจคลาดเคลื่อน)|Retention policy: กำหนดข้อกำหนดด้าน digital forensics และการเก็บรักษาหลักฐาน")],
["Identification & SIEM (สไลด์ 22-25)",U("ช่องทางตรวจพบ: IDS, log analysis, alerts (ไฮไลต์), manual inspection, public reporting, whistleblowing|First responder = สมาชิก CIRT ที่รับผิดชอบเหตุที่ถูกรายงาน|Alert ความสำคัญต่ำลดเป็น log-only|SIEM: correlation (static rules, threat intel feeds, AI) + retention เก็บหลักฐาน/ทำ threat hunting|Dashboard: analyst (alert ต้องสอบสวน) / manager (สถานะรวม) ระดับ log only / alert / alarm|Trend analysis: ตรวจ indicator ตามช่วงเวลา คาดการณ์เหตุการณ์ในอนาคต แบบ frequency, volume, statistical deviation")],
["Logs & Data sources (สไลด์ 26-30)",U("Syslog: PRI = facility + severity (ประเภท/ระดับความรุนแรง), timestamp, host, message|rsyslog, syslog-ng, journalctl (binary log)|Nxlog = log normalization จัดรูปแบบ log ให้เป็นมาตรฐาน|OS logs: Application, Security, System, Setup, Forwarded events + network, authentication (RADIUS/TACACS+), vulnerability scan|Application logs: DNS, HTTP, VoIP/SIP, dump files (ข้อมูลจากหน่วยความจำ)|Metadata: ไฟล์ (date/time, security & extended attributes), web headers, email header, mobile CDRs|Network: protocol analyzer, NetFlow/IPFIX, sFlow (ใช้ sampling ประมาณสถิติ), bandwidth monitor")],
["Containment (สไลด์ 33)",U("ต้องชั่งน้ำหนัก: ความเสียหาย / countermeasure ที่มี / หลักฐานที่เก็บได้|Isolation-based: ถอดระบบออก ถอดไฟ ตัดการสื่อสารเครือข่าย ปิดบัญชีหรือแอป|Segmentation-based: VLAN, subnet, firewall ACL กันไม่ให้โฮสต์สื่อสารออกนอก segment|วิเคราะห์การโจมตีด้วย sinkhole, honeynet, sandbox")],
["Mitigation: Firewall / Content filter / Endpoint (สไลด์ 35-37)",U("Firewall: วิเคราะห์ attack vector, ลด attack surface, egress filtering, ตรวจ covert channel|Content filter: SWG (egress filtering), DLP, MDM ตรวจว่าถูกหลบเลี่ยงหรือไม่, เพิกถอน/ออก certificate ใหม่ (re-key)|Endpoint: ประเมิน attack surface ใหม่ (social engineering, ช่องโหว่, configuration drift), allow/block list + least privilege, quarantine ใน sandbox")],
["SOAR & Adversarial AI (สไลด์ 38-39)",U("Automation = ทำงานซ้ำอัตโนมัติ / Orchestration = ประสานหลายเครื่องมือ|SOAR ใช้ใน incident response และ threat hunting เชื่อม SIEM, API, CTI feeds, UEBA|Runbook vs Playbook: ดูความต่างตามสไลด์ (playbook = SOP จาก incident)|Adversarial AI: ผู้โจมตีส่ง tainted samples ให้ ML เรียนรู้ผิด ต้องปกป้อง training data")]
]});
const L=["Data","Application","Runtime / OS","Virtualization","Server/Storage/Network","Physical"],M=[["C","C","C","C"],["C","C","C","P"],["C","C","P","P"],["C","P","P","P"],["C","P","P","P"],["C","P","P","P"]];
const $=id=>document.getElementById(id);let i=0,tb=0,md=0,qz=false,rev=false,done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem("ns")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("ns",JSON.stringify([...done]))}catch(e){}};
const TB=["คำตอบ","วิธีตอบ","ELI5","แยกให้ออก"];
function body(x){
if(x.pg)return x.a.map((a,j)=>`<div class="${x.pg==2?"dif mem":"dif"}"><strong>${a[0]}</strong>${a[1]}${x.pg==2&&X[j]?`<ul>${X[j].split("|").map(s=>`<li>${s}</li>`).join("")}</ul>`:""}</div>`).join("");
if(tb==1)return`<p>${x.how}</p><p class="hint">เคล็ดลับ: คำถาม "วาดภาพ" ให้วาดก่อน 1 ภาพ แล้วเขียนบรรยายสั้นๆ ใต้ภาพ</p>`;
if(tb==2)return`<p>${x.e}</p>`;
if(tb==3)return x.d.map(d=>`<div class="dif"><strong>${d[0]}</strong>${d[1]}</div>`).join("");
let h="";
if(x.flow)h+=`<div class="flow">${x.flow.map(f=>`<span>${f}</span>`).join("<b>›</b>")}</div>`;
if(x.ssrm)h+=`<div class="ox"><table><tr><th></th><th>On-prem</th><th>IaaS</th><th>PaaS</th><th>SaaS</th></tr>${L.map((l,r)=>`<tr><th>${l}</th>${M[r].map(c=>`<td class="${c}">${c=="C"?"ลูกค้า":"CSP"}</td>`).join("")}</tr>`).join("")}</table></div><br>`;
if(md&&P[T.indexOf(x)])return h+P[T.indexOf(x)].split("|").map(s=>`<p>${s}</p>`).join("");return h+`<ul>${x.a.map(a=>`<li>${a}</li>`).join("")}</ul>`+(x.m?`<h3>ขยายความ (เขียนเพิ่มถ้าต้องการคะแนนเต็ม)</h3><ul>${x.m.map(a=>`<li>${a}</li>`).join("")}</ul>`:"")}
function draw(){
const x=T[i];
$("nav").innerHTML=T.map((o,k)=>`<button class="${k==i?"on ":""}${done.has(k)?"dn":""}" data-k="${k}">${o.pg?"":(k+1)+". "}${o.t}</button>`).join("");
$("c").innerHTML=`<h2>${x.pg?"":"ข้อ "+(i+1)+": "}${x.t}</h2><div class="tabs">${(x.pg?[]:TB).map((n,k)=>`<button class="${k==tb?"on":""}" data-b="${k}">${n}</button>`).join("")}</div>${tb==0&&!x.pg?`<div class="tabs"><button class="${md?"":"on"}" data-m="0">แบบสรุป</button><button class="${md?"on":""}" data-m="1">แบบเขียนตอบ (paragraph)</button></div>`:""}<div class="${qz&&!rev?"q":""}"><div class="body">${body(x)}</div></div>${qz&&!rev?'<p class="hint">คลิกที่เนื้อหาเพื่อเฉลย (ลองตอบในใจก่อน)</p>':""}<div class="foot"><button data-n="-1">ก่อนหน้า</button><button data-d="1">${done.has(i)?"ยกเลิกทำเครื่องหมาย":"ทบทวนแล้ว ✓"}</button><button data-n="1">ถัดไป</button></div>`;
$("pg").style.width=[...done].filter(k=>k<N).length/N*100+"%"}
document.addEventListener("click",e=>{
const b=e.target.closest("[data-k],[data-b],[data-n],[data-d],[data-m],.q .body");
if(e.target.closest(".q .body")){rev=true;draw();return}
if(!b)return;const d=b.dataset;
if(d.k!=null){i=+d.k;rev=false}
if(d.b!=null){tb=+d.b;rev=false}
if(d.m!=null){md=+d.m;rev=false}
if(d.n!=null){i=(i+ +d.n+T.length)%T.length;rev=false}
if(d.d){done.has(i)?done.delete(i):done.add(i);save()}
draw()});
$("qz").onclick=()=>{qz=!qz;rev=false;$("qz").textContent="โหมดทดสอบตัวเอง: "+(qz?"เปิด":"ปิด");draw()};
$("th").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue("--bg").trim()=="#11181c";r.dataset.theme=d?"light":"dark"};
draw();
</script></body></html>
